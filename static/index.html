<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Research Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090B; --chrome:#0B0E12; --panel:#101318; --panel-head:#0D1014;
  --border:#1E242C; --row-rule:#151A20; --head-rule:#262E37;
  --on:#E3E7EC; --label:#C9D1D9; --muted:#9AA4AF; --dim:#7A8591; --faint:#3A434E;
  --amber:#F2A541; --amber-soft:rgba(242,165,65,0.10); --amber-ring:rgba(242,165,65,0.35);
  --blue:#5AA9FF; --blue-bar:#2F5F92; --orange:#FF7A45; --ask:#FF9F6E; --neutral:#4A5561;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;color:var(--on);font-size:12px}
button{font:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:1px solid var(--amber);outline-offset:-1px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
input::placeholder{color:#6F7A86}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#20262e}
::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* top bar */
#topbar{height:36px;flex-shrink:0;display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--chrome)}
#logo{width:48px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border)}
#logo span{width:24px;height:24px;background:var(--amber);color:var(--bg);font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center}
#tickets{display:flex;align-items:stretch;overflow-x:auto}
.ticket{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--border);white-space:nowrap;border-top:2px solid transparent}
.ticket .tname{font-weight:600;font-size:12px;letter-spacing:0.04em}
.ticket .tsub{font-size:10px;color:var(--dim)}
.ticket .tclose{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#6F7A86}
.ticket .tteam{width:3px;align-self:stretch;flex-shrink:0;margin:0 -4px 0 -12px}
#tabgroup-div{width:1px;flex-shrink:0;background:var(--border);margin:8px 0}
#newticket{width:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);border-right:1px solid var(--border)}
#searchwrap{flex-grow:1;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:8px}
#searchbox{position:relative;display:flex;align-items:center;gap:8px;width:300px;height:24px;padding:0 8px;background:var(--bg);border:1px solid var(--head-rule)}
#q{flex-grow:1;min-width:0;background:none;border:0;color:var(--on);font:inherit;font-size:12px;outline:none}
#suggest{position:absolute;top:23px;left:-1px;right:-1px;z-index:50;background:var(--chrome);border:1px solid var(--head-rule);max-height:320px;overflow-y:auto}
#suggest .sg{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12px;color:var(--label);cursor:pointer}
#suggest .sg.on,#suggest .sg:hover{background:var(--amber-soft);color:var(--on)}
#suggest .sg .nm{flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#suggest .sg .nm b{color:var(--amber);font-weight:600}
#suggest .sg .meta{font-size:10px;color:var(--dim)}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 14px;border-left:1px solid var(--border);font-size:10.5px;color:var(--muted);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:3px;display:inline-block}

/* rail */
#rail{width:48px;flex-shrink:0;border-right:1px solid var(--border);background:var(--chrome);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.railbtn{width:48px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.railbtn.active{color:var(--amber);background:#141920}

/* context strip */
#ctx{height:60px;flex-shrink:0;display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--chrome);overflow-x:auto}
#ctx .who{display:flex;align-items:center;gap:10px;padding:0 16px;min-width:230px;flex-shrink:0;border-right:1px solid var(--border)}
#ctx .who .headshot{width:44px;height:44px;flex-shrink:0;border-radius:2px;background:#161B22;object-fit:cover;object-position:top}
#ctx .who .whotext{display:flex;flex-direction:column;justify-content:center}
#ctx .who .name{font-size:20px;font-weight:600;letter-spacing:0.02em}
#ctx .who .pos{font-size:11px;color:var(--amber)}
#ctx .who .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 14px;border-right:1px solid var(--border);flex-shrink:0}
.kpi .kl{font-size:10px;letter-spacing:0.08em;color:var(--dim);white-space:nowrap}
.kpi .kv{font-size:13px;white-space:nowrap}

/* workspace grid */
#grid{flex-grow:1;min-height:0;padding:8px;display:grid;grid-template-columns:760px minmax(0,1fr);gap:8px;overflow:hidden}
#leftcol{display:flex;flex-direction:column;gap:8px;min-height:0}
#rightcol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);min-height:0}
.panel-head{height:30px;flex-shrink:0;display:flex;align-items:stretch;background:var(--panel-head);border-bottom:1px solid var(--border);padding-left:10px;gap:4px}
.panel-title{display:flex;align-items:center;font-size:10px;letter-spacing:0.1em;color:var(--dim);font-weight:600;margin-right:8px;white-space:nowrap}
.tab{padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent;border-top:2px solid transparent}
.tab.small{font-size:11.5px;padding:0 7px}
.tab.on{color:var(--on);border-bottom-color:var(--amber)}
.tab .cnt{font-size:10px;color:var(--dim)}
.panel-body{flex-grow:1;min-height:0;overflow:auto}
.legend{display:flex;align-items:center;gap:12px;padding:0 10px;font-size:10px;color:var(--dim);margin-left:auto}
.swatch{width:8px;height:8px;display:inline-block}

#markets{height:280px;flex-grow:1}
#curve{height:230px;flex-shrink:0}
#book{height:280px;flex-shrink:0}
#lowerrow{flex-grow:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tab.heads{color:var(--amber)}
.tab.heads .cnt{color:var(--bg);background:var(--amber);padding:0 4px;font-weight:600}
.gl-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 4px;flex-wrap:wrap}
.gl-bar .gl-note{font-size:10px;color:var(--dim);margin-left:auto}
table.gl{width:100%;border-collapse:collapse;font-size:11px}
table.gl th{position:sticky;top:0;background:var(--panel);text-align:right;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);font-weight:500;border-bottom:1px solid var(--head-rule);padding:3px 6px;white-space:nowrap}
table.gl td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--row-rule);white-space:nowrap}
table.gl th.l,table.gl td.l{text-align:left}
table.gl tbody tr.link{cursor:pointer}
table.gl tbody tr.link:hover{background:var(--amber-soft)}
table.gl tbody tr.link:hover td.go{color:var(--amber)}
table.gl td.go{color:var(--faint);font-size:9.5px}
table.gl tr.tot td{border-top:1px solid var(--head-rule);border-bottom:0;color:var(--label)}
table.gl .w{color:var(--blue)}
table.gl .lo{color:var(--orange)}
table.gl .z{color:#3A434E}
.vs-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin:6px 8px}

table.t{width:100%;border-collapse:collapse;font-size:11px}
table.t thead th{text-align:left;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);font-weight:500;border-bottom:1px solid var(--head-rule);padding:2px 4px;white-space:nowrap}
table.t td{padding:2px 4px;border-bottom:1px solid var(--row-rule);white-space:nowrap}
.right{text-align:right}
.ladder-head{height:18px;display:grid;grid-template-columns:50px 30px 30px 28px minmax(0,1fr) 44px 36px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)}
.ladder-group{height:18px;display:flex;align-items:center;gap:8px;background:#0B0E12;border-bottom:1px solid #1A2027;padding:0 4px}
.ladder-row{height:17px;display:grid;grid-template-columns:50px 30px 30px 28px minmax(0,1fr) 44px 36px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule)}
.bar-track{flex-grow:1;height:7px;background:#161B22;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue-bar)}
.bar-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.stat-tiles{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.stat-tile{background:var(--panel-head);padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.stat-tile .sl{font-size:9.5px;letter-spacing:0.08em;color:var(--dim)}
.stat-tile .sv{font-size:13px}
.rankbar{height:6px;background:#161B22;position:relative}
.rankbar-fill{position:absolute;left:0;top:0;bottom:0}
.pill{font-size:9.5px;font-weight:600;padding:1px 5px}
.empty{padding:16px;color:var(--dim);font-size:12px;text-align:center}
.slot-head{display:flex;align-items:baseline;gap:10px;padding:14px 2px 6px;border-bottom:1px solid var(--head-rule);margin-bottom:8px}
.slot-head:first-child{padding-top:2px}
.slot-head .sn{font-size:11px;letter-spacing:0.1em;color:var(--amber);font-weight:600}
.slot-head .sc{font-size:10px;color:var(--dim)}
.game-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.game-card{cursor:pointer;background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column}
.game-card:hover{border-color:var(--amber-ring);background:#12161C}
.game-card .gc-top{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--panel-head);border-bottom:1px solid var(--border);font-size:10px;color:var(--dim);letter-spacing:0.04em}
.game-card .gc-team{height:44px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 10px}
.game-card .gc-team + .gc-team{border-top:1px solid var(--row-rule)}
.game-card .gc-code{font-size:15px;font-weight:600;letter-spacing:0.03em}
.game-card .gc-rec{font-size:10.5px;color:var(--dim);margin-left:8px}
.game-card .gc-ml{font-size:13px;text-align:right}
.game-card .gc-foot{height:26px;display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--border);font-size:10.5px;color:var(--label)}
.game-card .gc-foot .k{color:var(--dim);margin-right:4px}
.roster-player{cursor:pointer}
.inj-row{cursor:default}
.inj-row:hover,.inj-row.hov{background:var(--amber-soft)}
#injPop{position:fixed;z-index:60;width:340px;max-height:360px;overflow-y:auto;background:var(--chrome);border:1px solid var(--amber-ring);box-shadow:0 8px 24px rgba(0,0,0,0.5);font-size:12px}
#injPop .ip-head{padding:8px 10px;border-bottom:1px solid var(--head-rule);background:var(--panel-head)}
#injPop .ip-name{font-weight:600;font-size:13px}
#injPop .ip-meta{margin-top:3px;font-size:10.5px;color:var(--muted)}
#injPop .ip-sec{padding:6px 10px 2px;font-size:9.5px;letter-spacing:0.08em;color:var(--dim)}
#injPop a.ip-item{display:block;padding:6px 10px;border-bottom:1px solid var(--row-rule);color:var(--label);text-decoration:none}
#injPop a.ip-item:hover{background:var(--amber-soft);color:var(--on)}
#injPop .ip-src{margin-top:2px;font-size:10px;color:var(--dim)}
#injPop .ip-src b{color:var(--amber);font-weight:500}
.roster-player:hover{color:var(--amber)}
.backlink{color:var(--amber);cursor:pointer;font-size:11px}
.backlink:hover{color:#FFC57A}
.combo-block{border-bottom:1px solid var(--row-rule);padding:8px 0}
#rightcol.combo-mode #book{height:auto;flex:5 1 0;min-height:0}
#rightcol.combo-mode #lowerrow{height:auto;flex:1.4 1 0;min-height:0}
.combo-legend{display:flex;align-items:center;gap:14px;font-size:10px;color:var(--dim);padding:0 0 6px}
.combo-legend .swatch{margin-right:4px}
.combo-colhead{display:grid;align-items:end;font-size:9px;color:var(--dim);padding-bottom:4px;border-bottom:1px solid var(--head-rule)}
.combo-col{display:flex;flex-direction:column;align-items:center;line-height:1.25;padding:2px 0;border-top:2px solid transparent;color:var(--dim);text-align:center}
.combo-col:hover{color:var(--on);background:#141920}
.combo-col.on{color:var(--amber);border-top-color:var(--amber);background:var(--amber-soft)}
.combo-col .px{color:var(--muted)}
.combo-row{height:22px;display:grid;align-items:center;font-size:10.5px;border-bottom:1px solid var(--row-rule)}
.combo-row.on{background:var(--amber-soft)}
.combo-rowbtn{display:flex;align-items:center;gap:6px;height:100%;text-align:left;color:var(--on);min-width:0}
.combo-rowbtn:hover .nm{color:var(--amber)}
.combo-rowbtn .box{width:12px;height:12px;flex-shrink:0;border:1px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--bg)}
.combo-row.on .combo-rowbtn .box{background:var(--amber);border-color:var(--amber)}
.combo-rowbtn .nm{flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-rowbtn .px{color:var(--muted);padding-right:6px}
.combo-rowbtn.inelig,.combo-col.inelig{opacity:0.45;cursor:not-allowed}
.combo-cell{width:20px;height:13px;font-size:9px;display:flex;align-items:center;justify-content:center}
.combo-cell.pair{outline:1px solid var(--on);outline-offset:1px}
.combo-slip{margin:4px 8px 8px;border-top:1px solid var(--head-rule);padding-top:6px}
.combo-slip-head{display:flex;align-items:center;gap:10px;height:22px}
.combo-slip-grid{display:grid;align-items:center;gap:6px;border-bottom:1px solid var(--row-rule);padding:2px 0}
.seg{display:flex}
.seg button{font-size:9.5px;padding:1px 6px;border:1px solid var(--faint);color:var(--dim)}
.seg button + button{border-left:0}
.seg button.on{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:600}
.stepper{display:flex;align-items:center;gap:4px}
.stepper span{min-width:44px;text-align:center}
.stepper button{color:var(--muted);font-size:9px;padding:0 3px}
.stepper button:disabled{color:var(--faint);cursor:default}
.combo-x{color:var(--dim);font-size:13px}
.combo-x:hover{color:var(--orange)}
.combo-msg{font-size:10.5px;padding:2px 4px;color:var(--muted)}
.combo-msg.err{color:var(--orange)}
.combo-msg.warn{color:var(--amber)}
.combo-stake{display:flex;align-items:center;gap:2px;font-size:11px;white-space:nowrap}
.combo-stake input::-webkit-inner-spin-button,.combo-stake input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.combo-stake input{-moz-appearance:textfield;width:40px;min-width:0;background:var(--bg);border:1px solid var(--head-rule);color:var(--on);font-size:12px;padding:1px 3px}
.combo-quote{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.combo-btn{white-space:nowrap;background:var(--amber);color:var(--bg);font-weight:600;font-size:11px;letter-spacing:0.04em;padding:5px 10px}
.combo-btn:disabled{background:#1A2027;color:var(--dim);cursor:not-allowed}
.combo-btn.armed{background:var(--orange)}
.combo-note{font-size:10.5px;color:var(--dim)}
.section-label{font-size:10px;letter-spacing:0.1em;color:var(--dim);font-weight:600;padding:8px 4px 4px}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="logo"><span>NK</span></div>
    <div id="tickets"></div>
    <button id="newticket" type="button" aria-label="Open new player ticket">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 0v10M0 5h10"></path></svg>
    </button>
    <div id="searchwrap">
      <label for="q" class="sr">Search</label>
      <div id="searchbox">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#7A8591" stroke-width="1.3"><circle cx="5" cy="5" r="4"></circle><path d="M8 8l3.5 3.5"></path></svg>
        <input id="q" type="text" placeholder="Player name…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
        <span class="mono" style="font-size:10px;color:var(--dim);border:1px solid var(--head-rule);padding:0 4px">/</span>
        <div id="suggest" role="listbox" hidden></div>
      </div>
    </div>
    <div id="statusbar" class="mono">
      <span id="kalshiStatus" style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--blue)"></span>KALSHI LIVE</span>
      <span>NFLVERSE · CACHED</span>
      <span id="clock" style="color:var(--on)"></span>
    </div>
  </div>

  <div style="flex-grow:1;min-height:0;display:flex">
    <div id="rail">
      <button class="railbtn" type="button" data-module="research" aria-label="Player research">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"></circle><path d="M12 12l4.5 4.5"></path></svg>
      </button>
      <button class="railbtn" type="button" data-module="book" aria-label="Book and positions">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 15V9M6.5 15V5M11 15V8M15.5 15V2"></path></svg>
      </button>
      <button class="railbtn" type="button" data-module="slate" aria-label="Weekly slate">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3.5" width="14" height="12.5"></rect><path d="M2 7.5h14M6 1.5v4M12 1.5v4"></path></svg>
      </button>
      <button class="railbtn" type="button" aria-label="Correlation map (not built)" title="Not built yet">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="4" r="2"></circle><circle cx="14" cy="5" r="2"></circle><circle cx="8" cy="14" r="2"></circle><path d="M5.7 5.2l1.6 7M12.3 6.3l-3 6.1M6 4.2h6"></path></svg>
      </button>
      <button class="railbtn" type="button" aria-label="Alerts (not built)" title="Not built yet">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 13V8a5 5 0 0110 0v5l1.5 1.5h-13z"></path><path d="M7 16.5h4"></path></svg>
      </button>
      <div style="flex-grow:1"></div>
      <button class="railbtn" type="button" aria-label="Settings (not built)" title="Not built yet" style="margin-bottom:6px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5h9M14 5h2M2 13h3M8 13h8"></path><circle cx="12.5" cy="5" r="1.6"></circle><circle cx="6.5" cy="13" r="1.6"></circle></svg>
      </button>
    </div>

    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;position:relative">
      <div id="ctx"></div>
      <div id="grid"></div>
      <div id="slateView" style="display:none;flex-direction:column;flex-grow:1;min-height:0"></div>
      <div id="bookView" style="display:none;flex-direction:column;flex-grow:1;min-height:0;overflow:auto;padding:8px"></div>
      <div id="injPop" hidden></div>
      <div id="overlay" style="display:none;position:absolute;left:0;right:0;top:0;bottom:0;background:var(--bg);align-items:center;justify-content:center;font-size:12px;color:var(--dim)"></div>
    </div>
  </div>
</div>

<script>
const C = { on:'#E3E7EC', label:'#C9D1D9', off:'#7A8591', amber:'#F2A541', blue:'#5AA9FF', orange:'#FF7A45', muted:'#9AA4AF', neutral:'#4A5561' };

// Series -> ladder metadata. `over` series show the raw threshold ("o22.5")
// instead of the "+1" count convention ("150+").
const SERIES_META = {
  KXNFLPASSYDS:  { short:'Pass Yds',  name:'Passing Yards',        dec:0, col:'left',  histKey:'passing_yards' },
  KXNFLPASSTDS:  { short:'Pass TD',   name:'Passing TDs',          dec:1, col:'left',  histKey:'passing_tds' },
  KXNFLPASSCOMP: { short:'Comp',      name:'Completions',          dec:1, col:'left' },
  KXNFLPASSATT:  { short:'Att',       name:'Pass Attempts',        dec:1, col:'left' },
  KXNFLPASSINT:  { short:'INT',       name:'Pass Interceptions',   dec:1, col:'left' },
  KXNFLREC:      { short:'Rec',       name:'Receptions',           dec:1, col:'left',  histKey:'receptions' },
  KXNFLRECYDS:   { short:'Rec Yds',   name:'Receiving Yards',      dec:0, col:'left',  histKey:'receiving_yards' },
  KXNFLRSHYDS:   { short:'Rush Yds',  name:'Rushing Yards',        dec:0, col:'right', histKey:'rushing_yards' },
  KXNFLRSHATT:   { short:'Rush Att',  name:'Rush Attempts',        dec:1, col:'right' },
  KXNFLTD:       { short:'ATD',       name:'Anytime TD',           dec:1, col:'right' },
  KXNFLLONGREC:  { short:'Long Rec',  name:'Longest Reception',    dec:1, col:'right', over:true },
  KXNFLLONGRSH:  { short:'Long Rush', name:'Longest Rush',         dec:1, col:'right', over:true },
};

// Team primary brand colors, keyed by Kalshi team code.
const TEAM_COLORS = {
  ARI:'#97233F', ATL:'#A71930', BAL:'#241773', BUF:'#00338D', CAR:'#0085CA',
  CHI:'#0B162A', CIN:'#FB4F14', CLE:'#311D00', DAL:'#041E42', DEN:'#FB4F14',
  DET:'#0076B6', GB:'#203731',  HOU:'#03202F', IND:'#002C5F', JAC:'#101820',
  KC:'#E31837',  LAC:'#0080C6', LAR:'#003594', LV:'#000000',  MIA:'#008E97',
  MIN:'#4F2683', NE:'#002244',  NO:'#D3BC8D',  NYG:'#0B2265', NYJ:'#125740',
  PHI:'#004C54', PIT:'#FFB612', SEA:'#002244', SF:'#AA0000',  TB:'#D50A0A',
  TEN:'#4B92DB', WAS:'#5A1414',
};
function teamColor(code) { return TEAM_COLORS[code] || 'var(--border)'; }

// ---------- state ----------
let nextId = 1;
const state = {
  tickets: [], activeId: null, kalshiOk: true, module: 'research',
  games: [], activeGameId: null,
  slate: { loading: false, error: null, games: null, view: 'list' },
  book: { loading: false, error: null, data: null },
};

function openPlayerFromDrilldown(name) {
  const existing = state.tickets.find(t => t.data && t.data.player.name.toLowerCase() === name.toLowerCase());
  if (existing) { state.activeId = existing.id; state.module = 'research'; render(); return; }
  state.module = 'research';
  newTicket(name);
}

function activeTicket() { return state.tickets.find(t => t.id === state.activeId) || null; }

function newTicket(query) {
  const t = { id: nextId++, query, name: query, sub: '', loading: true, error: null, data: null,
    ui: { mkt: 'player', curve: null, risk: 'pos', match: 'def', inj: null, logSeason: null },
    logs: {} };
  state.tickets.push(t);
  state.activeId = t.id;
  loadTicket(t);
  render();
}

async function loadTicket(t) {
  try {
    const resp = await fetch('/api/player?name=' + encodeURIComponent(t.query));
    const data = await resp.json();
    state.kalshiOk = resp.ok;
    if (!resp.ok) { t.error = data.error || 'request failed'; t.loading = false; render(); return; }
    // de-dupe: if a ticket for this resolved player already exists, drop this one and switch
    const dup = state.tickets.find(x => x !== t && x.data && x.data.player.name === data.player.name);
    if (dup) {
      state.tickets = state.tickets.filter(x => x !== t);
      state.activeId = dup.id;
      render();
      return;
    }
    t.data = data;
    t.name = data.player.name.split(' ').pop().toUpperCase();
    t.sub = data.player.team_kalshi + ' ' + data.player.position;
    t.ui.curve = firstSeriesId(data);
    t.ui.inj = data.game_environment ? data.game_environment.home_team : null;
    t.loading = false;
  } catch (e) {
    state.kalshiOk = false;
    t.error = String(e);
    t.loading = false;
  }
  render();
}

function closeTicket(id) {
  const i = state.tickets.findIndex(t => t.id === id);
  if (i === -1) return;
  state.tickets.splice(i, 1);
  if (state.activeId === id) {
    state.activeId = state.tickets.length ? state.tickets[Math.max(0, i - 1)].id : null;
  }
  render();
}

function firstSeriesId(data) {
  const ids = Object.keys(SERIES_META).filter(s => data.markets.player_props.some(m => m.series === s));
  return ids[0] || null;
}

// ---------- formatting ----------
const fmt1 = (x) => x === null || x === undefined ? '--' : Number(x).toFixed(1);
const fmtPctVal = (x) => x === null || x === undefined ? '--' : (x * 100).toFixed(1) + '%';
const money = (dollars) => (dollars < 0 ? '-$' : '$') + Math.abs(dollars).toFixed(2);
const signedMoney = (dollars) => (dollars >= 0 ? '+$' : '-$') + Math.abs(dollars).toFixed(2);

function lineLabel(meta, threshold) {
  if (meta.over) return 'o' + (threshold % 1 === 0 ? threshold.toFixed(1) : threshold);
  return Math.round(threshold + 0.5) + '+';
}

// Reference line: the market whose implied YES probability sits closest to a
// coinflip. Mirrors _closest_to_coinflip in player_research.py.
function refIndex(rows) {
  let best = 0;
  rows.forEach((r, i) => { if (Math.abs(r.imp - 50) < Math.abs(rows[best].imp - 50)) best = i; });
  return best;
}

// Linear interpolation of the threshold where implied probability crosses 50%.
function median(rows) {
  if (rows.length === 1) return rows[0].threshold;
  if (rows[0].imp < 50) return null;
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (a.imp >= 50 && b.imp < 50) return a.threshold + (b.threshold - a.threshold) * (a.imp - 50) / (a.imp - b.imp);
  }
  return rows[rows.length - 1].threshold;
}
function fmtMedian(meta, rows) {
  const m = median(rows);
  if (m === null) return { label: 'P(' + lineLabel(meta, rows[0].threshold) + ')', value: rows[0].imp.toFixed(1) };
  // rows[].threshold is the raw floor_strike (e.g. 149.5 for "150+"); convert
  // back to display-value space before formatting, except for `over` series
  // (longest rec/rush) whose threshold already IS the displayed value.
  const disp = meta.over ? m : m + 0.5;
  return { label: 'MED', value: meta.dec === 0 ? String(Math.round(disp)) : disp.toFixed(1) };
}

function groupRows(markets, series) {
  return markets.filter(m => m.series === series).sort((a, b) => a.threshold - b.threshold)
    .map(m => ({ ...m, imp: (m.implied_prob_yes ?? 0) * 100 }));
}

function seriesPresent(data) {
  return Object.keys(SERIES_META).filter(s => data.markets.player_props.some(m => m.series === s));
}

// ---------- clock ----------
function tickClock() {
  const el = document.getElementById('clock');
  if (!el) return;
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
  const get = (t) => parts.find(p => p.type === t).value;
  el.textContent = `${get('weekday').toUpperCase()} ${get('day')} ${get('month').toUpperCase()} ${get('hour')}:${get('minute')} ET`;
}
setInterval(tickClock, 1000);

// ---------- render: top bar ----------
// A player ticket and a game tab are "linked" when they're the same matchup
// (home/away Kalshi codes match) and both happen to be open at once.
function ticketMatchup(t) {
  const env = t.data && t.data.game_environment;
  if (!env || !env.home_team || !env.away_team) return null;
  return { home: nflverseToKalshi(env.home_team), away: nflverseToKalshi(env.away_team) };
}

function sameMatchup(a, b) {
  return !!a && !!b && a.home === b.home && a.away === b.away;
}

function linkedGameFor(t) {
  const m = ticketMatchup(t);
  if (!m) return null;
  return state.games.find(g => sameMatchup(m, { away: g.away, home: g.home })) || null;
}

function linkedTicketsFor(g) {
  if (!g.away || !g.home) return [];
  return state.tickets.filter(t => sameMatchup(ticketMatchup(t), { away: g.away, home: g.home }));
}

function playerTicketHtml(t) {
  const on = t.id === state.activeId;
  const color = t.data ? teamColor(t.data.player.team_kalshi) : 'var(--border)';
  const topColor = linkedGameFor(t) ? color : (on ? 'var(--amber)' : 'transparent');
  return `<div class="ticket" data-open="${t.id}" style="cursor:pointer;background:${on ? '#141920' : 'transparent'};border-top-color:${topColor};color:${on ? 'var(--on)' : 'var(--dim)'}">
    <span class="tteam" style="background:${color}"></span>
    <span class="tname">${escapeHtml(t.name)}</span>
    <span class="tsub mono">${escapeHtml(t.sub || (t.loading ? 'loading…' : t.error ? 'error' : ''))}</span>
    <button type="button" class="tclose" data-close="${t.id}" aria-label="Close ticket">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l6 6M7 1L1 7"></path></svg>
    </button>
  </div>`;
}

function gameTabHtml(g) {
  const on = g.id === state.activeGameId;
  const linkedTeams = [...new Set(linkedTicketsFor(g).map(t => t.data.player.team_kalshi))];
  // One linked team: solid top border in that team's color. Both linked
  // (away + home both open): split the top edge left/right, away on the
  // left and home on the right, mirroring the "AWAY @ HOME" tab order — and
  // mute the left .tteam bar to a neutral gray since it's no longer telling
  // you anything the top split doesn't already say. Neither: keep the
  // two-tone left bar and fall back to the normal active/amber indicator.
  const splitTop = linkedTeams.length === 2 && g.away && g.home
    ? `linear-gradient(to right, ${teamColor(g.away)} 50%, ${teamColor(g.home)} 50%)`
    : null;
  const bar = splitTop
    ? 'var(--faint)'
    : g.away && g.home
      ? `linear-gradient(to bottom, ${teamColor(g.away)} 50%, ${teamColor(g.home)} 50%)`
      : 'var(--border)';
  const topColor = linkedTeams.length === 1 ? teamColor(linkedTeams[0]) : (on ? 'var(--amber)' : 'transparent');
  return `<div class="ticket" data-open-gametab="${g.id}" style="cursor:pointer;position:relative;background:${on ? '#141920' : 'transparent'};border-top-color:${splitTop ? 'transparent' : topColor};color:${on ? 'var(--on)' : 'var(--dim)'}">
    ${splitTop ? `<span style="position:absolute;top:-2px;left:0;right:0;height:2px;background:${splitTop}"></span>` : ''}
    <span class="tteam" style="background:${bar}"></span>
    <span class="tname">${escapeHtml(g.label)}</span>
    ${g.loading || g.error ? `<span class="tsub mono">${g.loading ? 'loading…' : 'error'}</span>` : ''}
    <button type="button" class="tclose" data-close-gametab="${g.id}" aria-label="Close game tab">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l6 6M7 1L1 7"></path></svg>
    </button>
  </div>`;
}

function renderTopbar() {
  const wrap = document.getElementById('tickets');
  // Cluster every ticket linked to the same game together with its game
  // tab, away-team tickets on the left and home-team tickets on the right
  // (mirroring "AWAY @ HOME"), regardless of the order tickets were opened
  // in or other unrelated tickets interleaved between them.
  const placedGameIds = new Set();
  const placedTicketIds = new Set();
  let html = '';
  state.tickets.forEach(t => {
    if (placedTicketIds.has(t.id)) return;
    const g = linkedGameFor(t);
    if (!g) {
      html += playerTicketHtml(t);
      placedTicketIds.add(t.id);
      return;
    }
    if (placedGameIds.has(g.id)) return; // already emitted as part of its cluster
    placedGameIds.add(g.id);
    const linked = linkedTicketsFor(g);
    const away = linked.filter(x => x.data.player.team_kalshi === g.away);
    const home = linked.filter(x => x.data.player.team_kalshi === g.home);
    away.forEach(x => placedTicketIds.add(x.id));
    home.forEach(x => placedTicketIds.add(x.id));
    html += away.map(playerTicketHtml).join('') + gameTabHtml(g) + home.map(playerTicketHtml).join('');
  });
  const remainingGames = state.games.filter(g => !placedGameIds.has(g.id));
  const remainingHtml = remainingGames.map(gameTabHtml).join('');
  const divider = html && remainingHtml ? `<div id="tabgroup-div"></div>` : '';
  wrap.innerHTML = html + divider + remainingHtml;
  const dot = document.querySelector('#kalshiStatus .dot');
  if (dot) dot.style.background = state.kalshiOk ? 'var(--blue)' : 'var(--orange)';
  const label = document.querySelector('#kalshiStatus');
  if (label) label.lastChild.textContent = state.kalshiOk ? 'KALSHI LIVE' : 'KALSHI ERROR';
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- render: context strip ----------
function teamSpread(env) {
  // nflverse spread_line here is signed from the HOME team's perspective as
  // "points the home team is getting" (positive = home favored). Convert to
  // the searched team's own line in conventional sportsbook sign (favorite
  // negative).
  if (env.spread_line === null || env.spread_line === undefined) return null;
  return env.is_home_for_searched_team ? -env.spread_line : env.spread_line;
}

function favorColor(rank, outOf, dir) {
  // dir: 'opp' (opponent defense stat) or 'own' (searched player's own team stat)
  if (!rank || !outOf) return C.neutral;
  const fav = dir === 'opp' ? rank >= outOf * 0.65 : rank <= outOf * 0.35;
  const unf = dir === 'opp' ? rank <= outOf * 0.35 : rank >= outOf * 0.65;
  return fav ? C.blue : unf ? C.orange : C.neutral;
}

function renderContext() {
  const el = document.getElementById('ctx');
  const t = activeTicket();
  if (!t || !t.data) {
    el.innerHTML = '';
    return;
  }
  const d = t.data, p = d.player, env = d.game_environment;
  const kpis = [];
  if (env) {
    const spr = teamSpread(env);
    kpis.push({ l: 'SPREAD', v: spr === null ? '--' : `${p.team_kalshi} ${spr >= 0 ? '+' : ''}${spr.toFixed(1)}` });
    kpis.push({ l: 'TOTAL', v: fmt1(env.total_line) });
    const ttm = teamTotalRef(d);
    kpis.push({ l: ttm ? `${p.team_kalshi} TT O${ttm.line}` : 'TEAM TOTAL', v: ttm ? ttm.imp.toFixed(1) + '%' : '--' });
    const f = env.forecast;
    kpis.push({ l: 'FORECAST', v: f && f.forecast_available ? `${Math.round(f.temperature_f)}°F · W${Math.round(f.wind_speed_mph)} G${Math.round(f.wind_gusts_mph)} · ${Math.round(f.precipitation_probability_pct)}%` : (f && f.note ? f.note.toUpperCase() : '--') });
    kpis.push({ l: 'REST', v: `${env.rest_days} / ${env.opponent_rest_days}` });
    kpis.push({ l: 'SURFACE', v: `${(env.roof || '--').toUpperCase()} · ${(env.surface || '--').toUpperCase()}` });
  }
  if (d.opponent_defense) {
    const r = d.opponent_defense.epa_per_dropback_allowed_rank;
    kpis.push({ l: 'OPP D EPA/DB', v: r ? '#' + r.rank : '--', fg: r ? favorColor(r.rank, r.out_of, 'opp') : C.on });
  }
  const flagCount = (d.correlations.flags || []).reduce((a, f) => a + f.correlated_with.length, 0);
  kpis.push({ l: 'CORR FLAGS', v: String(flagCount), fg: C.amber });

  const gameLabel = env ? `${p.team_kalshi} · ${env.is_home_for_searched_team ? 'HOME vs' : 'AWAY @'} ${env.is_home_for_searched_team ? env.away_team && nflverseToKalshi(env.away_team) : nflverseToKalshi(d.opponent)}` : p.team_kalshi;
  const dateLabel = env && env.gameday ? formatGameDate(env.gameday) : '';

  el.innerHTML = `
    <div class="who">
      ${p.headshot_url ? `<img class="headshot" src="${escapeHtml(p.headshot_url)}" alt="" onerror="this.style.visibility='hidden'">` : ''}
      <div class="whotext">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span class="name">${escapeHtml(p.name.toUpperCase())}</span>
          <span class="pos mono">${p.position} #${p.jersey_number ?? '?'}</span>
        </div>
        <div class="sub mono">${escapeHtml(gameLabel)}${dateLabel ? ' · ' + dateLabel : ''}</div>
      </div>
    </div>
    ${kpis.map(k => `<div class="kpi"><span class="kl">${k.l}</span><span class="kv mono" style="color:${k.fg || 'var(--on)'}">${escapeHtml(k.v)}</span></div>`).join('')}
  `;
}

function nflverseToKalshi(code) { return ({ JAX: 'JAC', LA: 'LAR' })[code] || code; }
function formatGameDate(iso) {
  const dt = new Date(iso + 'T12:00:00Z');
  return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', day: '2-digit', month: 'short' }).format(dt).toUpperCase();
}

function teamTotalRef(data) {
  const rows = groupRows(data.markets.team_game_markets, 'KXNFLTEAMTOTAL')
    .filter(m => m.team_code === data.player.team_kalshi);
  if (!rows.length) return null;
  const r = rows[refIndex(rows)];
  return { line: fmt1(r.threshold), imp: r.imp };
}

// ---------- render: markets panel ----------
function buildLadderRows(rows, meta) {
  return rows.map(r => {
    const bid = Math.round((r.yes_bid ?? 0) * 100), ask = Math.round((r.yes_ask ?? 0) * 100), sp = ask - bid;
    return {
      line: lineLabel(meta, r.threshold),
      bid, ask, sp,
      imp: r.imp,
      vol: Math.round(r.volume || 0),
      pos: r.my_position ? (r.my_position.side === 'yes' ? 'Y' : 'N') + r.my_position.contracts : '',
      held: !!r.my_position,
    };
  });
}

function buildGroup(data, series, historyMap) {
  const meta = SERIES_META[series];
  const rows = groupRows(data.markets.player_props, series);
  if (!rows.length) return null;
  const ri = refIndex(rows);
  const built = buildLadderRows(rows, meta);
  const m = fmtMedian(meta, rows);
  const last = meta.histKey && historyMap ? historyMap[meta.histKey] : null;
  return { series, meta, rows: built, refIdx: ri, med: m, last };
}

function latestHistoryMap(data) {
  const hist = data.history_vs_opponent || [];
  return hist.length ? hist[hist.length - 1] : null;
}

function renderMarkets() {
  const head = document.getElementById('marketsTabs');
  const body = document.getElementById('marketsBody');
  const t = activeTicket();
  if (!t || !t.data) { body.innerHTML = ''; head.innerHTML = ''; return; }
  const d = t.data;
  const tabs = [
    { id: 'player', label: t.name, count: d.markets.player_props.length },
    { id: 'tm', label: 'Teammates', count: d.markets.teammate_props.length },
    { id: 'gm', label: 'Team / Game', count: d.markets.team_game_markets.length },
    { id: 'ss', label: 'Season', count: d.markets.season_props.length },
    { id: 'log', label: 'Game Log', count: (d.game_log && d.game_log.games || []).length },
  ];
  const vsCount = (d.history_vs_opponent || []).length;
  // "Heads up" when the player has faced this opponent before.
  if (d.opponent) tabs.push({ id: 'vs', label: `vs ${nflverseToKalshi(d.opponent)}`, count: vsCount, heads: vsCount > 0 });
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab ${t.ui.mkt === tb.id ? 'on' : ''} ${tb.heads ? 'heads' : ''}" data-mkt="${tb.id}"${tb.heads ? ` title="Has faced ${escapeHtml(tb.label.slice(3))} ${tb.count} time${tb.count === 1 ? '' : 's'}"` : ''}>${escapeHtml(tb.label)}<span class="cnt mono">${tb.count}</span></button>`).join('');

  if (t.ui.mkt === 'player') {
    renderLadder(body, t, d);
  } else if (t.ui.mkt === 'tm' || t.ui.mkt === 'gm' || t.ui.mkt === 'ss') {
    renderFlatMarkets(body, t, d, t.ui.mkt);
  } else if (t.ui.mkt === 'log') {
    renderGameLog(body, t, d);
  } else if (t.ui.mkt === 'vs') {
    renderVsOpponent(body, t, d);
  }
}

function correlatedTickerSet(data) {
  const set = new Set();
  (data.correlations.flags || []).forEach(f => { set.add(f.ticker); f.correlated_with.forEach(c => set.add(c.ticker)); });
  return set;
}

function renderLadder(body, t, d) {
  const hist = latestHistoryMap(d);
  const seriesIds = seriesPresent(d);
  const leftIds = seriesIds.filter(s => SERIES_META[s].col === 'left');
  const rightIds = seriesIds.filter(s => SERIES_META[s].col === 'right');
  const oppKalshi = nflverseToKalshi(d.opponent);

  function col(ids, showStats) {
    const groups = ids.map(s => buildGroup(d, s, hist)).filter(Boolean);
    let html = `<div style="display:flex;flex-direction:column;min-width:0">
      <div class="ladder-head mono"><span>LINE</span><span class="right">BID</span><span class="right">ASK</span><span class="right">SPR</span><span style="padding-left:10px">IMPLIED %</span><span class="right">VOL</span><span class="right">POS</span></div>`;
    groups.forEach(g => {
      html += `<div class="ladder-group">
        <span style="font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--label)">${g.meta.name.toUpperCase()}</span>
        <div style="flex-grow:1"></div>
        <span class="mono" style="font-size:9.5px;color:var(--dim)">${g.med.label} <span style="color:var(--on)">${g.med.value}</span></span>
        ${g.last !== null && g.last !== undefined ? `<span class="mono" style="font-size:9.5px;color:var(--dim)">LAST v ${oppKalshi} <span style="color:var(--amber)">${g.last}</span></span>` : ''}
      </div>`;
      g.rows.forEach((r, i) => {
        html += `<div class="ladder-row mono" style="background:${r.held ? 'var(--amber-soft)' : 'transparent'}">
          <span style="color:var(--on);padding-left:4px">${r.line} <span style="color:var(--muted);font-size:9px">${i === g.refIdx ? '◆' : ''}</span></span>
          <span class="right" style="color:var(--blue)">${r.bid}</span>
          <span class="right" style="color:var(--ask)">${r.ask}</span>
          <span class="right" style="color:${r.sp >= 10 ? 'var(--orange)' : 'var(--muted)'}">${r.sp}</span>
          <div style="display:flex;align-items:center;gap:6px;padding-left:10px">
            <div class="bar-track"><div class="bar-fill" style="width:${r.imp}%"></div><div class="bar-mid"></div></div>
            <span style="width:32px;text-align:right;color:var(--on)">${r.imp.toFixed(1)}</span>
          </div>
          <span class="right" style="color:${r.vol ? 'var(--muted)' : '#3A434E'}">${r.vol ? r.vol.toLocaleString('en-US') : '·'}</span>
          <span class="right" style="color:var(--amber);font-weight:600;padding-right:2px">${r.pos}</span>
        </div>`;
      });
    });
    if (showStats) {
      const totalVol = groups.reduce((a, g) => a + g.rows.reduce((b, r) => b + r.vol, 0), 0);
      const wide = groups.reduce((a, g) => a + g.rows.filter(r => r.sp >= 10).length, 0);
      const refLines = groups.length;
      const propCount = seriesIds.reduce((a, s) => a + groupRows(d.markets.player_props, s).length, 0);
      html += `<div class="stat-tiles">
        <div class="stat-tile"><span class="sl">PROPS</span><span class="sv mono">${propCount}</span></div>
        <div class="stat-tile"><span class="sl">VOLUME</span><span class="sv mono">${totalVol.toLocaleString('en-US')}</span></div>
        <div class="stat-tile"><span class="sl">WIDE SPR</span><span class="sv mono" style="color:var(--orange)">${wide}</span></div>
        <div class="stat-tile"><span class="sl">REF LINES</span><span class="sv mono">${refLines}</span></div>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  body.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:4px 8px 8px">
    ${col(leftIds, false)}
    ${col(rightIds, true)}
  </div>`;
}

function renderFlatMarkets(body, t, d, which) {
  const correlated = correlatedTickerSet(d);
  let rows, note;
  if (which === 'tm') {
    rows = d.markets.teammate_props;
    note = `Showing all ${rows.length} teammate markets for this game.`;
  } else if (which === 'gm') {
    rows = d.markets.team_game_markets;
    note = `Showing all ${rows.length} team/game markets for this game.`;
  } else {
    rows = d.markets.season_props;
    note = `Showing all ${rows.length} season-long props.`;
  }
  if (!rows.length) {
    body.innerHTML = `<div class="empty">No markets found here.</div>`;
    return;
  }
  if (which === 'ss') { renderSeasonMarkets(body, d, rows, note); return; }
  if (which === 'tm') {
    renderMarketsGroupedByName(body, rows, correlated, note);
    return;
  }
  const sorted = [...rows].sort((a, b) => Math.abs((a.implied_prob_yes ?? 0.5) - 0.5) - Math.abs((b.implied_prob_yes ?? 0.5) - 0.5));
  let html = `<div style="padding:4px 8px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:150px minmax(0,1fr) 200px 90px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span style="padding-left:4px">WHO</span><span>MARKET</span><span>IMPLIED %</span><span class="right">LINKED</span>
    </div>`;
  sorted.forEach(r => {
    const who = r.player_name || r.team_code || '—';
    const imp = (r.implied_prob_yes ?? 0) * 100;
    const linked = correlated.has(r.ticker);
    const heldStyle = r.my_position ? 'background:var(--amber-soft)' : '';
    html += `<div class="mono" style="height:20px;display:grid;grid-template-columns:150px minmax(0,1fr) 200px 90px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule);${heldStyle}">
      <span style="padding-left:4px;color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(who)}</span>
      <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title)}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="bar-track"><div class="bar-fill" style="width:${imp}%"></div></div>
        <span style="width:36px;text-align:right">${imp.toFixed(1)}</span>
      </div>
      <span class="right" style="color:${linked ? 'var(--amber)' : 'var(--dim)'}">${linked ? 'linked' : '—'}</span>
    </div>`;
  });
  html += `<div class="mono" style="padding:8px 4px;font-size:10.5px;color:var(--dim)">${note}</div></div>`;
  body.innerHTML = html;
}

function renderMarketsGroupedByName(body, rows, correlated, note) {
  const groups = new Map();
  rows.forEach(r => {
    const key = r.player_name || r.team_code || '—';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });
  const names = [...groups.keys()].sort((a, b) => a.localeCompare(b));

  let html = `<div style="padding:4px 8px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 200px 90px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span style="padding-left:4px">MARKET</span><span>IMPLIED %</span><span class="right">LINKED</span>
    </div>`;
  names.forEach(name => {
    const group = groups.get(name).sort((a, b) => Math.abs((a.implied_prob_yes ?? 0.5) - 0.5) - Math.abs((b.implied_prob_yes ?? 0.5) - 0.5));
    html += `<div class="ladder-group">
      <span style="font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--label)">${escapeHtml(name.toUpperCase())}</span>
      <div style="flex-grow:1"></div>
      <span class="mono" style="font-size:9.5px;color:var(--dim)">${group.length} MARKET${group.length === 1 ? '' : 'S'}</span>
    </div>`;
    group.forEach(r => {
      const imp = (r.implied_prob_yes ?? 0) * 100;
      const linked = correlated.has(r.ticker);
      const heldStyle = r.my_position ? 'background:var(--amber-soft)' : '';
      html += `<div class="mono" style="height:20px;display:grid;grid-template-columns:minmax(0,1fr) 200px 90px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule);${heldStyle}">
        <span style="padding-left:4px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar-track"><div class="bar-fill" style="width:${imp}%"></div></div>
          <span style="width:36px;text-align:right">${imp.toFixed(1)}</span>
