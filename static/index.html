        rankRow('Precip', f && f.forecast_available ? Math.round(f.precipitation_probability_pct) + '%' : '--', null),
      ];
      note = 'Forecast via Open-Meteo at the home stadium for kickoff hour.';
    }
  }

  body.innerHTML = `<div style="padding:4px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 70px 50px 34px;gap:6px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>METRIC</span><span class="right">VALUE</span><span>RANK</span><span class="right">/32</span>
    </div>
    ${rows.map(m => `<div style="height:24px;display:grid;grid-template-columns:minmax(0,1fr) 70px 50px 34px;gap:6px;align-items:center;border-bottom:1px solid var(--row-rule)">
      <span style="font-size:12px;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(m.label)}</span>
      <span class="mono right" style="font-size:11px;color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(m.val)}">${escapeHtml(m.val)}</span>
      <div class="rankbar"><div class="rankbar-fill" style="width:${m.w}%;background:${m.fill}"></div></div>
      <span class="mono right" style="font-size:11px;color:${m.rankFg}">${m.rank}</span>
    </div>`).join('')}
    <div style="margin-top:8px;font-size:11px;line-height:1.4;color:var(--muted)">${escapeHtml(note)}</div>
    <div class="mono" style="margin-top:8px;display:flex;gap:12px;font-size:9.5px;color:var(--dim)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:6px;background:var(--blue);display:inline-block"></span>FAVORS ${t.name}</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:6px;background:var(--orange);display:inline-block"></span>AGAINST</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:6px;background:var(--neutral);display:inline-block"></span>NEUTRAL</span>
    </div>
  </div>`;
}

// ---------- render: injuries ----------
const INJ_STYLE = {
  DNP: ['var(--orange)', 'rgba(255,122,69,0.14)'], LP: ['var(--amber)', 'rgba(242,165,65,0.12)'],
  FP: ['#8FC1FF', 'rgba(90,169,255,0.12)'],
};
function practiceStatus(row) {
  const s = (row.practice_status || '').toLowerCase();
  if (s.includes('did not')) return 'DNP';
  if (s.includes('limited')) return 'LP';
  if (s.includes('full')) return 'FP';
  return row.report_status || '--';
}

function renderInjuries() {
  if (typeof hideInjPop === 'function') hideInjPop();
  const head = document.getElementById('injTabs');
  const body = document.getElementById('injBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const env = t.data.game_environment;
  if (!env) { head.innerHTML = ''; body.innerHTML = `<div class="empty">No upcoming game.</div>`; return; }
  const homeK = nflverseToKalshi(env.home_team), awayK = nflverseToKalshi(env.away_team);
  const groups = { [env.home_team]: env.injuries_home, [env.away_team]: env.injuries_away };
  if (!t.ui.inj || !groups[t.ui.inj]) t.ui.inj = env.home_team;
  function count(team) {
    const c = { DNP: 0, LP: 0, FP: 0 };
    (groups[team] || []).forEach(r => { const s = practiceStatus(r); if (c[s] !== undefined) c[s]++; });
    return `${c.DNP}·${c.LP}·${c.FP}`;
  }
  const tabs = [{ id: env.home_team, label: homeK }, { id: env.away_team, label: awayK }];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab small ${t.ui.inj === tb.id ? 'on' : ''}" data-inj="${tb.id}">${tb.label}<span class="cnt mono">${count(tb.id)}</span></button>`).join('');

  const rows = groups[t.ui.inj] || [];
  body.innerHTML = `<div style="padding:4px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 34px 46px;gap:6px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>PLAYER</span><span>POS</span><span class="right">PRACT</span>
    </div>
    ${rows.length ? rows.map((r, i) => {
      const st = practiceStatus(r); const style = INJ_STYLE[st] || [C.muted, 'transparent'];
      return `<div class="inj-row" data-injp="${i}" style="height:22px;display:grid;grid-template-columns:minmax(0,1fr) 34px 46px;gap:6px;align-items:center;border-bottom:1px solid var(--row-rule)">
        <span style="font-size:12px;color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.full_name)}</span>
        <span class="mono" style="font-size:10.5px;color:var(--muted)">${r.position}</span>
        <span style="display:flex;justify-content:flex-end"><span class="mono pill" style="color:${style[0]};background:${style[1]}">${st}</span></span>
      </div>`;
    }).join('') : `<div class="empty">None reported.</div>`}
    <div class="mono" style="margin-top:8px;font-size:9.5px;color:var(--dim)">DNP did not practice · LP limited · FP full · hover for news</div>
  </div>`;
  body.querySelectorAll('[data-injp]').forEach(el => { el._inj = rows[Number(el.dataset.injp)]; });
}

// ---------- injury news popover ----------
// Hovering an injury row shows the report detail plus recent headlines with
// sources. The popover stays open while the pointer moves into it so links
// are clickable.
const injNews = {};  // name -> Promise<items>
const injPop = document.getElementById('injPop');
let injHoverRow = null, injHideTimer = null;

function fetchInjNews(name) {
  if (!injNews[name]) {
    injNews[name] = fetch('/api/injury_news?name=' + encodeURIComponent(name))
      .then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); return d.items || []; })
      .catch(err => { delete injNews[name]; throw err; });
  }
  return injNews[name];
}

function timeAgo(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso).getTime()) / 3.6e6;
  if (h < 1) return `${Math.max(1, Math.round(h * 60))}m ago`;
  if (h < 48) return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

function placeInjPop(row) {
  const r = row.getBoundingClientRect();
  const w = 340, pad = 8;
  let left = r.left - w - 6;
  if (left < pad) left = Math.min(r.right + 6, window.innerWidth - w - pad);
  const top = Math.max(pad, Math.min(r.top - 4, window.innerHeight - injPop.offsetHeight - pad));
  injPop.style.left = left + 'px'; injPop.style.top = top + 'px';
}

function showInjPop(row) {
  const r = row._inj; if (!r) return;
  if (injHoverRow) injHoverRow.classList.remove('hov');
  injHoverRow = row; row.classList.add('hov');
  const injury = [r.report_primary_injury || r.practice_primary_injury, r.report_secondary_injury].filter(Boolean).join(', ');
  const meta = [r.position, injury || 'injury n/a', r.report_status ? `Game status: ${r.report_status}` : null, r.practice_status].filter(Boolean);
  const head = `<div class="ip-head"><div class="ip-name">${escapeHtml(r.full_name)}</div><div class="ip-meta mono">${meta.map(escapeHtml).join(' · ')}</div></div>
    <div class="ip-sec mono">RECENT NEWS · 14D</div>`;
  injPop.innerHTML = head + `<div class="empty">Loading…</div>`;
  injPop.hidden = false; placeInjPop(row);
  fetchInjNews(r.full_name).then(items => {
    if (injHoverRow !== row) return;
    injPop.innerHTML = head + (items.length ? items.map(it => `<a class="ip-item" href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer">
        <div>${escapeHtml(it.title)}</div>
        <div class="ip-src mono"><b>${escapeHtml(it.source || 'unknown')}</b> · ${timeAgo(it.published)}</div>
      </a>`).join('') : `<div class="empty">No recent injury news found.</div>`)
      + `<div class="mono" style="padding:6px 10px;font-size:9.5px;color:var(--faint)">via Google News</div>`;
    placeInjPop(row);
  }).catch(() => {
    if (injHoverRow === row) injPop.innerHTML = head + `<div class="empty">News lookup failed.</div>`;
  });
}

function hideInjPop() {
  injPop.hidden = true;
  if (injHoverRow) injHoverRow.classList.remove('hov');
  injHoverRow = null;
}

document.addEventListener('mouseover', (e) => {
  const row = e.target.closest('[data-injp]');
  if (row || e.target.closest('#injPop')) clearTimeout(injHideTimer);
  if (row && row !== injHoverRow) showInjPop(row);
});
window.addEventListener('scroll', (e) => { if (!injPop.contains(e.target)) hideInjPop(); }, true);
document.addEventListener('mouseout', (e) => {
  const from = e.target.closest('[data-injp], #injPop');
  if (!from) return;
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-injp], #injPop');
  if (to) return;
  clearTimeout(injHideTimer);
  injHideTimer = setTimeout(hideInjPop, 200);
});

// ---------- render: game log + vs opponent (markets tabs) ----------
// Stat columns shown depend on position; every game row links to its box
// score (ESPN, falling back to Pro Football Reference).
const LOG_COLS = {
  QB: [
    { h: 'CMP', k: 'completions' }, { h: 'ATT', k: 'attempts' }, { h: 'PASS YD', k: 'passing_yards' },
    { h: 'TD', k: 'passing_tds' }, { h: 'INT', k: 'passing_interceptions' },
    { h: 'CAR', k: 'carries' }, { h: 'RUSH YD', k: 'rushing_yards' }, { h: 'RUSH TD', k: 'rushing_tds' },
  ],
  RB: [
    { h: 'CAR', k: 'carries' }, { h: 'RUSH YD', k: 'rushing_yards' }, { h: 'RUSH TD', k: 'rushing_tds' },
    { h: 'TGT', k: 'targets' }, { h: 'REC', k: 'receptions' }, { h: 'REC YD', k: 'receiving_yards' }, { h: 'REC TD', k: 'receiving_tds' },
  ],
  REC: [
    { h: 'TGT', k: 'targets' }, { h: 'REC', k: 'receptions' }, { h: 'REC YD', k: 'receiving_yards' }, { h: 'REC TD', k: 'receiving_tds' },
    { h: 'CAR', k: 'carries' }, { h: 'RUSH YD', k: 'rushing_yards' },
  ],
};
function logColsFor(pos) {
  const cols = LOG_COLS[pos] || (pos === 'FB' ? LOG_COLS.RB : LOG_COLS.REC);
  return [...cols, { h: 'PPR', k: 'fantasy_points_ppr', dec: 1 }];
}

function fmtGameDate(iso, withYear) {
  if (!iso) return '—';
  const [y, m, dd] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, dd);
  return dt.toLocaleDateString('en-US', withYear ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
}

function gameLogTableHtml(games, cols, opts) {
  const withYear = !!opts.withYear;
  const fmt = (v, c) => (v === null || v === undefined) ? '—' : (c.dec ? Number(v).toFixed(c.dec) : Math.round(v));
  let html = `<table class="gl mono"><thead><tr>
    <th class="l">${withYear ? 'DATE' : 'WK'}</th>${withYear ? '<th class="l">WK</th>' : '<th class="l">DATE</th>'}
    <th class="l">OPP</th><th class="l">RESULT</th>
    ${cols.map(c => `<th>${c.h}</th>`).join('')}<th></th></tr></thead><tbody>`;
  games.forEach(g => {
    const wk = g.season_type === 'POST' ? `P${g.week}` : g.week;
    const opp = `${g.is_home === false ? '@' : 'vs'} ${nflverseToKalshi(g.opponent_team)}`;
    const res = g.result ? `<span class="${g.result === 'W' ? 'w' : g.result === 'L' ? 'lo' : ''}">${g.result}</span> ${g.score}` : '—';
    const date = fmtGameDate(g.gameday, withYear);
    html += `<tr class="${g.url ? 'link' : ''}"${g.url ? ` data-gameurl="${escapeHtml(g.url)}" title="Open ${escapeHtml(g.url_source)} box score"` : ''}>
      <td class="l" style="color:var(--muted)">${withYear ? date : wk}</td>
      <td class="l" style="color:var(--muted)">${withYear ? wk : date}</td>
      <td class="l">${opp}</td><td class="l">${res}</td>
      ${cols.map(c => { const v = g[c.k]; return `<td class="${!v ? 'z' : ''}">${fmt(v, c)}</td>`; }).join('')}
      <td class="go">${g.url ? escapeHtml(g.url_source) + ' ↗' : ''}</td>
    </tr>`;
  });
  html += `</tbody>`;
  if (games.length > 1) {
    const sum = (k) => games.reduce((a, g) => a + (Number(g[k]) || 0), 0);
    const row = (label, fn) => `<tr class="tot"><td class="l" colspan="4" style="color:var(--dim);letter-spacing:0.06em;font-size:9.5px">${label}</td>
      ${cols.map(c => `<td>${fn(c)}</td>`).join('')}<td></td></tr>`;
    html += `<tfoot>
      ${row('TOTAL', c => c.dec ? sum(c.k).toFixed(c.dec) : Math.round(sum(c.k)))}
      ${row('PER GAME', c => (sum(c.k) / games.length).toFixed(1))}
    </tfoot>`;
  }
  return html + `</table>`;
}

async function loadGameLog(t, season) {
  if (t.logs[season]) return;
  t.logs[season] = { loading: true };
  try {
    const resp = await fetch(`/api/gamelog?id=${encodeURIComponent(t.data.player.gsis_id)}&season=${season}`);
    const data = await resp.json().catch(() => ({}));
    if (resp.status === 404 && !data.error) throw new Error('Game log endpoint not found -- restart server.py to pick up the new backend.');
    if (!resp.ok) throw new Error(data.error || 'request failed');
    t.logs[season] = { games: data.games };
  } catch (e) {
    t.logs[season] = { error: String(e.message || e) };
  }
  if (activeTicket() === t && t.ui.mkt === 'log' && t.ui.logSeason === season) renderMarkets();
}

function renderGameLog(body, t, d) {
  const gl = d.game_log || { season: null, seasons: [], games: [] };
  if (gl.season && !t.logs[gl.season]) t.logs[gl.season] = { games: gl.games };
  const season = t.ui.logSeason || gl.season;
  t.ui.logSeason = season;
  const entry = t.logs[season];
  if (!entry) loadGameLog(t, season);

  let html = `<div class="gl-bar">
    <span class="seg">${gl.seasons.map(s => `<button type="button" class="${s === season ? 'on' : ''}" data-logseason="${s}">${s}</button>`).join('')}</span>
    <span class="gl-note mono">click a game for the box score</span>
  </div>`;
  if (!entry || entry.loading) html += `<div class="empty">Loading ${season} game log…</div>`;
  else if (entry.error) html += `<div class="empty" style="color:var(--orange)">${escapeHtml(entry.error)}</div>`;
  else if (!entry.games.length) html += `<div class="empty">No games logged in ${season}.</div>`;
  else html += `<div style="padding:0 8px 8px">${gameLogTableHtml([...entry.games].reverse(), logColsFor(d.player.position), {})}</div>`;
  body.innerHTML = html;
}

function renderVsOpponent(body, t, d) {
  const hist = d.history_vs_opponent || [];
  const oppK = nflverseToKalshi(d.opponent);
  const span = (d.game_log && d.game_log.seasons || []);
  const since = span.length ? span[span.length - 1] : null;
  if (!hist.length) {
    body.innerHTML = `<div class="empty">${escapeHtml(d.player.name)} has no games vs ${oppK} on record${since ? ` since ${since}` : ''}.</div>`;
    return;
  }
  const cols = logColsFor(d.player.position);
  const wins = hist.filter(g => g.result === 'W').length, losses = hist.filter(g => g.result === 'L').length;
  const ties = hist.filter(g => g.result === 'T').length;
  const last = hist[hist.length - 1];
  const tile = (l, v) => `<div class="stat-tile"><span class="sl">${l}</span><span class="sv mono">${v}</span></div>`;
  const avg = (k) => (hist.reduce((a, g) => a + (Number(g[k]) || 0), 0) / hist.length).toFixed(1);
  const keyStats = cols.filter(c => /YD/.test(c.h)).slice(0, 2);
  let html = `<div class="vs-sum">
    ${tile('MEETINGS', hist.length)}
    ${tile('RECORD', wins + losses + ties ? `${wins}-${losses}${ties ? '-' + ties : ''}` : '—')}
    ${tile('LAST MET', fmtGameDate(last.gameday, true))}
    ${keyStats.map(c => tile(`AVG ${c.h}`, avg(c.k))).join('')}
  </div>`;
  html += `<div style="padding:0 8px 8px">${gameLogTableHtml([...hist].reverse(), cols, { withYear: true })}</div>`;
  body.innerHTML = html;
}

// ---------- top-level render ----------
function showOverlay(html) {
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  ov.innerHTML = html;
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

// Three modules share the rail: Research (ticket-based player pages, the
// original build), Slate (week overview + game drill-down), Book (positions
// overview). Only one is visible at a time; each owns its own DOM subtree so
// switching between them never tears down another module's state.
function render() {
  renderTopbar();
  document.querySelectorAll('.railbtn[data-module]').forEach(b => b.classList.toggle('active', b.dataset.module === state.module));
  document.getElementById('ctx').style.display = state.module === 'research' ? '' : 'none';
  document.getElementById('grid').style.display = state.module === 'research' ? '' : 'none';
  document.getElementById('slateView').style.display = state.module === 'slate' ? 'flex' : 'none';
  document.getElementById('bookView').style.display = state.module === 'book' ? 'flex' : 'none';

  if (state.module === 'research') renderResearch();
  else {
    hideOverlay();
    if (state.module === 'slate') renderSlate();
    else if (state.module === 'book') renderBookModule();
  }
}

// The panel skeleton (#marketsTabs, #marketsBody, etc.) is built exactly
// once and never destroyed -- loading/error/empty states are shown as an
// overlay on top of it instead, so switching tickets never leaves the
// skeleton's child elements missing underneath a stale placeholder.
function renderResearch() {
  renderContext();
  const t = activeTicket();
  if (!t) {
    showOverlay(`<div class="empty">Search a player to open a ticket.</div>`);
    return;
  }
  if (t.loading) {
    showOverlay(`<div class="empty">Loading ${escapeHtml(t.query)}…</div>`);
    return;
  }
  if (t.error) {
    showOverlay(`<div class="empty" style="color:var(--orange)">${escapeHtml(t.error)}</div>`);
    return;
  }
  hideOverlay();
  renderMarkets();
  renderCurve();
  renderBook();
  renderMatchup();
  renderInjuries();
}

// ========================================================================
// SLATE module: week overview (moneyline/spread/total per game) with a
// click-team-then-player drill-down into combo markets + rosters.
// ========================================================================

async function loadSlate(force) {
  if (state.slate.games && !force) { render(); return; }
  state.slate.loading = true; state.slate.error = null;
  render();
  try {
    const resp = await fetch('/api/week');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'request failed');
    state.slate.games = data.games;
  } catch (e) {
    state.slate.error = String(e.message || e);
  } finally {
    state.slate.loading = false;
    render();
  }
}

function activeGameTab() { return state.games.find(g => g.id === state.activeGameId) || null; }

function openGameDetail(eventTicker) {
  const existing = state.games.find(g => g.eventTicker === eventTicker);
  if (existing) {
    state.activeGameId = existing.id;
    state.module = 'slate';
    state.slate.view = 'detail';
    render();
    return;
  }
  const meta = (state.slate.games || []).find(x => x.event_ticker === eventTicker);
  const g = {
    id: nextId++, eventTicker,
    away: meta ? meta.away : null, home: meta ? meta.home : null,
    label: meta ? `${meta.away} @ ${meta.home}` : eventTicker,
    loading: true, error: null, data: null,
  };
  state.games.push(g);
  state.activeGameId = g.id;
  state.module = 'slate';
  state.slate.view = 'detail';
  loadGameTab(g);
  render();
}

async function loadGameTab(g) {
  try {
    const resp = await fetch('/api/game?event=' + encodeURIComponent(g.eventTicker));
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'request failed');
    g.data = data;
    g.away = data.away; g.home = data.home;
    g.label = `${data.away} @ ${data.home}`;
  } catch (e) {
    g.error = String(e.message || e);
  } finally {
    g.loading = false;
    render();
  }
}

function closeGameTab(id) {
  const i = state.games.findIndex(g => g.id === id);
  if (i === -1) return;
  state.games.splice(i, 1);
  if (state.activeGameId === id) {
    const next = state.games[Math.max(0, i - 1)];
    state.activeGameId = next ? next.id : null;
    if (!next) state.slate.view = 'list';
  }
  render();
}

function backToSlateList() {
  state.slate.view = 'list';
  state.activeGameId = null;
  render();
}

// Team logos (Slate module only). Kalshi codes match ESPN's lowercase
// abbreviations except these three.
const ESPN_LOGO_CODE = { JAC: 'jax', WAS: 'wsh', LAR: 'lar' };
function teamLogo(code, size) {
  if (!code) return '';
  const slug = ESPN_LOGO_CODE[code] || code.toLowerCase();
  return `<img src="https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png" alt="" width="${size}" height="${size}" loading="lazy" style="flex-shrink:0;object-fit:contain" onerror="this.style.visibility='hidden'">`;
}

function moneylinePct(side) {
  return side && side.implied_prob_yes !== null && side.implied_prob_yes !== undefined ? (side.implied_prob_yes * 100).toFixed(1) + '%' : '--';
}

function renderSlate() {
  const el = document.getElementById('slateView');
  const g = activeGameTab();
  if (state.slate.view === 'detail' && g) { renderGameDetail(el, g); return; }
  if (state.slate.loading && !state.slate.games) { el.innerHTML = `<div class="empty">Loading week…</div>`; return; }
  if (state.slate.error) { el.innerHTML = `<div class="empty" style="color:var(--orange)">${escapeHtml(state.slate.error)}</div>`; return; }
  if (!state.slate.games) { loadSlate(false); el.innerHTML = `<div class="empty">Loading week…</div>`; return; }
  renderGameList(el);
}

function renderGameList(el) {
  const games = state.slate.games;
  const slots = [];
  games.forEach(g => {
    const slot = gameSlot(g);
    const last = slots[slots.length - 1];
    if (last && last.key === slot.key) last.games.push(g);
    else slots.push({ ...slot, games: [g] });
  });
  const week = games.find(g => g.schedule) ? games.find(g => g.schedule).schedule.week : null;
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 4px">
      <span style="font-size:15px;font-weight:600">${week ? 'WEEK ' + week : 'WEEK OVERVIEW'}</span>
      <span class="mono" style="font-size:10.5px;color:var(--dim)">${games.length} GAMES</span>
    </div>
    <div style="flex-grow:1;min-height:0;overflow:auto;padding:0 4px 8px">
      ${slots.map(sl => `
        <div class="slot-head"><span class="sn">${sl.label}</span><span class="sc mono">${sl.games.length} ${sl.games.length === 1 ? 'GAME' : 'GAMES'}</span></div>
        <div class="game-cards">${sl.games.map(renderGameCard).join('')}</div>
      `).join('')}
    </div>`;
}

// Kickoff slot for grouping: early window (1 PM), late window (4:05/4:25),
// and prime time, per day. Uses the nflverse schedule (ET) when available.
function gameSlot(g) {
  const s = g.schedule;
  if (!s) return { key: 'tbd', label: 'OTHER' };
  const day = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long' }).format(new Date(s.gameday + 'T12:00:00Z')).toUpperCase();
  const hour = parseInt(s.gametime, 10);
  const [slot, label] = hour < 12 ? ['am', `${day} MORNING`]
    : hour < 15 ? ['early', `${day} · 1 PM ET`]
    : hour < 19 ? ['late', `${day} · 4 PM ET`]
    : ['night', `${day} NIGHT`];
  return { key: s.gameday + slot, label };
}

function gameKickoffText(g) {
  const s = g.schedule;
  if (!s) return g.kickoff ? formatKickoff(g.kickoff) : '--';
  const [h, m] = s.gametime.split(':').map(Number);
  const day = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(s.gameday + 'T12:00:00Z')).toUpperCase();
  return `${day} · ${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'} ET`;
}

function renderGameCard(g) {
  const spreadTxt = g.spread ? `${g.spread.team} ${g.spread.line >= 0 ? '-' : '+'}${Math.abs(g.spread.line).toFixed(1)}` : '--';
  const totalTxt = g.total ? g.total.line.toFixed(1) : '--';
  const rec = g.records || {};
  const teamRow = (code, record, side) => `<div class="gc-team mono">
      ${teamLogo(code, 30)}
      <span><span class="gc-code">${code}</span><span class="gc-rec">${record || ''}</span></span>
      <span class="gc-ml" style="color:${moneylineColor(side)}">${moneylinePct(side)}</span>
    </div>`;
  return `<div class="game-card" data-open-game="${g.event_ticker}">
    <div class="gc-top mono"><span>${gameKickoffText(g)}</span><span>AWAY @ HOME</span></div>
    ${teamRow(g.away, rec.away, g.moneyline.away)}
    ${teamRow(g.home, rec.home, g.moneyline.home)}
    <div class="gc-foot mono"><span><span class="k">SPREAD</span>${spreadTxt}</span><span><span class="k">O/U</span>${totalTxt}</span></div>
  </div>`;
}

function moneylineColor(side) {
  if (!side || side.implied_prob_yes === null || side.implied_prob_yes === undefined) return 'var(--muted)';
  return side.implied_prob_yes >= 0.5 ? 'var(--blue)' : 'var(--muted)';
}

function formatKickoff(iso) {
  const dt = new Date(iso);
  return new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit' }).format(dt).toUpperCase() + ' ET';
}

function renderGameDetail(el, g) {
  if (g.loading) { el.innerHTML = `<div class="empty">Loading game…</div>`; return; }
  if (g.error) { el.innerHTML = `<div class="empty" style="color:var(--orange)">${escapeHtml(g.error)}</div>`; return; }
  const d = g.data;
  if (!d) { el.innerHTML = ''; return; }

  const spreadTxt = d.spread ? `${d.spread.team} ${d.spread.line >= 0 ? '-' : '+'}${Math.abs(d.spread.line).toFixed(1)} (${(d.spread.implied_prob_yes * 100).toFixed(0)}%)` : '--';
  const totalTxt = d.total ? `${d.total.line.toFixed(1)} (${(d.total.implied_prob_yes * 100).toFixed(0)}%)` : '--';

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 4px">
      <span class="backlink" data-back-slate="1">&larr; ALL GAMES</span>
      <span style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600">${teamLogo(d.away, 32)}${d.away}<span class="mono" style="font-size:10.5px;color:var(--dim);font-weight:400">${(d.records || {}).away || ''}</span><span style="color:var(--dim);font-weight:400">@</span>${teamLogo(d.home, 32)}${d.home}<span class="mono" style="font-size:10.5px;color:var(--dim);font-weight:400">${(d.records || {}).home || ''}</span></span>
      <span class="mono" style="font-size:10.5px;color:var(--dim)">SPREAD ${spreadTxt} &middot; TOTAL ${totalTxt}</span>
    </div>
    <div style="flex-grow:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 340px;gap:8px;padding:0 4px 8px">
      ${(d.matchups || []).map(matchupPanelHtml).join('')}
      <div class="panel">
        <div class="panel-head"><span class="panel-title">GAME &amp; COMBO MARKETS</span></div>
        <div class="panel-body">${combosHtml(d.combos, d.away, d.home)}</div>
      </div>
    </div>`;
}

// Madden overall -> color tier: 90+ elite, 80+ starter, 70+ depth, else dim.
function ovrColor(ovr) {
  return ovr >= 90 ? 'var(--amber)' : ovr >= 80 ? 'var(--blue)' : ovr >= 70 ? 'var(--on)' : 'var(--dim)';
}

// Player rank tag: FantasyPros weekly ECR position rank for offense,
// Defensive Power Index role rank for defense (colored by DPI percentile).
function rankInfo(r) {
  if (!r) return null;
  if (r.kind === 'ecr') {
    return { txt: r.label, color: 'var(--muted)',
      tip: `FantasyPros weekly ECR ${r.label} (avg rank ${r.ecr}${r.sd !== null ? ', sd ' + r.sd : ''}; best ${r.best} / worst ${r.worst}) ${r.opp || ''}` };
  }
  return {
    txt: r.label + (r.qualified ? '' : '*'),
    color: !r.qualified ? 'var(--dim)' : r.dpi >= 90 ? 'var(--amber)' : r.dpi >= 70 ? 'var(--blue)' : r.dpi >= 40 ? 'var(--on)' : 'var(--dim)',
    tip: `Defensive Power Index ${r.dpi}/100 (percentile vs ${r.role_count} qualified ${r.role})` +
      (r.qualified ? ` · ${r.label}` : ` · not ranked yet: ${r.snaps} snaps`) +
      (r.traits && r.traits.length ? ` · best: ${r.traits.join(', ')}` : ''),
  };
}

function maddenTip(m) {
  return m ? `Madden ${m.iteration || ''}: ${m.ovr} OVR${m.archetype ? ' · ' + m.archetype : ''}${m.speed ? ' · ' + m.speed + ' SPD' : ''}` : 'No Madden rating found';
}

function edgeColor(e) {
  return e === null || e === undefined ? 'var(--dim)' : e >= 5 ? 'var(--blue)' : e <= -5 ? 'var(--orange)' : 'var(--muted)';
}
const signed = (e, dec = 0) => e === null || e === undefined ? '--' : (e > 0 ? '+' : '') + Number(e).toFixed(dec);

// Last name for compact backup lists, skipping suffixes ("Samuel Jr." not "Jr.").
const shortName = (n) => { const w = n.split(' '); const last = w[w.length - 1]; return w.length > 2 && /^(jr|sr|ii|iii|iv|v)\.?$/i.test(last) ? w[w.length - 2] : last; };

// One depth-chart slot: starter (clickable, with rank tag) and the backups
// behind him with their OVRs. `align` mirrors the defense side toward the center.
function depthCellHtml(players, align) {
  if (!players || !players.length) return `<div style="color:var(--faint);text-align:${align}">—</div>`;
  const [st, ...backups] = players;
  const rk = rankInfo(st.rank);
  const rkHtml = rk ? `<span title="${escapeHtml(rk.tip)}" style="font-size:9.5px;color:${rk.color}">${escapeHtml(rk.txt)}</span>` : '';
  const name = `<span class="roster-player" data-open-player="${escapeHtml(st.full_name)}" style="color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(st.full_name)}</span>`;
  const img = st.headshot_url
    ? `<img src="${escapeHtml(st.headshot_url)}" alt="" loading="lazy" data-open-player="${escapeHtml(st.full_name)}" class="roster-player" style="width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#161B22;object-fit:cover" onerror="this.style.visibility='hidden'">`
    : `<span style="width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#161B22"></span>`;
  const bk = backups.map((p, i) => `<span class="roster-player" data-open-player="${escapeHtml(p.full_name)}" title="${escapeHtml(maddenTip(p.madden))}">${i + 2} ${escapeHtml(shortName(p.full_name))} <span style="color:${p.madden ? ovrColor(p.madden.ovr) : 'var(--faint)'}">${p.madden ? p.madden.ovr : '·'}</span></span>`).join(' · ');
  return `<div style="min-width:0;display:flex;align-items:center;gap:8px;${align === 'right' ? 'flex-direction:row-reverse' : ''}">
    ${img}
    <div style="min-width:0;display:flex;flex-direction:column;align-items:${align === 'right' ? 'flex-end' : 'flex-start'}">
      <div style="display:flex;align-items:baseline;gap:6px;max-width:100%;${align === 'right' ? 'flex-direction:row-reverse' : ''}">${name}${rkHtml}</div>
      ${bk ? `<div style="font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${bk}</div>` : ''}
    </div>
  </div>`;
}

function ovrHtml(players) {
  const m = players && players[0] ? players[0].madden : null;
  return `<span title="${escapeHtml(maddenTip(m))}" style="text-align:center;font-weight:600;font-size:12px;color:${m ? ovrColor(m.ovr) : 'var(--faint)'}">${m ? m.ovr : '·'}</span>`;
}

// Team A offense vs team B defense: each offensive starter lined up across
// from the defender he usually faces, Madden OVR both sides, and the gap
// (positive = offense edge).
function matchupPanelHtml(mu) {
  const grid = 'display:grid;grid-template-columns:34px minmax(0,1fr) 26px 40px 26px minmax(0,1fr) 34px;gap:6px;align-items:center';
  let html = `<div class="panel">
    <div class="panel-head"><span class="panel-title" style="display:flex;align-items:center;gap:6px">${teamLogo(mu.offense_team, 16)}${mu.offense_team} OFF <span style="color:var(--dim);font-weight:400">vs</span> ${teamLogo(mu.defense_team, 16)}${mu.defense_team} DEF</span><span class="mono" style="margin-left:auto;display:flex;align-items:center;padding-right:8px;font-size:9.5px;color:var(--dim)">${mu.scheme} BASE · 11 PERS</span></div>
    <div class="panel-body mono" style="font-size:11px">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px 8px;border-bottom:1px solid var(--head-rule)">
        ${mu.summary.map(u => `<div title="Avg Madden OVR of paired starters: ${u.off_label} ${u.off_avg ?? '--'} vs ${u.def_label} ${u.def_avg ?? '--'}" style="display:flex;flex-direction:column;gap:2px;padding:4px 6px;background:var(--panel-head)">
          <span style="font-size:9.5px;letter-spacing:0.06em;color:var(--dim)">${u.unit}</span>
          <span><span style="color:var(--on)">${u.off_avg ?? '--'}</span> <span style="color:var(--dim)">v</span> <span style="color:var(--on)">${u.def_avg ?? '--'}</span> <b style="color:${edgeColor(u.edge)};font-weight:600">${signed(u.edge, 1)}</b></span>
        </div>`).join('')}
      </div>
      <div style="${grid};height:18px;padding:0 8px;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
        <span>POS</span><span>${mu.offense_team} OFFENSE</span><span style="text-align:center">OVR</span><span style="text-align:center">EDGE</span><span style="text-align:center">OVR</span><span style="text-align:right">${mu.defense_team} DEFENSE</span><span style="text-align:right">POS</span>
      </div>`;
  let unit = null;
  mu.rows.forEach(r => {
    if (r.unit !== unit) {
      unit = r.unit;
      html += `<div style="padding:6px 8px 2px;font-size:9.5px;letter-spacing:0.08em;color:var(--label)">${unit}</div>`;
    }
    const e = r.edge;
    html += `<div style="${grid};min-height:38px;padding:3px 8px;border-bottom:1px solid var(--row-rule)">
      <span style="color:var(--dim)">${r.off_pos}</span>
      ${depthCellHtml(r.offense, 'left')}
      ${ovrHtml(r.offense)}
      <span style="text-align:center;font-weight:600;color:${edgeColor(e)};background:${e >= 5 ? 'rgba(90,169,255,0.12)' : e <= -5 ? 'rgba(255,122,69,0.12)' : 'transparent'};padding:2px 0">${signed(e)}</span>
      ${ovrHtml(r.defense)}
      ${depthCellHtml(r.defense, 'right')}
      <span style="text-align:right;color:var(--dim)">${r.def_pos || ''}</span>
    </div>`;
  });
  if (mu.extras && mu.extras.length) {
    html += `<div style="padding:6px 8px;font-size:10px;color:var(--dim)">ALSO IN BASE D: ${mu.extras.map(x => {
      const p = x.defense[0];
      return `${x.def_pos} <span class="roster-player" data-open-player="${escapeHtml(p.full_name)}" style="color:var(--label)">${escapeHtml(p.full_name)}</span> <span style="color:${p.madden ? ovrColor(p.madden.ovr) : 'var(--faint)'}">${p.madden ? p.madden.ovr : '·'}</span>`;
    }).join(' · ')}</div>`;
  }
  html += `<div style="padding:4px 8px 8px;font-size:9.5px;color:var(--faint)">EDGE = offense OVR − defender OVR · typical alignment, not snap charting</div></div></div>`;
  return html;
}

// The outcome(s) priced closest to 50% within one market -- the "main line".
// Single-outcome markets have nothing to compare, so they get no highlight.
function nearestToEven(outcomes) {
  const priced = outcomes.filter(o => o.implied_prob_yes !== null && o.implied_prob_yes !== undefined);
  if (priced.length < 2) return new Set();
  const dist = o => Math.abs(o.implied_prob_yes - 0.5);
  const best = Math.min(...priced.map(dist));
  return new Set(priced.filter(o => dist(o) - best < 1e-9));
}

function combosHtml(combos, away, home) {
  if (!combos || !combos.length) return `<div class="empty">No combo markets found for this game.</div>`;
  const rowPx = monoTextPx(combos.flatMap(c => (c.outcomes || []).map(o => o.title)), 10.5) + 8 + 48 + 16;
  return combos.map(c => {
    if (c.series === 'KXNFLRACE') return raceLadderHtml(c, away, home, rowPx);
    const even = nearestToEven(c.outcomes);
    return `<div class="combo-block">
      <div style="font-size:11px;font-weight:600;color:var(--label);padding:0 8px 4px">${c.label}</div>
      <div style="max-width:${rowPx}px">${c.outcomes.map(o => outcomeRow(o, even.has(o))).join('')}</div>
    </div>`;
  }).join('');
}

// Race to N as a ladder: one rung per point threshold, columns per team
// (away, home) plus "neither". Each cell has a bar sized to its probability.
const RACE_COLS = '64px repeat(3, minmax(0,1fr))';
const CHECK_SVG = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="var(--amber)" stroke-width="1.6"><path d="M1.5 5.2l2.3 2.3L8.5 2.5"></path></svg>`;

function raceLadderHtml(c, away, home, widthPx) {
  const even = nearestToEven(c.thresholds.flatMap(t => t.outcomes));
  const cell = (o) => {
    if (!o || o.implied_prob_yes === null || o.implied_prob_yes === undefined) {
      return `<span class="right" style="color:var(--faint);padding-right:4px">--</span>`;
    }
    const p = o.implied_prob_yes * 100, hl = even.has(o);
    return `<span title="${escapeHtml(o.title || '')}${hl ? ' · closest to 50%' : ''}" style="position:relative;height:15px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;background:${hl ? 'var(--amber-soft)' : '#141920'};${hl ? 'box-shadow:inset 0 0 0 1px var(--amber-ring);' : ''}">
      <span style="position:absolute;left:0;top:0;bottom:0;width:${p.toFixed(1)}%;background:${hl ? 'rgba(242,165,65,0.28)' : 'var(--blue-bar)'};opacity:${hl ? 1 : 0.55}"></span>
      <span style="position:relative;color:${hl ? 'var(--amber)' : 'var(--on)'}">${p.toFixed(1)}%</span>
    </span>`;
  };
  const colHead = (code) => `<span style="display:flex;align-items:center;justify-content:flex-end;gap:5px;color:var(--label)">${teamLogo(code, 14)}${code}</span>`;
  return `<div class="combo-block">
    <div style="font-size:11px;font-weight:600;color:var(--label);padding:0 8px 4px">${c.label}</div>
    <div class="mono" style="padding:0 8px;font-size:10.5px;max-width:${Math.max(widthPx || 0, 360)}px">
      <div style="height:20px;display:grid;grid-template-columns:${RACE_COLS};gap:4px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
        <span>FIRST TO</span>${colHead(away)}${colHead(home)}<span class="right">NEITHER</span>
      </div>
      ${c.thresholds.map(t => {
        const by = code => t.outcomes.find(o => o.team_code === code);
        return `<div style="height:21px;display:grid;grid-template-columns:${RACE_COLS};gap:4px;align-items:center;border-bottom:1px solid var(--row-rule)">
          <span style="display:flex;align-items:center;gap:5px;color:var(--on)">${CHECK_SVG}${t.threshold}</span>
          ${cell(by(away))}${cell(by(home))}${cell(by('NONE'))}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function outcomeRow(o, even) {
  const imp = o.implied_prob_yes !== null && o.implied_prob_yes !== undefined ? (o.implied_prob_yes * 100) : null;
  const hl = even ? 'background:var(--amber-soft);box-shadow:inset 2px 0 0 var(--amber);' : '';
  return `<div class="mono" ${even ? 'title="Closest to 50% in this market"' : ''} style="height:19px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:10.5px;border-bottom:1px solid var(--row-rule);${hl}">
    <span style="color:${even ? 'var(--on)' : 'var(--muted)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-grow:1">${escapeHtml(o.title || '')}</span>
    <span style="color:${even ? 'var(--amber)' : 'var(--on)'};width:48px;flex-shrink:0;text-align:right">${imp !== null ? imp.toFixed(1) + '%' : '--'}</span>
  </div>`;
}

// ========================================================================
// BOOK module: all open positions, grouped by game (secondary: futures).
// ========================================================================

async function loadBook(force) {
  if (state.book.data && !force) { render(); return; }
  state.book.loading = true; state.book.error = null;
  render();
  try {
    const resp = await fetch('/api/positions');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'request failed');
    state.book.data = data;
  } catch (e) {
    state.book.error = String(e.message || e);
  } finally {
    state.book.loading = false;
    render();
  }
}

// Book-module matchup strings come straight from Kalshi's event sub_title
// ("AWAY vs HOME", team codes) -- parse it back out to pull each team's logo.
function matchupTitleHtml(matchup) {
  const parts = (matchup || '').split(' vs ');
  if (parts.length !== 2) return escapeHtml(matchup || '');
  const [away, home] = parts.map(s => s.trim());
  return `<span style="display:flex;align-items:center;gap:6px">${teamLogo(away, 18)}<span>${escapeHtml(away)}</span><span style="color:var(--dim)">@</span>${teamLogo(home, 18)}<span>${escapeHtml(home)}</span></span>`;
}

function renderBookModule() {
  const el = document.getElementById('bookView');
  if (state.book.loading && !state.book.data) { el.innerHTML = `<div class="empty">Loading positions…</div>`; return; }
  if (state.book.error) { el.innerHTML = `<div class="empty" style="color:var(--orange)">${escapeHtml(state.book.error)}</div>`; return; }
  if (!state.book.data) { loadBook(false); el.innerHTML = `<div class="empty">Loading positions…</div>`; return; }

  const d = state.book.data;
  if (d.count === 0) { el.innerHTML = `<div class="empty">No open Kalshi positions.</div>`; return; }

  const allRows = [];
  d.weekly.forEach(g => g.positions.forEach(m => allRows.push(buildPositionRow(m, m.title))));
  d.futures.forEach(g => g.positions.forEach(m => allRows.push(buildPositionRow(m, m.title))));

  const weeklyRows = d.weekly.map(g => g.positions.map(m => buildPositionRow(m, m.player_name ? `${m.player_name} · ${m.title}` : m.title)));
  const futuresRows = d.futures.map(g => g.positions.map(m => buildPositionRow(m, m.title)));
  // Each section shares one label width so its tables line up; futures titles
  // run much longer, so they get their own.
  const weeklyPx = monoTextPx(weeklyRows.flat().map(p => p.label), 11);
  const futuresPx = monoTextPx(futuresRows.flat().map(p => p.label), 11);

  let html = `<div class="panel" style="margin-bottom:8px;flex-shrink:0"><div class="panel-body" style="padding:8px;flex-shrink:0;overflow:visible">${positionsTilesHtml(allRows)}</div></div>`;

  html += `<div class="section-label">THIS WEEK'S GAMES (${d.weekly.length})</div>`;
  if (!d.weekly.length) {
    html += `<div class="empty">No single-game positions this week.</div>`;
  } else {
    d.weekly.forEach((g, i) => {
      const rows = weeklyRows[i], labelPx = weeklyPx;
      html += `<div class="panel" style="margin-bottom:8px;flex-shrink:0">
        <div class="panel-head"><span class="panel-title">${matchupTitleHtml(g.matchup)}</span></div>
        <div class="panel-body" style="padding:0 8px;flex-shrink:0;overflow:visible">${positionsTableHtml(rows, labelPx)}</div>
      </div>`;
    });
  }

  html += `<details style="margin-top:4px">
    <summary class="section-label" style="cursor:pointer;display:inline-block">FUTURES &amp; SEASON PROPS (${d.futures.reduce((a, g) => a + g.positions.length, 0)}) -- secondary</summary>`;
  if (!d.futures.length) {
    html += `<div class="empty">No futures positions.</div>`;
  } else {
    d.futures.forEach((g, i) => {
      const rows = futuresRows[i], labelPx = futuresPx;
      html += `<div class="panel" style="margin-bottom:8px;flex-shrink:0">
        <div class="panel-head"><span class="panel-title">${escapeHtml(g.category.toUpperCase())}</span></div>
        <div class="panel-body" style="padding:0 8px;flex-shrink:0;overflow:visible">${positionsTableHtml(rows, labelPx)}</div>
      </div>`;
    });
  }
  html += `</details>`;

  el.innerHTML = html;
}

function buildGridSkeleton(grid) {
  grid.innerHTML = `
    <div id="leftcol">
      <div id="markets" class="panel">
        <div class="panel-head">
          <span class="panel-title">MARKETS</span>
          <div id="marketsTabs" style="display:flex"></div>
          <div class="legend">
            <span style="display:flex;align-items:center;gap:4px"><span style="color:var(--muted)">◆</span>REF LINE</span>
            <span style="display:flex;align-items:center;gap:4px"><span class="swatch" style="background:rgba(242,165,65,0.35)"></span>HELD</span>
            <span style="display:flex;align-items:center;gap:4px"><span style="color:var(--orange)">SPR</span>≥10¢</span>
          </div>
        </div>
        <div id="marketsBody" class="panel-body"></div>
      </div>
      <div id="curve" class="panel">
        <div class="panel-head">
          <span class="panel-title">IMPLIED CURVE</span>
          <div id="curveTabs" style="display:flex"></div>
        </div>
        <div id="curveBody" class="panel-body" style="display:flex;flex-direction:column"></div>
      </div>
    </div>
    <div id="rightcol">
      <div id="book" class="panel">
        <div class="panel-head">
          <span class="panel-title">BOOK &amp; RISK</span>
          <div id="bookTabs" style="display:flex"></div>
        </div>
        <div id="bookBody" class="panel-body"></div>
      </div>
      <div id="lowerrow">
        <div class="panel">
          <div class="panel-head"><span class="panel-title">MATCHUP</span><div id="matchTabs" style="display:flex"></div></div>
          <div id="matchBody" class="panel-body"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><span class="panel-title">INJURIES</span><div id="injTabs" style="display:flex"></div></div>
          <div id="injBody" class="panel-body"></div>
        </div>
      </div>
    </div>`;
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const railT = e.target.closest('[data-module]');
  const openT = e.target.closest('[data-open]');
  const closeT = e.target.closest('[data-close]');
  const mktT = e.target.closest('[data-mkt]');
  const curveT = e.target.closest('[data-curve]');
  const riskT = e.target.closest('[data-risk]');
  const matchT = e.target.closest('[data-match]');
  const injT = e.target.closest('[data-inj]');
  const gameT = e.target.closest('[data-open-game]');
  const playerT = e.target.closest('[data-open-player]');
  const backSlateT = e.target.closest('[data-back-slate]');
  const openGameTabT = e.target.closest('[data-open-gametab]');
  const closeGameTabT = e.target.closest('[data-close-gametab]');
  const comboT = e.target.closest('[data-combo]');
  const logSeasonT = e.target.closest('[data-logseason]');
  const gameUrlT = e.target.closest('[data-gameurl]');
  const t = activeTicket();
  if (gameUrlT) { window.open(gameUrlT.dataset.gameurl, '_blank', 'noopener'); return; }
  if (logSeasonT && t) { t.ui.logSeason = Number(logSeasonT.dataset.logseason); renderMarkets(); return; }
  if (comboT && t && t.data) { if (!comboT.disabled) handleComboClick(comboT, t); return; }
  if (closeT) { e.stopPropagation(); closeTicket(Number(closeT.dataset.close)); return; }
  if (closeGameTabT) { e.stopPropagation(); closeGameTab(Number(closeGameTabT.dataset.closeGametab)); return; }
  if (railT) { state.module = railT.dataset.module; render(); return; }
  if (openT) { state.activeId = Number(openT.dataset.open); state.module = 'research'; render(); return; }
  if (openGameTabT) { state.activeGameId = Number(openGameTabT.dataset.openGametab); state.module = 'slate'; state.slate.view = 'detail'; render(); return; }
  if (mktT && t) { t.ui.mkt = mktT.dataset.mkt; renderMarkets(); return; }
  if (curveT && t) { t.ui.curve = curveT.dataset.curve; renderCurve(); return; }
  if (riskT && t) { t.ui.risk = riskT.dataset.risk; renderBook(); return; }
  if (matchT && t) { t.ui.match = matchT.dataset.match; renderMatchup(); return; }
  if (injT && t) { t.ui.inj = injT.dataset.inj; renderInjuries(); return; }
  if (gameT) { openGameDetail(gameT.dataset.openGame); return; }
  if (playerT) { openPlayerFromDrilldown(playerT.dataset.openPlayer); return; }
  if (backSlateT) { backToSlateList(); return; }
  if (e.target.id === 'newticket') { state.module = 'research'; document.getElementById('q').focus(); return; }
});

// Player-name autocomplete. The roster list loads once; matching is local.
const qEl = document.getElementById('q');
const suggestEl = document.getElementById('suggest');
const sugg = { players: null, items: [], idx: -1 };
let playersLoading = false;
function loadPlayers() {
  if (playersLoading || (sugg.players && sugg.players.length)) return;
  playersLoading = true;
  fetch('/api/players').then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      sugg.players = d.players || [];
      if (document.activeElement === qEl && qEl.value.trim()) { sugg.items = matchPlayers(qEl.value); renderSuggest(); }
    })
    .catch(() => {})
    .finally(() => { playersLoading = false; });
}
loadPlayers();

// Trailing 4h Kalshi prop volume by player, used to rank suggestions.
// Refreshed every 5 minutes (the server caches for the same period).
sugg.vol = {}; sugg.volLast = {};
function loadPlayerVolume() {
  fetch('/api/player_volume').then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => {
      const vol = {}, volLast = {};
      for (const p of d.players || []) {
        const k = volKey(p.name), lk = lastTeamKey(p.name, p.team);
        vol[k] = (vol[k] || 0) + p.vol;
        volLast[lk] = (volLast[lk] || 0) + p.vol;
      }
      sugg.vol = vol; sugg.volLast = volLast;
      if (document.activeElement === qEl && qEl.value.trim()) { sugg.items = matchPlayers(qEl.value); renderSuggest(); }
    })
    .catch(() => {});
}
loadPlayerVolume();
setInterval(loadPlayerVolume, 5 * 60 * 1000);

const normName = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f.'\-]/g, '');
// Kalshi and nflverse disagree on suffixes ("Jr.", "III"), so key volume on the bare name.
const volKey = (s) => normName(s).replace(/\s+(jr|sr|ii|iii|iv|v)$/, '').replace(/\s+/g, ' ').trim();
const lastTeamKey = (name, team) => volKey(name).split(' ').pop() + '|' + (team || '');
const playerVol = (p) => sugg.vol[volKey(p.name)] || sugg.volLast[lastTeamKey(p.name, p.team)] || 0;
const fmtVol = (v) => v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : String(Math.round(v));

function matchPlayers(q) {
  const n = normName(q.trim());
  if (!n || !sugg.players) return [];
  const starts = [], words = [], contains = [];
  for (const p of sugg.players) {
    const nm = normName(p.name);
    if (nm.startsWith(n)) starts.push(p);
    else if (nm.split(' ').some(w => w.startsWith(n))) words.push(p);
    else if (nm.includes(n)) contains.push(p);
  }
  // Highest 4h volume first; ties (incl. no volume) keep name-match order.
  const ranked = starts.concat(words, contains).map((p, i) => ({ p, i, v: playerVol(p) }));
  ranked.sort((a, b) => b.v - a.v || a.i - b.i);
  return ranked.slice(0, 8).map(r => r.p);
}

function hideSuggest() {
  suggestEl.hidden = true; sugg.items = []; sugg.idx = -1;
  qEl.setAttribute('aria-expanded', 'false');
}

function renderSuggest() {
  if (!sugg.items.length) { hideSuggest(); return; }
  const q = qEl.value.trim();
  suggestEl.innerHTML = sugg.items.map((p, i) => {
    const at = p.name.toLowerCase().indexOf(q.toLowerCase());
    const nm = at >= 0
      ? escapeHtml(p.name.slice(0, at)) + '<b>' + escapeHtml(p.name.slice(at, at + q.length)) + '</b>' + escapeHtml(p.name.slice(at + q.length))
      : escapeHtml(p.name);
    return `<div class="sg${i === sugg.idx ? ' on' : ''}" role="option" data-sg="${i}"><span class="nm">${nm}</span><span class="meta mono">${escapeHtml(p.pos || '')} · ${escapeHtml(p.team || '')}</span><span class="meta mono" style="width:40px;text-align:right;color:${playerVol(p) ? 'var(--amber)' : 'var(--dim)'}" title="Kalshi prop volume, last 4h">${playerVol(p) ? fmtVol(playerVol(p)) : '·'}</span></div>`;
  }).join('');
  suggestEl.hidden = false;
  qEl.setAttribute('aria-expanded', 'true');
}

function submitSearch(v) {
  v = v.trim();
  if (!v) return;
  hideSuggest();
  state.module = 'research'; newTicket(v); qEl.value = '';
}

document.addEventListener('change', (e) => {
  const t = activeTicket();
  if (t && e.target.dataset && e.target.dataset.comboInput) handleComboInput(e.target, t);
});

qEl.addEventListener('input', () => { loadPlayers(); sugg.items = matchPlayers(qEl.value); sugg.idx = -1; renderSuggest(); });
qEl.addEventListener('blur', () => setTimeout(hideSuggest, 120));
suggestEl.addEventListener('mousedown', (e) => {
  const row = e.target.closest('[data-sg]');
  if (row) { e.preventDefault(); submitSearch(sugg.items[Number(row.dataset.sg)].name); }
});

qEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' && sugg.items.length) {
    e.preventDefault(); sugg.idx = (sugg.idx + 1) % sugg.items.length; renderSuggest();
  } else if (e.key === 'ArrowUp' && sugg.items.length) {
    e.preventDefault(); sugg.idx = (sugg.idx - 1 + sugg.items.length) % sugg.items.length; renderSuggest();
  } else if (e.key === 'Escape') {
    hideSuggest();
  } else if (e.key === 'Enter') {
    submitSearch(sugg.idx >= 0 ? sugg.items[sugg.idx].name : qEl.value);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== document.getElementById('q')) {
    e.preventDefault();
    document.getElementById('q').focus();
  }
});

buildGridSkeleton(document.getElementById('grid'));
tickClock();
render();
</script>
