<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player Research Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090B; --chrome:#0B0E12; --panel:#101318; --panel-head:#0D1014;
  --border:#1E242C; --row-rule:#151A20; --head-rule:#262E37;
  --on:#E3E7EC; --label:#C9D1D9; --muted:#9AA4AF; --dim:#7A8591; --faint:#3A434E;
  --amber:#F2A541; --amber-soft:rgba(242,165,65,0.10); --amber-ring:rgba(242,165,65,0.35);
  --blue:#5AA9FF; --blue-bar:#2F5F92; --orange:#FF7A45; --ask:#FF9F6E; --neutral:#4A5561;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;color:var(--on);font-size:12px}
button{font:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:1px solid var(--amber);outline-offset:-1px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
input::placeholder{color:#6F7A86}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#20262e}
::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

/* top bar */
#topbar{height:36px;flex-shrink:0;display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--chrome)}
#logo{width:48px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border)}
#logo span{width:24px;height:24px;background:var(--amber);color:var(--bg);font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center}
#tickets{display:flex;align-items:stretch;overflow-x:auto}
.ticket{display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--border);white-space:nowrap;border-top:2px solid transparent}
.ticket .tname{font-weight:600;font-size:12px;letter-spacing:0.04em}
.ticket .tsub{font-size:10px;color:var(--dim)}
.ticket .tclose{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:#6F7A86}
.ticket .tteam{width:3px;align-self:stretch;flex-shrink:0;margin:0 -4px 0 -12px}
#tabgroup-div{width:1px;flex-shrink:0;background:var(--border);margin:8px 0}
#newticket{width:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);border-right:1px solid var(--border)}
#searchwrap{flex-grow:1;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:8px}
#searchbox{position:relative;display:flex;align-items:center;gap:8px;width:300px;height:24px;padding:0 8px;background:var(--bg);border:1px solid var(--head-rule)}
#q{flex-grow:1;min-width:0;background:none;border:0;color:var(--on);font:inherit;font-size:12px;outline:none}
#suggest{position:absolute;top:23px;left:-1px;right:-1px;z-index:50;background:var(--chrome);border:1px solid var(--head-rule);max-height:320px;overflow-y:auto}
#suggest .sg{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12px;color:var(--label);cursor:pointer}
#suggest .sg.on,#suggest .sg:hover{background:var(--amber-soft);color:var(--on)}
#suggest .sg .nm{flex-grow:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#suggest .sg .nm b{color:var(--amber);font-weight:600}
#suggest .sg .meta{font-size:10px;color:var(--dim)}
#statusbar{display:flex;align-items:center;gap:16px;padding:0 14px;border-left:1px solid var(--border);font-size:10.5px;color:var(--muted);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:3px;display:inline-block}

/* rail */
#rail{width:48px;flex-shrink:0;border-right:1px solid var(--border);background:var(--chrome);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.railbtn{width:48px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.railbtn.active{color:var(--amber);background:#141920}

/* context strip */
#ctx{height:60px;flex-shrink:0;display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--chrome);overflow-x:auto}
#ctx .who{display:flex;align-items:center;gap:10px;padding:0 16px;min-width:230px;flex-shrink:0;border-right:1px solid var(--border)}
#ctx .who .headshot{width:44px;height:44px;flex-shrink:0;border-radius:2px;background:#161B22;object-fit:cover;object-position:top}
#ctx .who .whotext{display:flex;flex-direction:column;justify-content:center}
#ctx .who .name{font-size:20px;font-weight:600;letter-spacing:0.02em}
#ctx .who .pos{font-size:11px;color:var(--amber)}
#ctx .who .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 14px;border-right:1px solid var(--border);flex-shrink:0}
.kpi .kl{font-size:10px;letter-spacing:0.08em;color:var(--dim);white-space:nowrap}
.kpi .kv{font-size:13px;white-space:nowrap}

/* workspace grid */
#grid{flex-grow:1;min-height:0;padding:8px;display:grid;grid-template-columns:760px minmax(0,1fr);gap:8px;overflow:hidden}
#leftcol{display:flex;flex-direction:column;gap:8px;min-height:0}
#rightcol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.panel{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);min-height:0}
.panel-head{height:30px;flex-shrink:0;display:flex;align-items:stretch;background:var(--panel-head);border-bottom:1px solid var(--border);padding-left:10px;gap:4px}
.panel-title{display:flex;align-items:center;font-size:10px;letter-spacing:0.1em;color:var(--dim);font-weight:600;margin-right:8px;white-space:nowrap}
.tab{padding:0 8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent;border-top:2px solid transparent}
.tab.small{font-size:11.5px;padding:0 7px}
.tab.on{color:var(--on);border-bottom-color:var(--amber)}
.tab .cnt{font-size:10px;color:var(--dim)}
.panel-body{flex-grow:1;min-height:0;overflow:auto}
.legend{display:flex;align-items:center;gap:12px;padding:0 10px;font-size:10px;color:var(--dim);margin-left:auto}
.swatch{width:8px;height:8px;display:inline-block}

#markets{height:280px;flex-grow:1}
#curve{height:230px;flex-shrink:0}
#book{height:280px;flex-shrink:0}
#lowerrow{height:360px;flex-shrink:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#history{flex-grow:1;min-height:0}

table.t{width:100%;border-collapse:collapse;font-size:11px}
table.t thead th{text-align:left;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);font-weight:500;border-bottom:1px solid var(--head-rule);padding:2px 4px;white-space:nowrap}
table.t td{padding:2px 4px;border-bottom:1px solid var(--row-rule);white-space:nowrap}
.right{text-align:right}
.ladder-head{height:18px;display:grid;grid-template-columns:50px 30px 30px 28px minmax(0,1fr) 44px 36px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)}
.ladder-group{height:18px;display:flex;align-items:center;gap:8px;background:#0B0E12;border-bottom:1px solid #1A2027;padding:0 4px}
.ladder-row{height:17px;display:grid;grid-template-columns:50px 30px 30px 28px minmax(0,1fr) 44px 36px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule)}
.bar-track{flex-grow:1;height:7px;background:#161B22;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue-bar)}
.bar-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.stat-tiles{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border)}
.stat-tile{background:var(--panel-head);padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.stat-tile .sl{font-size:9.5px;letter-spacing:0.08em;color:var(--dim)}
.stat-tile .sv{font-size:13px}
.rankbar{height:6px;background:#161B22;position:relative}
.rankbar-fill{position:absolute;left:0;top:0;bottom:0}
.pill{font-size:9.5px;font-weight:600;padding:1px 5px}
.empty{padding:16px;color:var(--dim);font-size:12px;text-align:center}
.slot-head{display:flex;align-items:baseline;gap:10px;padding:14px 2px 6px;border-bottom:1px solid var(--head-rule);margin-bottom:8px}
.slot-head:first-child{padding-top:2px}
.slot-head .sn{font-size:11px;letter-spacing:0.1em;color:var(--amber);font-weight:600}
.slot-head .sc{font-size:10px;color:var(--dim)}
.game-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.game-card{cursor:pointer;background:var(--panel);border:1px solid var(--border);display:flex;flex-direction:column}
.game-card:hover{border-color:var(--amber-ring);background:#12161C}
.game-card .gc-top{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--panel-head);border-bottom:1px solid var(--border);font-size:10px;color:var(--dim);letter-spacing:0.04em}
.game-card .gc-team{height:44px;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:0 10px}
.game-card .gc-team + .gc-team{border-top:1px solid var(--row-rule)}
.game-card .gc-code{font-size:15px;font-weight:600;letter-spacing:0.03em}
.game-card .gc-rec{font-size:10.5px;color:var(--dim);margin-left:8px}
.game-card .gc-ml{font-size:13px;text-align:right}
.game-card .gc-foot{height:26px;display:flex;align-items:center;gap:14px;padding:0 10px;border-top:1px solid var(--border);font-size:10.5px;color:var(--label)}
.game-card .gc-foot .k{color:var(--dim);margin-right:4px}
.roster-player{cursor:pointer}
.inj-row{cursor:default}
.inj-row:hover,.inj-row.hov{background:var(--amber-soft)}
#injPop{position:fixed;z-index:60;width:340px;max-height:360px;overflow-y:auto;background:var(--chrome);border:1px solid var(--amber-ring);box-shadow:0 8px 24px rgba(0,0,0,0.5);font-size:12px}
#injPop .ip-head{padding:8px 10px;border-bottom:1px solid var(--head-rule);background:var(--panel-head)}
#injPop .ip-name{font-weight:600;font-size:13px}
#injPop .ip-meta{margin-top:3px;font-size:10.5px;color:var(--muted)}
#injPop .ip-sec{padding:6px 10px 2px;font-size:9.5px;letter-spacing:0.08em;color:var(--dim)}
#injPop a.ip-item{display:block;padding:6px 10px;border-bottom:1px solid var(--row-rule);color:var(--label);text-decoration:none}
#injPop a.ip-item:hover{background:var(--amber-soft);color:var(--on)}
#injPop .ip-src{margin-top:2px;font-size:10px;color:var(--dim)}
#injPop .ip-src b{color:var(--amber);font-weight:500}
.roster-player:hover{color:var(--amber)}
.backlink{color:var(--amber);cursor:pointer;font-size:11px}
.backlink:hover{color:#FFC57A}
.combo-block{border-bottom:1px solid var(--row-rule);padding:8px 0}
.section-label{font-size:10px;letter-spacing:0.1em;color:var(--dim);font-weight:600;padding:8px 4px 4px}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="logo"><span>NK</span></div>
    <div id="tickets"></div>
    <button id="newticket" type="button" aria-label="Open new player ticket">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 0v10M0 5h10"></path></svg>
    </button>
    <div id="searchwrap">
      <label for="q" class="sr">Search</label>
      <div id="searchbox">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#7A8591" stroke-width="1.3"><circle cx="5" cy="5" r="4"></circle><path d="M8 8l3.5 3.5"></path></svg>
        <input id="q" type="text" placeholder="Player name…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
        <span class="mono" style="font-size:10px;color:var(--dim);border:1px solid var(--head-rule);padding:0 4px">/</span>
        <div id="suggest" role="listbox" hidden></div>
      </div>
    </div>
    <div id="statusbar" class="mono">
      <span id="kalshiStatus" style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:var(--blue)"></span>KALSHI LIVE</span>
      <span>NFLVERSE · CACHED</span>
      <span id="clock" style="color:var(--on)"></span>
    </div>
  </div>

  <div style="flex-grow:1;min-height:0;display:flex">
    <div id="rail">
      <button class="railbtn" type="button" data-module="research" aria-label="Player research">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"></circle><path d="M12 12l4.5 4.5"></path></svg>
      </button>
      <button class="railbtn" type="button" data-module="book" aria-label="Book and positions">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 15V9M6.5 15V5M11 15V8M15.5 15V2"></path></svg>
      </button>
      <button class="railbtn" type="button" data-module="slate" aria-label="Weekly slate">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3.5" width="14" height="12.5"></rect><path d="M2 7.5h14M6 1.5v4M12 1.5v4"></path></svg>
      </button>
      <button class="railbtn" type="button" aria-label="Correlation map (not built)" title="Not built yet">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4" cy="4" r="2"></circle><circle cx="14" cy="5" r="2"></circle><circle cx="8" cy="14" r="2"></circle><path d="M5.7 5.2l1.6 7M12.3 6.3l-3 6.1M6 4.2h6"></path></svg>
      </button>
      <button class="railbtn" type="button" aria-label="Alerts (not built)" title="Not built yet">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 13V8a5 5 0 0110 0v5l1.5 1.5h-13z"></path><path d="M7 16.5h4"></path></svg>
      </button>
      <div style="flex-grow:1"></div>
      <button class="railbtn" type="button" aria-label="Settings (not built)" title="Not built yet" style="margin-bottom:6px">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5h9M14 5h2M2 13h3M8 13h8"></path><circle cx="12.5" cy="5" r="1.6"></circle><circle cx="6.5" cy="13" r="1.6"></circle></svg>
      </button>
    </div>

    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;position:relative">
      <div id="ctx"></div>
      <div id="grid"></div>
      <div id="slateView" style="display:none;flex-direction:column;flex-grow:1;min-height:0"></div>
      <div id="bookView" style="display:none;flex-direction:column;flex-grow:1;min-height:0;overflow:auto;padding:8px"></div>
      <div id="injPop" hidden></div>
      <div id="overlay" style="display:none;position:absolute;left:0;right:0;top:0;bottom:0;background:var(--bg);align-items:center;justify-content:center;font-size:12px;color:var(--dim)"></div>
    </div>
  </div>
</div>

<script>
const C = { on:'#E3E7EC', label:'#C9D1D9', off:'#7A8591', amber:'#F2A541', blue:'#5AA9FF', orange:'#FF7A45', muted:'#9AA4AF', neutral:'#4A5561' };

// Series -> ladder metadata. `over` series show the raw threshold ("o22.5")
// instead of the "+1" count convention ("150+").
const SERIES_META = {
  KXNFLPASSYDS:  { short:'Pass Yds',  name:'Passing Yards',        dec:0, col:'left',  histKey:'passing_yards' },
  KXNFLPASSTDS:  { short:'Pass TD',   name:'Passing TDs',          dec:1, col:'left',  histKey:'passing_tds' },
  KXNFLPASSCOMP: { short:'Comp',      name:'Completions',          dec:1, col:'left' },
  KXNFLPASSATT:  { short:'Att',       name:'Pass Attempts',        dec:1, col:'left' },
  KXNFLPASSINT:  { short:'INT',       name:'Pass Interceptions',   dec:1, col:'left' },
  KXNFLREC:      { short:'Rec',       name:'Receptions',           dec:1, col:'left',  histKey:'receptions' },
  KXNFLRECYDS:   { short:'Rec Yds',   name:'Receiving Yards',      dec:0, col:'left',  histKey:'receiving_yards' },
  KXNFLRSHYDS:   { short:'Rush Yds',  name:'Rushing Yards',        dec:0, col:'right', histKey:'rushing_yards' },
  KXNFLRSHATT:   { short:'Rush Att',  name:'Rush Attempts',        dec:1, col:'right' },
  KXNFLTD:       { short:'ATD',       name:'Anytime TD',           dec:1, col:'right' },
  KXNFLLONGREC:  { short:'Long Rec',  name:'Longest Reception',    dec:1, col:'right', over:true },
  KXNFLLONGRSH:  { short:'Long Rush', name:'Longest Rush',         dec:1, col:'right', over:true },
};

// Team primary brand colors, keyed by Kalshi team code.
const TEAM_COLORS = {
  ARI:'#97233F', ATL:'#A71930', BAL:'#241773', BUF:'#00338D', CAR:'#0085CA',
  CHI:'#0B162A', CIN:'#FB4F14', CLE:'#311D00', DAL:'#041E42', DEN:'#FB4F14',
  DET:'#0076B6', GB:'#203731',  HOU:'#03202F', IND:'#002C5F', JAC:'#101820',
  KC:'#E31837',  LAC:'#0080C6', LAR:'#003594', LV:'#000000',  MIA:'#008E97',
  MIN:'#4F2683', NE:'#002244',  NO:'#D3BC8D',  NYG:'#0B2265', NYJ:'#125740',
  PHI:'#004C54', PIT:'#FFB612', SEA:'#002244', SF:'#AA0000',  TB:'#D50A0A',
  TEN:'#4B92DB', WAS:'#5A1414',
};
function teamColor(code) { return TEAM_COLORS[code] || 'var(--border)'; }

// ---------- state ----------
let nextId = 1;
const state = {
  tickets: [], activeId: null, kalshiOk: true, module: 'research',
  games: [], activeGameId: null,
  slate: { loading: false, error: null, games: null, view: 'list' },
  book: { loading: false, error: null, data: null },
};

function openPlayerFromDrilldown(name) {
  const existing = state.tickets.find(t => t.data && t.data.player.name.toLowerCase() === name.toLowerCase());
  if (existing) { state.activeId = existing.id; state.module = 'research'; render(); return; }
  state.module = 'research';
  newTicket(name);
}

function activeTicket() { return state.tickets.find(t => t.id === state.activeId) || null; }

function newTicket(query) {
  const t = { id: nextId++, query, name: query, sub: '', loading: true, error: null, data: null,
    ui: { mkt: 'player', curve: null, risk: 'pos', match: 'def', inj: null } };
  state.tickets.push(t);
  state.activeId = t.id;
  loadTicket(t);
  render();
}

async function loadTicket(t) {
  try {
    const resp = await fetch('/api/player?name=' + encodeURIComponent(t.query));
    const data = await resp.json();
    state.kalshiOk = resp.ok;
    if (!resp.ok) { t.error = data.error || 'request failed'; t.loading = false; render(); return; }
    // de-dupe: if a ticket for this resolved player already exists, drop this one and switch
    const dup = state.tickets.find(x => x !== t && x.data && x.data.player.name === data.player.name);
    if (dup) {
      state.tickets = state.tickets.filter(x => x !== t);
      state.activeId = dup.id;
      render();
      return;
    }
    t.data = data;
    t.name = data.player.name.split(' ').pop().toUpperCase();
    t.sub = data.player.team_kalshi + ' ' + data.player.position;
    t.ui.curve = firstSeriesId(data);
    t.ui.inj = data.game_environment ? data.game_environment.home_team : null;
    t.loading = false;
  } catch (e) {
    state.kalshiOk = false;
    t.error = String(e);
    t.loading = false;
  }
  render();
}

function closeTicket(id) {
  const i = state.tickets.findIndex(t => t.id === id);
  if (i === -1) return;
  state.tickets.splice(i, 1);
  if (state.activeId === id) {
    state.activeId = state.tickets.length ? state.tickets[Math.max(0, i - 1)].id : null;
  }
  render();
}

function firstSeriesId(data) {
  const ids = Object.keys(SERIES_META).filter(s => data.markets.player_props.some(m => m.series === s));
  return ids[0] || null;
}

// ---------- formatting ----------
const fmt1 = (x) => x === null || x === undefined ? '--' : Number(x).toFixed(1);
const fmtPctVal = (x) => x === null || x === undefined ? '--' : (x * 100).toFixed(1) + '%';
const money = (dollars) => (dollars < 0 ? '-$' : '$') + Math.abs(dollars).toFixed(2);
const signedMoney = (dollars) => (dollars >= 0 ? '+$' : '-$') + Math.abs(dollars).toFixed(2);

function lineLabel(meta, threshold) {
  if (meta.over) return 'o' + (threshold % 1 === 0 ? threshold.toFixed(1) : threshold);
  return Math.round(threshold + 0.5) + '+';
}

// Reference line: the market whose implied YES probability sits closest to a
// coinflip. Mirrors _closest_to_coinflip in player_research.py.
function refIndex(rows) {
  let best = 0;
  rows.forEach((r, i) => { if (Math.abs(r.imp - 50) < Math.abs(rows[best].imp - 50)) best = i; });
  return best;
}

// Linear interpolation of the threshold where implied probability crosses 50%.
function median(rows) {
  if (rows.length === 1) return rows[0].threshold;
  if (rows[0].imp < 50) return null;
  for (let i = 0; i < rows.length - 1; i++) {
    const a = rows[i], b = rows[i + 1];
    if (a.imp >= 50 && b.imp < 50) return a.threshold + (b.threshold - a.threshold) * (a.imp - 50) / (a.imp - b.imp);
  }
  return rows[rows.length - 1].threshold;
}
function fmtMedian(meta, rows) {
  const m = median(rows);
  if (m === null) return { label: 'P(' + lineLabel(meta, rows[0].threshold) + ')', value: rows[0].imp.toFixed(1) };
  // rows[].threshold is the raw floor_strike (e.g. 149.5 for "150+"); convert
  // back to display-value space before formatting, except for `over` series
  // (longest rec/rush) whose threshold already IS the displayed value.
  const disp = meta.over ? m : m + 0.5;
  return { label: 'MED', value: meta.dec === 0 ? String(Math.round(disp)) : disp.toFixed(1) };
}

function groupRows(markets, series) {
  return markets.filter(m => m.series === series).sort((a, b) => a.threshold - b.threshold)
    .map(m => ({ ...m, imp: (m.implied_prob_yes ?? 0) * 100 }));
}

function seriesPresent(data) {
  return Object.keys(SERIES_META).filter(s => data.markets.player_props.some(m => m.series === s));
}

// ---------- clock ----------
function tickClock() {
  const el = document.getElementById('clock');
  if (!el) return;
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
  const get = (t) => parts.find(p => p.type === t).value;
  el.textContent = `${get('weekday').toUpperCase()} ${get('day')} ${get('month').toUpperCase()} ${get('hour')}:${get('minute')} ET`;
}
setInterval(tickClock, 1000);

// ---------- render: top bar ----------
function playerTicketHtml(t) {
  const on = t.id === state.activeId;
  const color = t.data ? teamColor(t.data.player.team_kalshi) : 'var(--border)';
  return `<div class="ticket" data-open="${t.id}" style="cursor:pointer;background:${on ? '#141920' : 'transparent'};border-top-color:${on ? 'var(--amber)' : 'transparent'};color:${on ? 'var(--on)' : 'var(--dim)'}">
    <span class="tteam" style="background:${color}"></span>
    <span class="tname">${escapeHtml(t.name)}</span>
    <span class="tsub mono">${escapeHtml(t.sub || (t.loading ? 'loading…' : t.error ? 'error' : ''))}</span>
    <button type="button" class="tclose" data-close="${t.id}" aria-label="Close ticket">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l6 6M7 1L1 7"></path></svg>
    </button>
  </div>`;
}

function gameTabHtml(g) {
  const on = g.id === state.activeGameId;
  const bar = g.away && g.home
    ? `linear-gradient(to bottom, ${teamColor(g.away)} 50%, ${teamColor(g.home)} 50%)`
    : 'var(--border)';
  return `<div class="ticket" data-open-gametab="${g.id}" style="cursor:pointer;background:${on ? '#141920' : 'transparent'};border-top-color:${on ? 'var(--amber)' : 'transparent'};color:${on ? 'var(--on)' : 'var(--dim)'}">
    <span class="tteam" style="background:${bar}"></span>
    <span class="tname">${escapeHtml(g.label)}</span>
    ${g.loading || g.error ? `<span class="tsub mono">${g.loading ? 'loading…' : 'error'}</span>` : ''}
    <button type="button" class="tclose" data-close-gametab="${g.id}" aria-label="Close game tab">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 1l6 6M7 1L1 7"></path></svg>
    </button>
  </div>`;
}

function renderTopbar() {
  const wrap = document.getElementById('tickets');
  const playerHtml = state.tickets.map(playerTicketHtml).join('');
  const gameHtml = state.games.map(gameTabHtml).join('');
  const divider = playerHtml && gameHtml ? `<div id="tabgroup-div"></div>` : '';
  wrap.innerHTML = playerHtml + divider + gameHtml;
  const dot = document.querySelector('#kalshiStatus .dot');
  if (dot) dot.style.background = state.kalshiOk ? 'var(--blue)' : 'var(--orange)';
  const label = document.querySelector('#kalshiStatus');
  if (label) label.lastChild.textContent = state.kalshiOk ? 'KALSHI LIVE' : 'KALSHI ERROR';
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- render: context strip ----------
function teamSpread(env) {
  // nflverse spread_line here is signed from the HOME team's perspective as
  // "points the home team is getting" (positive = home favored). Convert to
  // the searched team's own line in conventional sportsbook sign (favorite
  // negative).
  if (env.spread_line === null || env.spread_line === undefined) return null;
  return env.is_home_for_searched_team ? -env.spread_line : env.spread_line;
}

function favorColor(rank, outOf, dir) {
  // dir: 'opp' (opponent defense stat) or 'own' (searched player's own team stat)
  if (!rank || !outOf) return C.neutral;
  const fav = dir === 'opp' ? rank >= outOf * 0.65 : rank <= outOf * 0.35;
  const unf = dir === 'opp' ? rank <= outOf * 0.35 : rank >= outOf * 0.65;
  return fav ? C.blue : unf ? C.orange : C.neutral;
}

function renderContext() {
  const el = document.getElementById('ctx');
  const t = activeTicket();
  if (!t || !t.data) {
    el.innerHTML = '';
    return;
  }
  const d = t.data, p = d.player, env = d.game_environment;
  const kpis = [];
  if (env) {
    const spr = teamSpread(env);
    kpis.push({ l: 'SPREAD', v: spr === null ? '--' : `${p.team_kalshi} ${spr >= 0 ? '+' : ''}${spr.toFixed(1)}` });
    kpis.push({ l: 'TOTAL', v: fmt1(env.total_line) });
    const ttm = teamTotalRef(d);
    kpis.push({ l: ttm ? `${p.team_kalshi} TT O${ttm.line}` : 'TEAM TOTAL', v: ttm ? ttm.imp.toFixed(1) + '%' : '--' });
    const f = env.forecast;
    kpis.push({ l: 'FORECAST', v: f && f.forecast_available ? `${Math.round(f.temperature_f)}°F · W${Math.round(f.wind_speed_mph)} G${Math.round(f.wind_gusts_mph)} · ${Math.round(f.precipitation_probability_pct)}%` : (f && f.note ? f.note.toUpperCase() : '--') });
    kpis.push({ l: 'REST', v: `${env.rest_days} / ${env.opponent_rest_days}` });
    kpis.push({ l: 'SURFACE', v: `${(env.roof || '--').toUpperCase()} · ${(env.surface || '--').toUpperCase()}` });
  }
  if (d.opponent_defense) {
    const r = d.opponent_defense.epa_per_dropback_allowed_rank;
    kpis.push({ l: 'OPP D EPA/DB', v: r ? '#' + r.rank : '--', fg: r ? favorColor(r.rank, r.out_of, 'opp') : C.on });
  }
  const flagCount = (d.correlations.flags || []).reduce((a, f) => a + f.correlated_with.length, 0);
  kpis.push({ l: 'CORR FLAGS', v: String(flagCount), fg: C.amber });

  const gameLabel = env ? `${p.team_kalshi} · ${env.is_home_for_searched_team ? 'HOME vs' : 'AWAY @'} ${env.is_home_for_searched_team ? env.away_team && nflverseToKalshi(env.away_team) : nflverseToKalshi(d.opponent)}` : p.team_kalshi;
  const dateLabel = env && env.gameday ? formatGameDate(env.gameday) : '';

  el.innerHTML = `
    <div class="who">
      ${p.headshot_url ? `<img class="headshot" src="${escapeHtml(p.headshot_url)}" alt="" onerror="this.style.visibility='hidden'">` : ''}
      <div class="whotext">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span class="name">${escapeHtml(p.name.toUpperCase())}</span>
          <span class="pos mono">${p.position} #${p.jersey_number ?? '?'}</span>
        </div>
        <div class="sub mono">${escapeHtml(gameLabel)}${dateLabel ? ' · ' + dateLabel : ''}</div>
      </div>
    </div>
    ${kpis.map(k => `<div class="kpi"><span class="kl">${k.l}</span><span class="kv mono" style="color:${k.fg || 'var(--on)'}">${escapeHtml(k.v)}</span></div>`).join('')}
  `;
}

function nflverseToKalshi(code) { return ({ JAX: 'JAC', LA: 'LAR' })[code] || code; }
function formatGameDate(iso) {
  const dt = new Date(iso + 'T12:00:00Z');
  return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', day: '2-digit', month: 'short' }).format(dt).toUpperCase();
}

function teamTotalRef(data) {
  const rows = groupRows(data.markets.team_game_markets, 'KXNFLTEAMTOTAL')
    .filter(m => m.team_code === data.player.team_kalshi);
  if (!rows.length) return null;
  const r = rows[refIndex(rows)];
  return { line: fmt1(r.threshold), imp: r.imp };
}

// ---------- render: markets panel ----------
function buildLadderRows(rows, meta) {
  return rows.map(r => {
    const bid = Math.round((r.yes_bid ?? 0) * 100), ask = Math.round((r.yes_ask ?? 0) * 100), sp = ask - bid;
    return {
      line: lineLabel(meta, r.threshold),
      bid, ask, sp,
      imp: r.imp,
      vol: Math.round(r.volume || 0),
      pos: r.my_position ? (r.my_position.side === 'yes' ? 'Y' : 'N') + r.my_position.contracts : '',
      held: !!r.my_position,
    };
  });
}

function buildGroup(data, series, historyMap) {
  const meta = SERIES_META[series];
  const rows = groupRows(data.markets.player_props, series);
  if (!rows.length) return null;
  const ri = refIndex(rows);
  const built = buildLadderRows(rows, meta);
  const m = fmtMedian(meta, rows);
  const last = meta.histKey && historyMap ? historyMap[meta.histKey] : null;
  return { series, meta, rows: built, refIdx: ri, med: m, last };
}

function latestHistoryMap(data) {
  const hist = data.history_vs_opponent || [];
  return hist.length ? hist[hist.length - 1] : null;
}

function renderMarkets() {
  const head = document.getElementById('marketsTabs');
  const body = document.getElementById('marketsBody');
  const t = activeTicket();
  if (!t || !t.data) { body.innerHTML = ''; head.innerHTML = ''; return; }
  const d = t.data;
  const tabs = [
    { id: 'player', label: t.name, count: d.markets.player_props.length },
    { id: 'tm', label: 'Teammates', count: d.markets.teammate_props.length },
    { id: 'gm', label: 'Team / Game', count: d.markets.team_game_markets.length },
    { id: 'ss', label: 'Season', count: d.markets.season_props.length },
  ];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab ${t.ui.mkt === tb.id ? 'on' : ''}" data-mkt="${tb.id}">${escapeHtml(tb.label)}<span class="cnt mono">${tb.count}</span></button>`).join('');

  if (t.ui.mkt === 'player') {
    renderLadder(body, t, d);
  } else if (t.ui.mkt === 'tm' || t.ui.mkt === 'gm' || t.ui.mkt === 'ss') {
    renderFlatMarkets(body, t, d, t.ui.mkt);
  }
}

function correlatedTickerSet(data) {
  const set = new Set();
  (data.correlations.flags || []).forEach(f => { set.add(f.ticker); f.correlated_with.forEach(c => set.add(c.ticker)); });
  return set;
}

function renderLadder(body, t, d) {
  const hist = latestHistoryMap(d);
  const seriesIds = seriesPresent(d);
  const leftIds = seriesIds.filter(s => SERIES_META[s].col === 'left');
  const rightIds = seriesIds.filter(s => SERIES_META[s].col === 'right');
  const oppKalshi = nflverseToKalshi(d.opponent);

  function col(ids, showStats) {
    const groups = ids.map(s => buildGroup(d, s, hist)).filter(Boolean);
    let html = `<div style="display:flex;flex-direction:column;min-width:0">
      <div class="ladder-head mono"><span>LINE</span><span class="right">BID</span><span class="right">ASK</span><span class="right">SPR</span><span style="padding-left:10px">IMPLIED %</span><span class="right">VOL</span><span class="right">POS</span></div>`;
    groups.forEach(g => {
      html += `<div class="ladder-group">
        <span style="font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--label)">${g.meta.name.toUpperCase()}</span>
        <div style="flex-grow:1"></div>
        <span class="mono" style="font-size:9.5px;color:var(--dim)">${g.med.label} <span style="color:var(--on)">${g.med.value}</span></span>
        ${g.last !== null && g.last !== undefined ? `<span class="mono" style="font-size:9.5px;color:var(--dim)">LAST v ${oppKalshi} <span style="color:var(--amber)">${g.last}</span></span>` : ''}
      </div>`;
      g.rows.forEach((r, i) => {
        html += `<div class="ladder-row mono" style="background:${r.held ? 'var(--amber-soft)' : 'transparent'}">
          <span style="color:var(--on);padding-left:4px">${r.line} <span style="color:var(--muted);font-size:9px">${i === g.refIdx ? '◆' : ''}</span></span>
          <span class="right" style="color:var(--blue)">${r.bid}</span>
          <span class="right" style="color:var(--ask)">${r.ask}</span>
          <span class="right" style="color:${r.sp >= 10 ? 'var(--orange)' : 'var(--muted)'}">${r.sp}</span>
          <div style="display:flex;align-items:center;gap:6px;padding-left:10px">
            <div class="bar-track"><div class="bar-fill" style="width:${r.imp}%"></div><div class="bar-mid"></div></div>
            <span style="width:32px;text-align:right;color:var(--on)">${r.imp.toFixed(1)}</span>
          </div>
          <span class="right" style="color:${r.vol ? 'var(--muted)' : '#3A434E'}">${r.vol ? r.vol.toLocaleString('en-US') : '·'}</span>
          <span class="right" style="color:var(--amber);font-weight:600;padding-right:2px">${r.pos}</span>
        </div>`;
      });
    });
    if (showStats) {
      const totalVol = groups.reduce((a, g) => a + g.rows.reduce((b, r) => b + r.vol, 0), 0);
      const wide = groups.reduce((a, g) => a + g.rows.filter(r => r.sp >= 10).length, 0);
      const refLines = groups.length;
      const propCount = seriesIds.reduce((a, s) => a + groupRows(d.markets.player_props, s).length, 0);
      html += `<div class="stat-tiles">
        <div class="stat-tile"><span class="sl">PROPS</span><span class="sv mono">${propCount}</span></div>
        <div class="stat-tile"><span class="sl">VOLUME</span><span class="sv mono">${totalVol.toLocaleString('en-US')}</span></div>
        <div class="stat-tile"><span class="sl">WIDE SPR</span><span class="sv mono" style="color:var(--orange)">${wide}</span></div>
        <div class="stat-tile"><span class="sl">REF LINES</span><span class="sv mono">${refLines}</span></div>
      </div>`;
    }
    html += `</div>`;
    return html;
  }

  body.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:4px 8px 8px">
    ${col(leftIds, false)}
    ${col(rightIds, true)}
  </div>`;
}

function renderFlatMarkets(body, t, d, which) {
  const correlated = correlatedTickerSet(d);
  let rows, note;
  if (which === 'tm') {
    rows = d.markets.teammate_props;
    note = `Showing all ${rows.length} teammate markets for this game.`;
  } else if (which === 'gm') {
    rows = d.markets.team_game_markets;
    note = `Showing all ${rows.length} team/game markets for this game.`;
  } else {
    rows = d.markets.season_props;
    note = `Showing all ${rows.length} season-long props.`;
  }
  if (!rows.length) {
    body.innerHTML = `<div class="empty">No markets found here.</div>`;
    return;
  }
  if (which === 'ss') { renderSeasonMarkets(body, d, rows, note); return; }
  if (which === 'tm') {
    renderMarketsGroupedByName(body, rows, correlated, note);
    return;
  }
  const sorted = [...rows].sort((a, b) => Math.abs((a.implied_prob_yes ?? 0.5) - 0.5) - Math.abs((b.implied_prob_yes ?? 0.5) - 0.5));
  let html = `<div style="padding:4px 8px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:150px minmax(0,1fr) 200px 90px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span style="padding-left:4px">WHO</span><span>MARKET</span><span>IMPLIED %</span><span class="right">LINKED</span>
    </div>`;
  sorted.forEach(r => {
    const who = r.player_name || r.team_code || '—';
    const imp = (r.implied_prob_yes ?? 0) * 100;
    const linked = correlated.has(r.ticker);
    const heldStyle = r.my_position ? 'background:var(--amber-soft)' : '';
    html += `<div class="mono" style="height:20px;display:grid;grid-template-columns:150px minmax(0,1fr) 200px 90px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule);${heldStyle}">
      <span style="padding-left:4px;color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(who)}</span>
      <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title)}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="bar-track"><div class="bar-fill" style="width:${imp}%"></div></div>
        <span style="width:36px;text-align:right">${imp.toFixed(1)}</span>
      </div>
      <span class="right" style="color:${linked ? 'var(--amber)' : 'var(--dim)'}">${linked ? 'linked' : '—'}</span>
    </div>`;
  });
  html += `<div class="mono" style="padding:8px 4px;font-size:10.5px;color:var(--dim)">${note}</div></div>`;
  body.innerHTML = html;
}

function renderMarketsGroupedByName(body, rows, correlated, note) {
  const groups = new Map();
  rows.forEach(r => {
    const key = r.player_name || r.team_code || '—';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });
  const names = [...groups.keys()].sort((a, b) => a.localeCompare(b));

  let html = `<div style="padding:4px 8px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 200px 90px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span style="padding-left:4px">MARKET</span><span>IMPLIED %</span><span class="right">LINKED</span>
    </div>`;
  names.forEach(name => {
    const group = groups.get(name).sort((a, b) => Math.abs((a.implied_prob_yes ?? 0.5) - 0.5) - Math.abs((b.implied_prob_yes ?? 0.5) - 0.5));
    html += `<div class="ladder-group">
      <span style="font-size:10px;font-weight:600;letter-spacing:0.08em;color:var(--label)">${escapeHtml(name.toUpperCase())}</span>
      <div style="flex-grow:1"></div>
      <span class="mono" style="font-size:9.5px;color:var(--dim)">${group.length} MARKET${group.length === 1 ? '' : 'S'}</span>
    </div>`;
    group.forEach(r => {
      const imp = (r.implied_prob_yes ?? 0) * 100;
      const linked = correlated.has(r.ticker);
      const heldStyle = r.my_position ? 'background:var(--amber-soft)' : '';
      html += `<div class="mono" style="height:20px;display:grid;grid-template-columns:minmax(0,1fr) 200px 90px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule);${heldStyle}">
        <span style="padding-left:4px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar-track"><div class="bar-fill" style="width:${imp}%"></div></div>
          <span style="width:36px;text-align:right">${imp.toFixed(1)}</span>
        </div>
        <span class="right" style="color:${linked ? 'var(--amber)' : 'var(--dim)'}">${linked ? 'linked' : '—'}</span>
      </div>`;
    });
  });
  html += `<div class="mono" style="padding:8px 4px;font-size:10.5px;color:var(--dim)">${note}</div></div>`;
  body.innerHTML = html;
}

// Season series -> nflverse season-total key + the weekly series whose
// market median gives a next-game expectation.
const SEASON_SERIES_MAP = {
  KXNFLSEASONPASSYDS: { stat: 'passing_yards',   weekly: 'KXNFLPASSYDS', dec: 0 },
  KXNFLSEASONRECYDS:  { stat: 'receiving_yards', weekly: 'KXNFLRECYDS',  dec: 0 },
  KXNFLSEASONRSHYDS:  { stat: 'rushing_yards',   weekly: 'KXNFLRSHYDS',  dec: 0 },
  KXNFLSEASONREC:     { stat: 'receptions',      weekly: 'KXNFLREC',     dec: 1 },
  KXNFLSEASONPASSTDS: { stat: 'passing_tds',     weekly: 'KXNFLPASSTDS', dec: 2 },
  KXNFLSEASONRSHTD:   { stat: 'rushing_tds',     weekly: null,           dec: 2 },
  KXNFLSEASONRECTD:   { stat: 'receiving_tds',   weekly: null,           dec: 2 },
};

// Expected stat for the next game: weekly market median when this game's
// ladder exists, else the player's season per-game average.
function nextGameExpected(d, map, pace) {
  if (map.weekly && SERIES_META[map.weekly]) {
    const rows = groupRows(d.markets.player_props, map.weekly);
    const m = rows.length ? median(rows) : null;
    if (m !== null) return { value: SERIES_META[map.weekly].over ? m : m + 0.5, src: 'mkt' };
  }
  if (pace && pace.games_played) return { value: (pace.totals[map.stat] || 0) / pace.games_played, src: 'avg' };
  return null;
}

function renderSeasonMarkets(body, d, rows, note) {
  const pace = d.season_pace;
  const fmtN = (v, dec) => dec === 0 ? Math.round(v).toLocaleString('en-US') : v.toFixed(dec);
  const sorted = [...rows].sort((a, b) => (a.series || '').localeCompare(b.series || '') || a.threshold - b.threshold);
  const grid = 'grid-template-columns:minmax(0,1fr) 170px 120px 100px';
  let html = `<div style="padding:4px 8px 8px;display:flex;flex-direction:column">
    <div class="mono" style="min-height:18px;display:grid;${grid};align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span style="padding-left:4px">MARKET</span><span>IMPLIED %</span><span class="right">NEED / GAME</span><span class="right">NEXT G EXP</span>
    </div>`;
  sorted.forEach(r => {
    const imp = (r.implied_prob_yes ?? 0) * 100;
    const heldStyle = r.my_position ? 'background:var(--amber-soft)' : '';
    const map = SEASON_SERIES_MAP[r.series];
    let needHtml = '<span style="color:var(--dim)">—</span>', expHtml = needHtml;
    if (map && pace) {
      const target = Math.round(r.threshold + 0.5);
      const have = pace.totals[map.stat] || 0;
      const left = pace.team_games_remaining;
      if (have >= target) needHtml = `<span style="color:var(--blue)">HIT</span>`;
      else if (!left) needHtml = `<span style="color:var(--orange)">0 G LEFT</span>`;
      else needHtml = `<span style="color:var(--on)">${fmtN((target - have) / left, map.dec === 0 ? 1 : 2)}</span>`;
      const exp = nextGameExpected(d, map, pace);
      if (exp) expHtml = `<span style="color:var(--on)">${fmtN(exp.value, map.dec === 0 ? 1 : 2)}</span> <span style="color:var(--dim);font-size:9px">${exp.src}</span>`;
    }
    html += `<div class="mono" style="min-height:20px;padding:2px 0;display:grid;${grid};align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule);${heldStyle}">
      <span style="padding-left:4px;color:var(--muted);white-space:normal">${escapeHtml(r.title)}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="bar-track"><div class="bar-fill" style="width:${imp}%"></div></div>
        <span style="width:36px;text-align:right">${imp.toFixed(1)}</span>
      </div>
      <span class="right">${needHtml}</span>
      <span class="right" style="padding-right:2px">${expHtml}</span>
    </div>`;
  });
  const paceNote = pace
    ? ` Need/game = (target − ${pace.season} season-to-date) ÷ ${pace.team_games_remaining} team games left` +
      (pace.bye_week ? ` (bye wk ${pace.bye_week}${pace.bye_upcoming ? ' still ahead, excluded' : ' already past'})` : '') +
      `. ${pace.games_played} GP. Next G: mkt = weekly ladder median, avg = season per-game avg.`
    : ' Season-to-date stats unavailable.';
  html += `<div class="mono" style="padding:8px 4px;font-size:10.5px;color:var(--dim)">${note}${paceNote}</div></div>`;
  body.innerHTML = html;
}

// ---------- render: implied curve ----------
function renderCurve() {
  const head = document.getElementById('curveTabs');
  const body = document.getElementById('curveBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const d = t.data;
  const seriesIds = seriesPresent(d);
  if (!t.ui.curve || !seriesIds.includes(t.ui.curve)) t.ui.curve = seriesIds[0] || null;
  head.innerHTML = seriesIds.map(s => `<button type="button" class="tab small ${t.ui.curve === s ? 'on' : ''}" data-curve="${s}">${SERIES_META[s].short}</button>`).join('');

  if (!t.ui.curve) { body.innerHTML = `<div class="empty">No priced props for this player.</div>`; return; }
  const meta = SERIES_META[t.ui.curve];
  const rows = groupRows(d.markets.player_props, t.ui.curve);
  const hist = latestHistoryMap(d);
  const lastVal = meta.histKey && hist ? hist[meta.histKey] : null;

  const W = 712, H = 150, pl = 24, pr = 24, pt = 8, pb = 8;
  const t0 = rows[0].threshold, t1 = rows[rows.length - 1].threshold;
  const X = (v) => pl + (t1 === t0 ? 0 : (v - t0) / (t1 - t0)) * (W - pl - pr);
  const Y = (p) => pt + (1 - p / 100) * (H - pt - pb);
  const f = (n) => n.toFixed(1);

  let line = '', dots = '', bidPts = [], askPts = [];
  rows.forEach((r, i) => {
    const x = X(r.threshold), y = Y(r.imp);
    line += (i ? 'L' : 'M') + f(x) + ' ' + f(y);
    dots += `M${f(x - 2.5)} ${f(y)}a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0`;
    bidPts.push(f(x) + ' ' + f(Y((r.yes_bid ?? 0) * 100)));
    askPts.unshift(f(x) + ' ' + f(Y((r.yes_ask ?? 0) * 100)));
  });
  const ri = refIndex(rows), rr = rows[ri], rx = X(rr.threshold), ry = Y(rr.imp);
  const m = median(rows);
  const mx = m === null ? null : X(Math.max(t0, Math.min(t1, m)));
  const lastX = lastVal !== null && lastVal !== undefined ? X(Math.max(t0, Math.min(t1, lastVal))) : null;
  const medFmt = fmtMedian(meta, rows);

  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;padding:0 10px;font-size:10.5px;color:var(--dim)" class="mono">
      <span>MED <span style="color:var(--on)">${medFmt.value}</span></span>
      <span>REF <span style="color:var(--on)">${lineLabel(meta, rr.threshold)} @ ${rr.imp.toFixed(1)}%</span></span>
      ${lastVal !== null && lastVal !== undefined ? `<span>LAST v ${nflverseToKalshi(d.opponent)} <span style="color:var(--amber)">${lastVal}</span></span>` : ''}
    </div>
    <div style="flex-grow:1;display:flex;padding:8px 10px 6px 0">
      <div class="mono" style="width:34px;height:150px;position:relative;font-size:9.5px;color:var(--dim)">
        <span style="position:absolute;right:6px;top:2px">100</span>
        <span style="position:absolute;right:6px;top:38px">75</span>
        <span style="position:absolute;right:6px;top:71px">50</span>
        <span style="position:absolute;right:6px;top:105px">25</span>
        <span style="position:absolute;right:6px;top:138px">0</span>
      </div>
      <div style="display:flex;flex-direction:column">
        <div style="width:${W}px;height:${H}px;position:relative;background:var(--panel-head)">
          <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;left:0;top:0">
            <path d="M10 42.5H${W - 10}M10 109.5H${W - 10}" stroke="#1A2027" stroke-width="1"></path>
            <path d="M10 76H${W - 10}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"></path>
            <path d="M${bidPts.join('L')}L${askPts.join('L')}Z" fill="rgba(90,169,255,0.16)" stroke="none"></path>
            ${mx !== null ? `<path d="M${f(mx)} ${pt}V${H - pb}" stroke="var(--on)" stroke-width="1" stroke-dasharray="2 3"></path>` : ''}
            ${lastX !== null ? `<path d="M${f(lastX)} ${pt}V${H - pb}" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="5 3"></path>` : ''}
            <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="1.6"></path>
            <path d="${dots}" fill="var(--blue)"></path>
            <path d="M${f(rx - 4)} ${f(ry)}l4 -4l4 4l-4 4z" fill="var(--on)"></path>
          </svg>
        </div>
        <div class="mono" style="width:${W}px;height:16px;position:relative;font-size:9.5px;color:var(--dim)">
          ${rows.map(r => `<span style="position:absolute;top:3px;width:40px;text-align:center;left:${Math.round(X(r.threshold) - 20)}px">${lineLabel(meta, r.threshold)}</span>`).join('')}
        </div>
      </div>
    </div>`;
}

// ---------- render: book & risk ----------
function allMarketsFlat(d) {
  return [...d.markets.player_props, ...d.markets.teammate_props, ...d.markets.team_game_markets, ...d.markets.season_props];
}
function heldPositions(d) {
  return allMarketsFlat(d).filter(m => m.my_position);
}
function positionMath(m) {
  const mid = ((m.yes_bid ?? 0) + (m.yes_ask ?? 0)) / 2 * 100;
  const avg = m.my_position.avg_price_cents, qty = m.my_position.contracts, side = m.my_position.side;
  const mark = side === 'yes' ? mid : 100 - mid;
  const pwin = (side === 'yes' ? (m.implied_prob_yes ?? 0) : 1 - (m.implied_prob_yes ?? 0)) * 100;
  const costC = avg * qty, valC = mark * qty, winC = (100 - avg) * qty;
  return { mid, avg, qty, side, mark, pwin, costC, valC, winC, pnlC: valC - costC };
}

function renderBook() {
  const head = document.getElementById('bookTabs');
  const body = document.getElementById('bookBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const d = t.data;
  const held = heldPositions(d);
  const flagCount = (d.correlations.flags || []).reduce((a, f) => a + f.correlated_with.length, 0);
  const tabs = [
    { id: 'pos', label: 'Positions', count: held.length },
    { id: 'corr', label: 'Correlation', count: flagCount },
    { id: 'exp', label: 'Exposure', count: '' },
  ];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab ${t.ui.risk === tb.id ? 'on' : ''}" data-risk="${tb.id}">${tb.label}${tb.count !== '' ? `<span class="cnt mono">${tb.count}</span>` : ''}</button>`).join('')
    + `<div style="flex-grow:1"></div>` + (held.length === 0 ? '' : '');

  if (t.ui.risk === 'pos') renderPositions(body, held);
  else if (t.ui.risk === 'corr') renderCorrelation(body, d);
  else renderExposure(body, held);
}

// Generic: build a display row + accumulator-friendly numbers for one held
// position. `label` is caller-supplied since ticket markets (SERIES_META-based
// short labels) and Book-module markets (arbitrary series, full titles) name
// things differently.
function buildPositionRow(m, label) {
  const pm = positionMath(m);
  return {
    label, side: pm.side.toUpperCase(), sideFg: pm.side === 'yes' ? 'var(--blue)' : 'var(--orange)',
    qty: pm.qty, avg: pm.avg.toFixed(0) + '¢', mark: pm.mark.toFixed(1) + '¢',
    pnl: signedMoney(pm.pnlC / 100), pnlFg: pm.pnlC >= 0 ? 'var(--blue)' : 'var(--orange)',
    maxWin: money(pm.winC / 100), pwin: pm.pwin.toFixed(1) + '%',
    costC: pm.costC, valC: pm.valC, winC: pm.winC,
  };
}

// Width of the longest string in IBM Plex Mono (0.6em advance) at `fontPx`.
// Tables cap themselves at their content width so leftover space trails the
// row instead of opening a gap between the label and its numbers.
function monoTextPx(strs, fontPx) {
  return Math.ceil(Math.max(0, ...strs.map(x => String(x ?? '').length)) * fontPx * 0.6) + 12;
}

const POS_NUM_COLS_PX = 40 + 40 + 46 + 46 + 64 + 64 + 60;
function positionsTableHtml(rows, labelPx) {
  labelPx = labelPx || monoTextPx(rows.map(p => p.label), 11);
  return `<div style="max-width:${labelPx + POS_NUM_COLS_PX}px"><div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 46px 46px 64px 64px 60px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>CONTRACT</span><span>SIDE</span><span class="right">QTY</span><span class="right">AVG</span><span class="right">MARK</span><span class="right">P&amp;L</span><span class="right">MAX WIN</span><span class="right">P(WIN)</span>
    </div>
    ${rows.map(p => `<div class="mono" style="height:22px;display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 46px 46px 64px 64px 60px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule)">
      <span style="color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.label)}</span>
      <span style="color:${p.sideFg};font-weight:600">${p.side}</span>
      <span class="right">${p.qty}</span><span class="right" style="color:var(--muted)">${p.avg}</span>
      <span class="right">${p.mark}</span><span class="right" style="color:${p.pnlFg}">${p.pnl}</span>
      <span class="right" style="color:var(--muted)">${p.maxWin}</span><span class="right">${p.pwin}</span>
    </div>`).join('')}</div>`;
}

function positionsTilesHtml(rows) {
  let cost = 0, val = 0, maxWin = 0, qty = 0;
  rows.forEach(p => { cost += p.costC; val += p.valC; maxWin += p.winC; qty += p.qty; });
  const upnl = val - cost;
  const tiles = [
    { l: 'CONTRACTS', v: String(qty) }, { l: 'COST', v: money(cost / 100) }, { l: 'MKT VALUE', v: money(val / 100) },
    { l: 'UNREAL P&L', v: signedMoney(upnl / 100), fg: upnl >= 0 ? 'var(--blue)' : 'var(--orange)' },
    { l: 'MAX PAYOUT', v: money((maxWin + cost) / 100) },
  ];
  return `<div class="stat-tiles" style="margin-top:0;grid-template-columns:repeat(${tiles.length},minmax(0,1fr))">${tiles.map(x => `<div class="stat-tile"><span class="sl">${x.l}</span><span class="sv mono" style="color:${x.fg || 'var(--on)'}">${x.v}</span></div>`).join('')}</div>`;
}

function renderPositions(body, held) {
  if (!held.length) { body.innerHTML = `<div class="empty">No open Kalshi positions on this player's markets.</div>`; return; }
  const rows = held.map(m => buildPositionRow(m, m.stat + ' ' + lineLabel(SERIES_META[m.series] || {}, m.threshold)));
  body.innerHTML = `<div style="padding:8px">${positionsTilesHtml(rows)}<div style="margin-top:8px">${positionsTableHtml(rows)}</div></div>`;
}

function legLabel(c) {
  const who = c.player_name ? c.player_name.split(' ').pop().toUpperCase() : (c.team_code || 'TEAM');
  const stat = SERIES_META[c.series] ? SERIES_META[c.series].short : c.stat;
  return `${who} ${lineLabel(SERIES_META[c.series] || {}, c.threshold)}<br>${stat}`;
}

function renderCorrelation(body, d) {
  const flags = d.correlations.flags || [];
  if (!flags.length) { body.innerHTML = `<div class="empty">No correlation flags for this player's markets.</div>`; return; }
  const colTickers = [];
  const colMeta = {};
  flags.forEach(f => f.correlated_with.forEach(c => { if (!colMeta[c.ticker]) { colMeta[c.ticker] = c; colTickers.push(c.ticker); } }));

  let html = `<div style="padding:6px 8px 8px;display:flex;flex-direction:column;overflow:auto">
    <div class="mono" style="display:grid;grid-template-columns:130px repeat(${colTickers.length},minmax(64px,1fr)) 30px;align-items:end;font-size:9px;color:var(--dim);padding-bottom:4px;border-bottom:1px solid var(--head-rule)">
      <span style="letter-spacing:0.06em">REF LINE ↓ / LEG →</span>
      ${colTickers.map(tk => `<span style="text-align:center;line-height:1.2">${legLabel(colMeta[tk])}</span>`).join('')}
      <span class="right">Σ</span>
    </div>
    ${flags.map(f => {
      const rowLbl = (f.player_name ? f.player_name.split(' ').pop().toUpperCase() : '') + ' ' + f.stat;
      const hitSet = new Set(f.correlated_with.map(c => c.ticker));
      return `<div class="mono" style="height:21px;display:grid;grid-template-columns:130px repeat(${colTickers.length},minmax(64px,1fr)) 30px;align-items:center;font-size:10.5px;border-bottom:1px solid var(--row-rule)">
        <span style="color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(rowLbl)}</span>
        ${colTickers.map(tk => {
          const hit = hitSet.has(tk);
          const isTotal = hit && colMeta[tk].reason === 'same-team total over';
          return `<span style="display:flex;justify-content:center"><span style="width:20px;height:13px;background:${hit ? (isTotal ? 'var(--amber)' : 'var(--blue)') : '#1A2027'};color:#07090B;font-size:9px;display:flex;align-items:center;justify-content:center">${hit ? '+' : ''}</span></span>`;
        }).join('')}
        <span class="right" style="color:var(--amber)">${f.correlated_with.length}</span>
      </div>`;
    }).join('')}
  </div>`;
  body.innerHTML = html;
}

function renderExposure(body, held) {
  if (!held.length) { body.innerHTML = `<div class="empty">No open positions to size exposure against.</div>`; return; }
  const rows = held.map(m => {
    const pm = positionMath(m);
    return { label: `${m.stat} ${lineLabel(SERIES_META[m.series] || {}, m.threshold)} ${pm.side.toUpperCase()}`, riskC: pm.costC, winC: pm.winC };
  });
  const maxE = Math.max(...rows.map(r => Math.max(r.riskC, r.winC)), 1);
  body.innerHTML = `<div style="padding:8px;display:flex;flex-direction:column;gap:6px">
    <div class="mono" style="font-size:9.5px;letter-spacing:0.06em;color:var(--dim);display:grid;grid-template-columns:150px minmax(0,1fr) 70px 70px;gap:8px;border-bottom:1px solid var(--head-rule);padding-bottom:4px">
      <span>POSITION</span><span>AT RISK ◀ │ ▶ TO WIN</span><span class="right">RISK</span><span class="right">WIN</span>
    </div>
    ${rows.map(r => `<div class="mono" style="display:grid;grid-template-columns:150px minmax(0,1fr) 70px 70px;gap:8px;align-items:center;font-size:11px;height:22px">
      <span style="color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.label)}</span>
      <div style="display:flex;height:10px">
        <div style="flex-basis:50%;display:flex;justify-content:flex-end;border-right:1px solid var(--faint)"><div style="width:${Math.round(r.riskC/maxE*100)}%;background:var(--orange)"></div></div>
        <div style="flex-basis:50%;display:flex"><div style="width:${Math.round(r.winC/maxE*100)}%;background:var(--blue)"></div></div>
      </div>
      <span class="right" style="color:var(--ask)">${money(r.riskC/100)}</span>
      <span class="right" style="color:var(--blue)">${money(r.winC/100)}</span>
    </div>`).join('')}
  </div>`;
}

// ---------- render: matchup ----------
function rankRow(label, val, rankObj, dir) {
  if (!rankObj) return { label, val, rank: '—', w: 0, fill: C.neutral, rankFg: C.off };
  const rank = rankObj.rank, outOf = rankObj.out_of;
  const fill = favorColor(rank, outOf, dir);
  return { label, val, rank: '#' + rank, w: Math.round((outOf + 1 - rank) / outOf * 100), fill, rankFg: fill };
}

function renderMatchup() {
  const head = document.getElementById('matchTabs');
  const body = document.getElementById('matchBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const d = t.data;
  const oppKalshi = nflverseToKalshi(d.opponent);
  const ownKalshi = d.player.team_kalshi;
  const tabs = [{ id: 'def', label: `${oppKalshi} Def` }, { id: 'off', label: `${ownKalshi} Off` }, { id: 'env', label: 'Game' }];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab small ${t.ui.match === tb.id ? 'on' : ''}" data-match="${tb.id}">${tb.label}</button>`).join('');

  let rows = [], note = '';
  if (t.ui.match === 'def') {
    const o = d.opponent_defense;
    if (o) {
      rows = [
        rankRow('EPA / dropback allowed', fmt1(o.epa_per_dropback_allowed), o.epa_per_dropback_allowed_rank, 'opp'),
        rankRow('EPA / rush allowed', fmt1(o.epa_per_rush_allowed), o.epa_per_rush_allowed_rank, 'opp'),
        rankRow('Pressure rate generated', fmtPctVal(o.pressure_pct_generated), o.pressure_pct_generated_rank, 'opp'),
        rankRow('Blitz rate', fmtPctVal(o.blitz_rate), null),
        rankRow('Avg pass rushers', fmt1(o.avg_pass_rushers), null),
        rankRow('Defensive coordinator', o.dc_name || 'not set', null),
      ];
      note = o.coverage_scheme_note + ' Bar length = rank (#1 longest).';
    }
  } else if (t.ui.match === 'off') {
    const tc = d.team_context;
    if (tc) {
      rows = [
        rankRow('O-line pressure allowed', fmtPctVal(tc.pressure_pct_allowed), tc.pressure_pct_allowed_rank, 'own'),
        rankRow('Sacks allowed', fmt1(tc.sacks_allowed), tc.sacks_allowed_rank, 'own'),
        rankRow('Plays / game (pace)', fmt1(tc.plays_per_game), null),
      ];
      if (tc.target_share_stdev) {
        rows.push(rankRow('Target share stdev', fmtPctVal(tc.target_share_stdev.target_share), null));
      }
      note = `${ownKalshi} offense context.`;
    }
  } else {
    const env = d.game_environment;
    if (env) {
      const f = env.forecast;
      rows = [
        rankRow('Matchup', `${env.away_team ? nflverseToKalshi(env.away_team) : ''} @ ${env.home_team ? nflverseToKalshi(env.home_team) : ''}`, null),
        rankRow('Spread / total', `${fmt1(teamSpread(env))} / ${fmt1(env.total_line)}`, null),
        rankRow('Rest days (opp)', `${env.rest_days} (${env.opponent_rest_days})`, null),
        rankRow('Roof / surface', `${env.roof || '--'} / ${env.surface || '--'}`, null),
        rankRow('Temp · wind · gust', f && f.forecast_available ? `${Math.round(f.temperature_f)}° · ${Math.round(f.wind_speed_mph)} · ${Math.round(f.wind_gusts_mph)}` : (f ? (f.note || 'n/a') : '--'), null),
        rankRow('Precip', f && f.forecast_available ? Math.round(f.precipitation_probability_pct) + '%' : '--', null),
      ];
      note = 'Forecast via Open-Meteo at the home stadium for kickoff hour.';
    }
  }

  body.innerHTML = `<div style="padding:4px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 70px 50px 34px;gap:6px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>METRIC</span><span class="right">VALUE</span><span>RANK</span><span class="right">/32</span>
    </div>
    ${rows.map(m => `<div style="height:24px;display:grid;grid-template-columns:minmax(0,1fr) 70px 50px 34px;gap:6px;align-items:center;border-bottom:1px solid var(--row-rule)">
      <span style="font-size:12px;color:var(--label);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(m.label)}</span>
      <span class="mono right" style="font-size:11px;color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(m.val)}">${escapeHtml(m.val)}</span>
      <div class="rankbar"><div class="rankbar-fill" style="width:${m.w}%;background:${m.fill}"></div></div>
      <span class="mono right" style="font-size:11px;color:${m.rankFg}">${m.rank}</span>
    </div>`).join('')}
    <div style="margin-top:8px;font-size:11px;line-height:1.4;color:var(--muted)">${escapeHtml(note)}</div>
    <div class="mono" style="margin-top:8px;display:flex;gap:12px;font-size:9.5px;color:var(--dim)">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:6px;background:var(--blue);display:inline-block"></span>FAVORS ${t.name}</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:6px;background:var(--orange);display:inline-block"></span>AGAINST</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:6px;background:var(--neutral);display:inline-block"></span>NEUTRAL</span>
    </div>
  </div>`;
}

// ---------- render: injuries ----------
const INJ_STYLE = {
  DNP: ['var(--orange)', 'rgba(255,122,69,0.14)'], LP: ['var(--amber)', 'rgba(242,165,65,0.12)'],
  FP: ['#8FC1FF', 'rgba(90,169,255,0.12)'],
};
function practiceStatus(row) {
  const s = (row.practice_status || '').toLowerCase();
  if (s.includes('did not')) return 'DNP';
  if (s.includes('limited')) return 'LP';
  if (s.includes('full')) return 'FP';
  return row.report_status || '--';
}

function renderInjuries() {
  if (typeof hideInjPop === 'function') hideInjPop();
  const head = document.getElementById('injTabs');
  const body = document.getElementById('injBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const env = t.data.game_environment;
  if (!env) { head.innerHTML = ''; body.innerHTML = `<div class="empty">No upcoming game.</div>`; return; }
  const homeK = nflverseToKalshi(env.home_team), awayK = nflverseToKalshi(env.away_team);
  const groups = { [env.home_team]: env.injuries_home, [env.away_team]: env.injuries_away };
  if (!t.ui.inj || !groups[t.ui.inj]) t.ui.inj = env.home_team;
  function count(team) {
    const c = { DNP: 0, LP: 0, FP: 0 };
    (groups[team] || []).forEach(r => { const s = practiceStatus(r); if (c[s] !== undefined) c[s]++; });
    return `${c.DNP}·${c.LP}·${c.FP}`;
  }
  const tabs = [{ id: env.home_team, label: homeK }, { id: env.away_team, label: awayK }];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab small ${t.ui.inj === tb.id ? 'on' : ''}" data-inj="${tb.id}">${tb.label}<span class="cnt mono">${count(tb.id)}</span></button>`).join('');

  const rows = groups[t.ui.inj] || [];
  body.innerHTML = `<div style="padding:4px 8px;display:flex;flex-direction:column">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 34px 46px;gap:6px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>PLAYER</span><span>POS</span><span class="right">PRACT</span>
    </div>
    ${rows.length ? rows.map((r, i) => {
      const st = practiceStatus(r); const style = INJ_STYLE[st] || [C.muted, 'transparent'];
      return `<div class="inj-row" data-injp="${i}" style="height:22px;display:grid;grid-template-columns:minmax(0,1fr) 34px 46px;gap:6px;align-items:center;border-bottom:1px solid var(--row-rule)">
        <span style="font-size:12px;color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.full_name)}</span>
        <span class="mono" style="font-size:10.5px;color:var(--muted)">${r.position}</span>
        <span style="display:flex;justify-content:flex-end"><span class="mono pill" style="color:${style[0]};background:${style[1]}">${st}</span></span>
      </div>`;
    }).join('') : `<div class="empty">None reported.</div>`}
    <div class="mono" style="margin-top:8px;font-size:9.5px;color:var(--dim)">DNP did not practice · LP limited · FP full · hover for news</div>
  </div>`;
  body.querySelectorAll('[data-injp]').forEach(el => { el._inj = rows[Number(el.dataset.injp)]; });
}

// ---------- injury news popover ----------
// Hovering an injury row shows the report detail plus recent headlines with
// sources. The popover stays open while the pointer moves into it so links
// are clickable.
const injNews = {};  // name -> Promise<items>
const injPop = document.getElementById('injPop');
let injHoverRow = null, injHideTimer = null;

function fetchInjNews(name) {
  if (!injNews[name]) {
    injNews[name] = fetch('/api/injury_news?name=' + encodeURIComponent(name))
      .then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); return d.items || []; })
      .catch(err => { delete injNews[name]; throw err; });
  }
  return injNews[name];
}

function timeAgo(iso) {
  if (!iso) return '';
  const h = (Date.now() - new Date(iso).getTime()) / 3.6e6;
  if (h < 1) return `${Math.max(1, Math.round(h * 60))}m ago`;
  if (h < 48) return `${Math.round(h)}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

function placeInjPop(row) {
  const r = row.getBoundingClientRect();
  const w = 340, pad = 8;
  let left = r.left - w - 6;
  if (left < pad) left = Math.min(r.right + 6, window.innerWidth - w - pad);
  const top = Math.max(pad, Math.min(r.top - 4, window.innerHeight - injPop.offsetHeight - pad));
  injPop.style.left = left + 'px'; injPop.style.top = top + 'px';
}

function showInjPop(row) {
  const r = row._inj; if (!r) return;
  if (injHoverRow) injHoverRow.classList.remove('hov');
  injHoverRow = row; row.classList.add('hov');
  const injury = [r.report_primary_injury || r.practice_primary_injury, r.report_secondary_injury].filter(Boolean).join(', ');
  const meta = [r.position, injury || 'injury n/a', r.report_status ? `Game status: ${r.report_status}` : null, r.practice_status].filter(Boolean);
  const head = `<div class="ip-head"><div class="ip-name">${escapeHtml(r.full_name)}</div><div class="ip-meta mono">${meta.map(escapeHtml).join(' · ')}</div></div>
    <div class="ip-sec mono">RECENT NEWS · 14D</div>`;
  injPop.innerHTML = head + `<div class="empty">Loading…</div>`;
  injPop.hidden = false; placeInjPop(row);
  fetchInjNews(r.full_name).then(items => {
    if (injHoverRow !== row) return;
    injPop.innerHTML = head + (items.length ? items.map(it => `<a class="ip-item" href="${escapeHtml(it.url)}" target="_blank" rel="noopener noreferrer">
        <div>${escapeHtml(it.title)}</div>
        <div class="ip-src mono"><b>${escapeHtml(it.source || 'unknown')}</b> · ${timeAgo(it.published)}</div>
      </a>`).join('') : `<div class="empty">No recent injury news found.</div>`)
      + `<div class="mono" style="padding:6px 10px;font-size:9.5px;color:var(--faint)">via Google News</div>`;
    placeInjPop(row);
  }).catch(() => {
    if (injHoverRow === row) injPop.innerHTML = head + `<div class="empty">News lookup failed.</div>`;
  });
}

function hideInjPop() {
  injPop.hidden = true;
  if (injHoverRow) injHoverRow.classList.remove('hov');
  injHoverRow = null;
}

document.addEventListener('mouseover', (e) => {
  const row = e.target.closest('[data-injp]');
  if (row || e.target.closest('#injPop')) clearTimeout(injHideTimer);
  if (row && row !== injHoverRow) showInjPop(row);
});
window.addEventListener('scroll', (e) => { if (!injPop.contains(e.target)) hideInjPop(); }, true);
document.addEventListener('mouseout', (e) => {
  const from = e.target.closest('[data-injp], #injPop');
  if (!from) return;
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-injp], #injPop');
  if (to) return;
  clearTimeout(injHideTimer);
  injHideTimer = setTimeout(hideInjPop, 200);
});

// ---------- render: history ----------
function renderHistory() {
  const el = document.getElementById('historyBody');
  const label = document.getElementById('historyLabel');
  const t = activeTicket();
  if (!t || !t.data) { el.innerHTML = ''; label.textContent = ''; return; }
  const hist = t.data.history_vs_opponent || [];
  const oppK = nflverseToKalshi(t.data.opponent);
  label.textContent = `vs ${oppK} · ${hist.length} GAME${hist.length === 1 ? '' : 'S'}`;
  if (!hist.length) { el.innerHTML = `<div class="empty">No prior meetings on record.</div>`; return; }

  const cols = [
    { k: 'passing_yards', h: 'PASS YD' }, { k: 'passing_tds', h: 'PASS TD' }, { k: 'rushing_yards', h: 'RUSH YD' },
    { k: 'receptions', h: 'REC' }, { k: 'receiving_yards', h: 'REC YD' },
  ];
  let html = `<div style="padding:4px 8px">
    <div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) repeat(${cols.length},72px);align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span></span>${cols.map(c => `<span class="right">${c.h}</span>`).join('')}
    </div>`;
  hist.forEach(g => {
    html += `<div class="mono" style="height:22px;display:grid;grid-template-columns:minmax(0,1fr) repeat(${cols.length},72px);align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule)">
      <span style="color:var(--muted);font-size:10.5px">${g.season} WK${g.week}</span>
      ${cols.map(c => `<span class="right" style="color:var(--amber)">${g[c.k] ?? '—'}</span>`).join('')}
    </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

// ---------- top-level render ----------
function showOverlay(html) {
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  ov.innerHTML = html;
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

// Three modules share the rail: Research (ticket-based player pages, the
// original build), Slate (week overview + game drill-down), Book (positions
// overview). Only one is visible at a time; each owns its own DOM subtree so
// switching between them never tears down another module's state.
function render() {
  renderTopbar();
  document.querySelectorAll('.railbtn[data-module]').forEach(b => b.classList.toggle('active', b.dataset.module === state.module));
  document.getElementById('ctx').style.display = state.module === 'research' ? '' : 'none';
  document.getElementById('grid').style.display = state.module === 'research' ? '' : 'none';
  document.getElementById('slateView').style.display = state.module === 'slate' ? 'flex' : 'none';
  document.getElementById('bookView').style.display = state.module === 'book' ? 'flex' : 'none';

  if (state.module === 'research') renderResearch();
  else {
    hideOverlay();
    if (state.module === 'slate') renderSlate();
    else if (state.module === 'book') renderBookModule();
  }
}

// The panel skeleton (#marketsTabs, #marketsBody, etc.) is built exactly
// once and never destroyed -- loading/error/empty states are shown as an
// overlay on top of it instead, so switching tickets never leaves the
// skeleton's child elements missing underneath a stale placeholder.
function renderResearch() {
  renderContext();
  const t = activeTicket();
  if (!t) {
    showOverlay(`<div class="empty">Search a player to open a ticket.</div>`);
    return;
  }
  if (t.loading) {
    showOverlay(`<div class="empty">Loading ${escapeHtml(t.query)}…</div>`);
    return;
  }
  if (t.error) {
    showOverlay(`<div class="empty" style="color:var(--orange)">${escapeHtml(t.error)}</div>`);
    return;
  }
  hideOverlay();
  renderMarkets();
  renderCurve();
  renderBook();
  renderMatchup();
  renderInjuries();
  renderHistory();
}

// ========================================================================
// SLATE module: week overview (moneyline/spread/total per game) with a
// click-team-then-player drill-down into combo markets + rosters.
// ========================================================================

async function loadSlate(force) {
  if (state.slate.games && !force) { render(); return; }
  state.slate.loading = true; state.slate.error = null;
  render();
  try {
    const resp = await fetch('/api/week');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'request failed');
    state.slate.games = data.games;
  } catch (e) {
    state.slate.error = String(e.message || e);
  } finally {
    state.slate.loading = false;
    render();
  }
}

function activeGameTab() { return state.games.find(g => g.id === state.activeGameId) || null; }

function openGameDetail(eventTicker) {
  const existing = state.games.find(g => g.eventTicker === eventTicker);
  if (existing) {
    state.activeGameId = existing.id;
    state.module = 'slate';
    state.slate.view = 'detail';
    render();
    return;
  }
  const meta = (state.slate.games || []).find(x => x.event_ticker === eventTicker);
  const g = {
    id: nextId++, eventTicker,
    away: meta ? meta.away : null, home: meta ? meta.home : null,
    label: meta ? `${meta.away} @ ${meta.home}` : eventTicker,
    loading: true, error: null, data: null,
  };
  state.games.push(g);
  state.activeGameId = g.id;
  state.module = 'slate';
  state.slate.view = 'detail';
  loadGameTab(g);
  render();
}

async function loadGameTab(g) {
  try {
    const resp = await fetch('/api/game?event=' + encodeURIComponent(g.eventTicker));
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'request failed');
    g.data = data;
    g.away = data.away; g.home = data.home;
    g.label = `${data.away} @ ${data.home}`;
  } catch (e) {
    g.error = String(e.message || e);
  } finally {
    g.loading = false;
    render();
  }
}

function closeGameTab(id) {
  const i = state.games.findIndex(g => g.id === id);
  if (i === -1) return;
  state.games.splice(i, 1);
  if (state.activeGameId === id) {
    const next = state.games[Math.max(0, i - 1)];
    state.activeGameId = next ? next.id : null;
    if (!next) state.slate.view = 'list';
  }
  render();
}

function backToSlateList() {
  state.slate.view = 'list';
  state.activeGameId = null;
  render();
}

// Team logos (Slate module only). Kalshi codes match ESPN's lowercase
// abbreviations except these three.
const ESPN_LOGO_CODE = { JAC: 'jax', WAS: 'wsh', LAR: 'lar' };
function teamLogo(code, size) {
  if (!code) return '';
  const slug = ESPN_LOGO_CODE[code] || code.toLowerCase();
  return `<img src="https://a.espncdn.com/i/teamlogos/nfl/500/${slug}.png" alt="" width="${size}" height="${size}" loading="lazy" style="flex-shrink:0;object-fit:contain" onerror="this.style.visibility='hidden'">`;
}

function moneylinePct(side) {
  return side && side.implied_prob_yes !== null && side.implied_prob_yes !== undefined ? (side.implied_prob_yes * 100).toFixed(1) + '%' : '--';
}

function renderSlate() {
  const el = document.getElementById('slateView');
  const g = activeGameTab();
  if (state.slate.view === 'detail' && g) { renderGameDetail(el, g); return; }
  if (state.slate.loading && !state.slate.games) { el.innerHTML = `<div class="empty">Loading week…</div>`; return; }
  if (state.slate.error) { el.innerHTML = `<div class="empty" style="color:var(--orange)">${escapeHtml(state.slate.error)}</div>`; return; }
  if (!state.slate.games) { loadSlate(false); el.innerHTML = `<div class="empty">Loading week…</div>`; return; }
  renderGameList(el);
}

function renderGameList(el) {
  const games = state.slate.games;
  const slots = [];
  games.forEach(g => {
    const slot = gameSlot(g);
    const last = slots[slots.length - 1];
    if (last && last.key === slot.key) last.games.push(g);
    else slots.push({ ...slot, games: [g] });
  });
  const week = games.find(g => g.schedule) ? games.find(g => g.schedule).schedule.week : null;
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 4px">
      <span style="font-size:15px;font-weight:600">${week ? 'WEEK ' + week : 'WEEK OVERVIEW'}</span>
      <span class="mono" style="font-size:10.5px;color:var(--dim)">${games.length} GAMES</span>
    </div>
    <div style="flex-grow:1;min-height:0;overflow:auto;padding:0 4px 8px">
      ${slots.map(sl => `
        <div class="slot-head"><span class="sn">${sl.label}</span><span class="sc mono">${sl.games.length} ${sl.games.length === 1 ? 'GAME' : 'GAMES'}</span></div>
        <div class="game-cards">${sl.games.map(renderGameCard).join('')}</div>
      `).join('')}
    </div>`;
}

// Kickoff slot for grouping: early window (1 PM), late window (4:05/4:25),
// and prime time, per day. Uses the nflverse schedule (ET) when available.
function gameSlot(g) {
  const s = g.schedule;
  if (!s) return { key: 'tbd', label: 'OTHER' };
  const day = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long' }).format(new Date(s.gameday + 'T12:00:00Z')).toUpperCase();
  const hour = parseInt(s.gametime, 10);
  const [slot, label] = hour < 12 ? ['am', `${day} MORNING`]
    : hour < 15 ? ['early', `${day} · 1 PM ET`]
    : hour < 19 ? ['late', `${day} · 4 PM ET`]
    : ['night', `${day} NIGHT`];
  return { key: s.gameday + slot, label };
}

function gameKickoffText(g) {
  const s = g.schedule;
  if (!s) return g.kickoff ? formatKickoff(g.kickoff) : '--';
  const [h, m] = s.gametime.split(':').map(Number);
  const day = new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(s.gameday + 'T12:00:00Z')).toUpperCase();
