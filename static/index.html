  html += `<div class="mono" style="padding:8px 4px;font-size:10.5px;color:var(--dim)">${note}</div></div>`;
  body.innerHTML = html;
}

// Season series -> nflverse season-total key + the weekly series whose
// market median gives a next-game expectation.
const SEASON_SERIES_MAP = {
  KXNFLSEASONPASSYDS: { stat: 'passing_yards',   weekly: 'KXNFLPASSYDS', dec: 0 },
  KXNFLSEASONRECYDS:  { stat: 'receiving_yards', weekly: 'KXNFLRECYDS',  dec: 0 },
  KXNFLSEASONRSHYDS:  { stat: 'rushing_yards',   weekly: 'KXNFLRSHYDS',  dec: 0 },
  KXNFLSEASONREC:     { stat: 'receptions',      weekly: 'KXNFLREC',     dec: 1 },
  KXNFLSEASONPASSTDS: { stat: 'passing_tds',     weekly: 'KXNFLPASSTDS', dec: 2 },
  KXNFLSEASONRSHTD:   { stat: 'rushing_tds',     weekly: null,           dec: 2 },
  KXNFLSEASONRECTD:   { stat: 'receiving_tds',   weekly: null,           dec: 2 },
};

// Expected stat for the next game: weekly market median when this game's
// ladder exists, else the player's season per-game average.
function nextGameExpected(d, map, pace) {
  if (map.weekly && SERIES_META[map.weekly]) {
    const rows = groupRows(d.markets.player_props, map.weekly);
    const m = rows.length ? median(rows) : null;
    if (m !== null) return { value: SERIES_META[map.weekly].over ? m : m + 0.5, src: 'mkt' };
  }
  if (pace && pace.games_played) return { value: (pace.totals[map.stat] || 0) / pace.games_played, src: 'avg' };
  return null;
}

function renderSeasonMarkets(body, d, rows, note) {
  const pace = d.season_pace;
  const fmtN = (v, dec) => dec === 0 ? Math.round(v).toLocaleString('en-US') : v.toFixed(dec);
  const sorted = [...rows].sort((a, b) => (a.series || '').localeCompare(b.series || '') || a.threshold - b.threshold);
  const grid = 'grid-template-columns:minmax(0,1fr) 170px 120px 100px';
  let html = `<div style="padding:4px 8px 8px;display:flex;flex-direction:column">
    <div class="mono" style="min-height:18px;display:grid;${grid};align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span style="padding-left:4px">MARKET</span><span>IMPLIED %</span><span class="right">NEED / GAME</span><span class="right">NEXT G EXP</span>
    </div>`;
  sorted.forEach(r => {
    const imp = (r.implied_prob_yes ?? 0) * 100;
    const heldStyle = r.my_position ? 'background:var(--amber-soft)' : '';
    const map = SEASON_SERIES_MAP[r.series];
    let needHtml = '<span style="color:var(--dim)">—</span>', expHtml = needHtml;
    if (map && pace) {
      const target = Math.round(r.threshold + 0.5);
      const have = pace.totals[map.stat] || 0;
      const left = pace.team_games_remaining;
      if (have >= target) needHtml = `<span style="color:var(--blue)">HIT</span>`;
      else if (!left) needHtml = `<span style="color:var(--orange)">0 G LEFT</span>`;
      else needHtml = `<span style="color:var(--on)">${fmtN((target - have) / left, map.dec === 0 ? 1 : 2)}</span>`;
      const exp = nextGameExpected(d, map, pace);
      if (exp) expHtml = `<span style="color:var(--on)">${fmtN(exp.value, map.dec === 0 ? 1 : 2)}</span> <span style="color:var(--dim);font-size:9px">${exp.src}</span>`;
    }
    html += `<div class="mono" style="min-height:20px;padding:2px 0;display:grid;${grid};align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule);${heldStyle}">
      <span style="padding-left:4px;color:var(--muted);white-space:normal">${escapeHtml(r.title)}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="bar-track"><div class="bar-fill" style="width:${imp}%"></div></div>
        <span style="width:36px;text-align:right">${imp.toFixed(1)}</span>
      </div>
      <span class="right">${needHtml}</span>
      <span class="right" style="padding-right:2px">${expHtml}</span>
    </div>`;
  });
  const paceNote = pace
    ? ` Need/game = (target − ${pace.season} season-to-date) ÷ ${pace.team_games_remaining} team games left` +
      (pace.bye_week ? ` (bye wk ${pace.bye_week}${pace.bye_upcoming ? ' still ahead, excluded' : ' already past'})` : '') +
      `. ${pace.games_played} GP. Next G: mkt = weekly ladder median, avg = season per-game avg.`
    : ' Season-to-date stats unavailable.';
  html += `<div class="mono" style="padding:8px 4px;font-size:10.5px;color:var(--dim)">${note}${paceNote}</div></div>`;
  body.innerHTML = html;
}

// ---------- render: implied curve ----------
function renderCurve() {
  const head = document.getElementById('curveTabs');
  const body = document.getElementById('curveBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const d = t.data;
  const seriesIds = seriesPresent(d);
  if (!t.ui.curve || !seriesIds.includes(t.ui.curve)) t.ui.curve = seriesIds[0] || null;
  head.innerHTML = seriesIds.map(s => `<button type="button" class="tab small ${t.ui.curve === s ? 'on' : ''}" data-curve="${s}">${SERIES_META[s].short}</button>`).join('');

  if (!t.ui.curve) { body.innerHTML = `<div class="empty">No priced props for this player.</div>`; return; }
  const meta = SERIES_META[t.ui.curve];
  const rows = groupRows(d.markets.player_props, t.ui.curve);
  const hist = latestHistoryMap(d);
  const lastVal = meta.histKey && hist ? hist[meta.histKey] : null;

  const W = 712, H = 150, pl = 24, pr = 24, pt = 8, pb = 8;
  const t0 = rows[0].threshold, t1 = rows[rows.length - 1].threshold;
  const X = (v) => pl + (t1 === t0 ? 0 : (v - t0) / (t1 - t0)) * (W - pl - pr);
  const Y = (p) => pt + (1 - p / 100) * (H - pt - pb);
  const f = (n) => n.toFixed(1);

  let line = '', dots = '', bidPts = [], askPts = [];
  rows.forEach((r, i) => {
    const x = X(r.threshold), y = Y(r.imp);
    line += (i ? 'L' : 'M') + f(x) + ' ' + f(y);
    dots += `M${f(x - 2.5)} ${f(y)}a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0`;
    bidPts.push(f(x) + ' ' + f(Y((r.yes_bid ?? 0) * 100)));
    askPts.unshift(f(x) + ' ' + f(Y((r.yes_ask ?? 0) * 100)));
  });
  const ri = refIndex(rows), rr = rows[ri], rx = X(rr.threshold), ry = Y(rr.imp);
  const m = median(rows);
  const mx = m === null ? null : X(Math.max(t0, Math.min(t1, m)));
  const lastX = lastVal !== null && lastVal !== undefined ? X(Math.max(t0, Math.min(t1, lastVal))) : null;
  const medFmt = fmtMedian(meta, rows);

  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;padding:0 10px;font-size:10.5px;color:var(--dim)" class="mono">
      <span>MED <span style="color:var(--on)">${medFmt.value}</span></span>
      <span>REF <span style="color:var(--on)">${lineLabel(meta, rr.threshold)} @ ${rr.imp.toFixed(1)}%</span></span>
      ${lastVal !== null && lastVal !== undefined ? `<span>LAST v ${nflverseToKalshi(d.opponent)} <span style="color:var(--amber)">${lastVal}</span></span>` : ''}
    </div>
    <div style="flex-grow:1;display:flex;padding:8px 10px 6px 0">
      <div class="mono" style="width:34px;height:150px;position:relative;font-size:9.5px;color:var(--dim)">
        <span style="position:absolute;right:6px;top:2px">100</span>
        <span style="position:absolute;right:6px;top:38px">75</span>
        <span style="position:absolute;right:6px;top:71px">50</span>
        <span style="position:absolute;right:6px;top:105px">25</span>
        <span style="position:absolute;right:6px;top:138px">0</span>
      </div>
      <div style="display:flex;flex-direction:column">
        <div style="width:${W}px;height:${H}px;position:relative;background:var(--panel-head)">
          <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;left:0;top:0">
            <path d="M10 42.5H${W - 10}M10 109.5H${W - 10}" stroke="#1A2027" stroke-width="1"></path>
            <path d="M10 76H${W - 10}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3"></path>
            <path d="M${bidPts.join('L')}L${askPts.join('L')}Z" fill="rgba(90,169,255,0.16)" stroke="none"></path>
            ${mx !== null ? `<path d="M${f(mx)} ${pt}V${H - pb}" stroke="var(--on)" stroke-width="1" stroke-dasharray="2 3"></path>` : ''}
            ${lastX !== null ? `<path d="M${f(lastX)} ${pt}V${H - pb}" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="5 3"></path>` : ''}
            <path d="${line}" fill="none" stroke="var(--blue)" stroke-width="1.6"></path>
            <path d="${dots}" fill="var(--blue)"></path>
            <path d="M${f(rx - 4)} ${f(ry)}l4 -4l4 4l-4 4z" fill="var(--on)"></path>
          </svg>
        </div>
        <div class="mono" style="width:${W}px;height:16px;position:relative;font-size:9.5px;color:var(--dim)">
          ${rows.map(r => `<span style="position:absolute;top:3px;width:40px;text-align:center;left:${Math.round(X(r.threshold) - 20)}px">${lineLabel(meta, r.threshold)}</span>`).join('')}
        </div>
      </div>
    </div>`;
}

// ---------- render: book & risk ----------
function allMarketsFlat(d) {
  return [...d.markets.player_props, ...d.markets.teammate_props, ...d.markets.team_game_markets, ...d.markets.season_props];
}
function heldPositions(d) {
  return allMarketsFlat(d).filter(m => m.my_position);
}
function positionMath(m) {
  const mid = ((m.yes_bid ?? 0) + (m.yes_ask ?? 0)) / 2 * 100;
  const avg = m.my_position.avg_price_cents, qty = m.my_position.contracts, side = m.my_position.side;
  const mark = side === 'yes' ? mid : 100 - mid;
  const pwin = (side === 'yes' ? (m.implied_prob_yes ?? 0) : 1 - (m.implied_prob_yes ?? 0)) * 100;
  const costC = avg * qty, valC = mark * qty, winC = (100 - avg) * qty;
  return { mid, avg, qty, side, mark, pwin, costC, valC, winC, pnlC: valC - costC };
}

function renderBook() {
  const head = document.getElementById('bookTabs');
  const body = document.getElementById('bookBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const d = t.data;
  const held = heldPositions(d);
  const flagCount = (d.correlations.flags || []).reduce((a, f) => a + f.correlated_with.length, 0);
  const tabs = [
    { id: 'pos', label: 'Positions', count: held.length },
    { id: 'corr', label: 'Correlation', count: flagCount },
    { id: 'exp', label: 'Exposure', count: '' },
  ];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab ${t.ui.risk === tb.id ? 'on' : ''}" data-risk="${tb.id}">${tb.label}${tb.count !== '' ? `<span class="cnt mono">${tb.count}</span>` : ''}</button>`).join('')
    + `<div style="flex-grow:1"></div>` + (held.length === 0 ? '' : '');

  document.getElementById('rightcol').classList.toggle('combo-mode', t.ui.risk === 'corr');
  if (t.ui.risk === 'pos') renderPositions(body, held);
  else if (t.ui.risk === 'corr') renderCorrelation(body, d, t);
  else renderExposure(body, held);
}

// Generic: build a display row + accumulator-friendly numbers for one held
// position. `label` is caller-supplied since ticket markets (SERIES_META-based
// short labels) and Book-module markets (arbitrary series, full titles) name
// things differently.
function buildPositionRow(m, label) {
  const pm = positionMath(m);
  return {
    label, side: pm.side.toUpperCase(), sideFg: pm.side === 'yes' ? 'var(--blue)' : 'var(--orange)',
    qty: pm.qty, avg: pm.avg.toFixed(0) + '¢', mark: pm.mark.toFixed(1) + '¢',
    pnl: signedMoney(pm.pnlC / 100), pnlFg: pm.pnlC >= 0 ? 'var(--blue)' : 'var(--orange)',
    maxWin: money(pm.winC / 100), pwin: pm.pwin.toFixed(1) + '%',
    costC: pm.costC, valC: pm.valC, winC: pm.winC,
  };
}

// Width of the longest string in IBM Plex Mono (0.6em advance) at `fontPx`.
// Tables cap themselves at their content width so leftover space trails the
// row instead of opening a gap between the label and its numbers.
function monoTextPx(strs, fontPx) {
  return Math.ceil(Math.max(0, ...strs.map(x => String(x ?? '').length)) * fontPx * 0.6) + 12;
}

const POS_NUM_COLS_PX = 40 + 40 + 46 + 46 + 64 + 64 + 60;
function positionsTableHtml(rows, labelPx) {
  labelPx = labelPx || monoTextPx(rows.map(p => p.label), 11);
  return `<div style="max-width:${labelPx + POS_NUM_COLS_PX}px"><div class="mono" style="height:18px;display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 46px 46px 64px 64px 60px;align-items:center;font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>CONTRACT</span><span>SIDE</span><span class="right">QTY</span><span class="right">AVG</span><span class="right">MARK</span><span class="right">P&amp;L</span><span class="right">MAX WIN</span><span class="right">P(WIN)</span>
    </div>
    ${rows.map(p => `<div class="mono" style="height:22px;display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 46px 46px 64px 64px 60px;align-items:center;font-size:11px;border-bottom:1px solid var(--row-rule)">
      <span style="color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.label)}</span>
      <span style="color:${p.sideFg};font-weight:600">${p.side}</span>
      <span class="right">${p.qty}</span><span class="right" style="color:var(--muted)">${p.avg}</span>
      <span class="right">${p.mark}</span><span class="right" style="color:${p.pnlFg}">${p.pnl}</span>
      <span class="right" style="color:var(--muted)">${p.maxWin}</span><span class="right">${p.pwin}</span>
    </div>`).join('')}</div>`;
}

function positionsTilesHtml(rows) {
  let cost = 0, val = 0, maxWin = 0, qty = 0;
  rows.forEach(p => { cost += p.costC; val += p.valC; maxWin += p.winC; qty += p.qty; });
  const upnl = val - cost;
  const tiles = [
    { l: 'CONTRACTS', v: String(qty) }, { l: 'COST', v: money(cost / 100) }, { l: 'MKT VALUE', v: money(val / 100) },
    { l: 'UNREAL P&L', v: signedMoney(upnl / 100), fg: upnl >= 0 ? 'var(--blue)' : 'var(--orange)' },
    { l: 'MAX PAYOUT', v: money((maxWin + cost) / 100) },
  ];
  return `<div class="stat-tiles" style="margin-top:0;grid-template-columns:repeat(${tiles.length},minmax(0,1fr))">${tiles.map(x => `<div class="stat-tile"><span class="sl">${x.l}</span><span class="sv mono" style="color:${x.fg || 'var(--on)'}">${x.v}</span></div>`).join('')}</div>`;
}

function renderPositions(body, held) {
  if (!held.length) { body.innerHTML = `<div class="empty">No open Kalshi positions on this player's markets.</div>`; return; }
  const rows = held.map(m => buildPositionRow(m, m.stat + ' ' + lineLabel(SERIES_META[m.series] || {}, m.threshold)));
  body.innerHTML = `<div style="padding:8px">${positionsTilesHtml(rows)}<div style="margin-top:8px">${positionsTableHtml(rows)}</div></div>`;
}

// ---------- combo builder (Correlation tab) ----------
// The grid is the picker: rows are the searched player's stat lines, columns
// are the teammate / team-total lines the correlation rules link them to.
// Clicking a row label or column header toggles that line into the combo
// slip underneath, which prices it (independent odds), checks it against
// Kalshi's combo rules server-side, and can pull a live maker quote via RFQ.
const COMBO_POLL_MS = 1500;
const COMBO_POLL_MAX_MS = 45000;

function loadUnitSize() { try { const v = Number(localStorage.getItem('combo.unit')); return v > 0 ? v : 10; } catch (e) { return 10; } }
function saveUnitSize(v) { try { localStorage.setItem('combo.unit', String(v)); } catch (e) {} }

function comboState(t) {
  if (!t.combo) t.combo = { legs: [], check: null, checkSig: null, checking: false, seq: 0, timer: null,
    quote: null, unit: loadUnitSize(), units: 1, armed: null, flash: null };
  return t.combo;
}

function familyKey(m) { return m.series + '|' + (m.player_id || m.team_code || m.player_name || ''); }
function gameMarkets(d) { return [...d.markets.player_props, ...d.markets.teammate_props, ...d.markets.team_game_markets]; }
function marketIdx(d) {
  if (!d._mktIdx) { d._mktIdx = {}; gameMarkets(d).forEach(m => { d._mktIdx[m.ticker] = m; }); }
  return d._mktIdx;
}
function familyLadder(d, key) { return gameMarkets(d).filter(m => familyKey(m) === key).sort((a, b) => a.threshold - b.threshold); }
function closestToCoinflip(ms) {
  const priced = ms.filter(m => m.implied_prob_yes !== null && m.implied_prob_yes !== undefined);
  if (!priced.length) return null;
  return priced.reduce((a, b) => Math.abs(b.implied_prob_yes - 0.5) < Math.abs(a.implied_prob_yes - 0.5) ? b : a);
}
function eventOf(m) { return m.event_ticker || m.ticker.split('-').slice(0, 2).join('-'); }
function comboEligible(d, m) {
  const ev = d.correlations.combo_eligible_events;
  return !ev || !ev.length || ev.includes(eventOf(m));
}
function legSig(legs) { return legs.map(l => l.ticker + ':' + l.side).join(','); }

function comboGrid(d) {
  const idx = marketIdx(d);
  const fams = {};
  d.markets.player_props.forEach(m => { (fams[familyKey(m)] = fams[familyKey(m)] || []).push(m); });
  const order = Object.keys(SERIES_META);
  const rows = Object.entries(fams).map(([key, ms]) => ({ key, rep: closestToCoinflip(ms) })).filter(r => r.rep)
    .sort((a, b) => order.indexOf(a.rep.series) - order.indexOf(b.rep.series));
  const cols = [], colSeen = {}, links = {};
  (d.correlations.flags || []).forEach(f => {
    const rm = idx[f.ticker];
    if (!rm) return;
    const rk = familyKey(rm);
    f.correlated_with.forEach(c => {
      const cm = idx[c.ticker] || c;
      const ck = familyKey(cm);
      if (!colSeen[ck]) { colSeen[ck] = true; cols.push({ key: ck, rep: cm, reason: c.reason }); }
      (links[rk] = links[rk] || new Set()).add(ck);
    });
  });
  return { rows, cols, links };
}

function sideProb(m, side) {
  const p = m.implied_prob_yes;
  if (p === null || p === undefined) return null;
  return side === 'yes' ? p : 1 - p;
}
function sideLine(m, side) {
  const meta = SERIES_META[m.series] || {};
  if (side === 'yes') return lineLabel(meta, m.threshold);
  return 'U' + (meta.over ? m.threshold : Math.round(m.threshold + 0.5));
}
function whoLabel(m) {
  return m.player_name ? m.player_name.split(' ').pop().toUpperCase() : (m.team_code || 'TEAM') + ' TT';
}
function statShort(m) { return SERIES_META[m.series] ? SERIES_META[m.series].short : (m.series === 'KXNFLTEAMTOTAL' ? 'Team Total' : m.stat); }
const cents = (p) => p === null || p === undefined ? '--' : Math.round(p * 100) + '¢';
const fmtUnits = (u) => u === null || u === undefined ? '--' : '+' + (u >= 10 ? u.toFixed(1) : u.toFixed(2)) + 'u';
const fmtAmerican = (a) => a === null || a === undefined ? '--' : (a > 0 ? '+' : '') + a;
function americanOdds(p) {
  if (!p || p <= 0 || p >= 1) return null;
  return p >= 0.5 ? Math.round(-100 * p / (1 - p)) : Math.round(100 * (1 - p) / p);
}

// Running (independent) combo odds after each leg. Prefers fresh prices from
// the last server check when it matches the current slip.
function comboPricing(d, cs) {
  const idx = marketIdx(d);
  const fresh = cs.check && cs.checkSig === legSig(cs.legs) ? cs.check.legs : null;
  let p = 1;
  return cs.legs.map((l, i) => {
    const q = fresh && fresh[i].prob !== null ? fresh[i].prob : sideProb(idx[l.ticker] || {}, l.side);
    p = (p === null || q === null) ? null : p * q;
    return { prob: q, run: p, units: p ? 1 / p - 1 : null, american: americanOdds(p) };
  });
}

// Background refreshes (validation results, quote polling) skip the redraw
// while a stake input has focus so typing isn't interrupted.
function rerenderCombo(t) {
  if (activeTicket() !== t || t.ui.risk !== 'corr') return;
  const a = document.activeElement;
  if (a && a.dataset && a.dataset.comboInput) return;
  renderBook();
}

function comboChanged(t) {
  const cs = comboState(t);
  cs.armed = null;
  if (cs.quote) { stopQuotePolling(cs); if (cs.quote.rfq_id) cancelRfq(cs.quote.rfq_id); cs.quote = null; }
  scheduleComboCheck(t);
  renderBook();
}

function scheduleComboCheck(t) {
  const cs = comboState(t);
  clearTimeout(cs.timer);
  if (!cs.legs.length) { cs.check = null; cs.checkSig = null; cs.checking = false; return; }
  cs.checking = true;
  cs.timer = setTimeout(async () => {
    const seq = ++cs.seq;
    const sig = legSig(cs.legs);
    try {
      const resp = await fetch('/api/combo/validate', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ legs: cs.legs.map(l => ({ market_ticker: l.ticker, side: l.side })) }) });
      const data = await resp.json();
      if (seq !== cs.seq) return;
      cs.check = resp.ok ? data : { ok: false, legs: [], issues: [{ level: 'error', msg: data.error || 'check failed' }] };
    } catch (e) {
      if (seq !== cs.seq) return;
      cs.check = { ok: false, legs: [], issues: [{ level: 'error', msg: 'check failed: ' + e }] };
    }
    cs.checkSig = sig;
    cs.checking = false;
    rerenderCombo(t);
  }, 250);
}

function cancelRfq(rfqId) {
  fetch('/api/combo/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rfq_id: rfqId }) }).catch(() => {});
}
function stopQuotePolling(cs) { if (cs.quote && cs.quote.poll) { clearInterval(cs.quote.poll); cs.quote.poll = null; } }

async function requestComboQuote(t) {
  const cs = comboState(t);
  const stake = cs.unit * cs.units;
  cs.quote = { phase: 'requesting', started: Date.now() };
  renderBook();
  try {
    const resp = await fetch('/api/combo/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ legs: cs.legs.map(l => ({ market_ticker: l.ticker, side: l.side })), stake_dollars: stake }) });
    const data = await resp.json();
    if (!cs.quote || cs.quote.phase !== 'requesting') { if (resp.ok) cancelRfq(data.rfq_id); return; }
    if (!resp.ok) { cs.quote = { phase: 'error', error: data.error || 'quote request failed' }; renderBook(); return; }
    cs.quote = { phase: 'waiting', started: Date.now(), stake, rfq_id: data.rfq_id, market_ticker: data.market_ticker,
      collection: data.collection, title: data.title, quotes: [], best: null, poll: null };
    cs.quote.poll = setInterval(() => pollComboQuotes(t), COMBO_POLL_MS);
    pollComboQuotes(t);
  } catch (e) {
    cs.quote = { phase: 'error', error: String(e) };
  }
  renderBook();
}

async function pollComboQuotes(t) {
  const cs = comboState(t);
  const q = cs.quote;
  if (!q || !q.rfq_id) return;
  if (Date.now() - q.started > COMBO_POLL_MAX_MS) {
    stopQuotePolling(cs);
    if (!q.quotes.length) q.phase = 'expired';
    rerenderCombo(t);
    return;
  }
  try {
    const resp = await fetch('/api/combo/quotes?rfq_id=' + encodeURIComponent(q.rfq_id));
    const data = await resp.json();
    if (cs.quote !== q) return;
    if (!resp.ok) { q.pollError = data.error; }
    else {
      q.pollError = null;
      q.quotes = data.quotes || [];
      q.best = data.best;
      q.rfqStatus = data.rfq_status;
      if (q.best) q.phase = 'quoted';
    }
  } catch (e) { q.pollError = String(e); }
  rerenderCombo(t);
}

async function acceptComboQuote(t, quoteId) {
  const cs = comboState(t);
  const q = cs.quote;
  if (!q) return;
  stopQuotePolling(cs);
  q.phase = 'accepting';
  renderBook();
  try {
    const resp = await fetch('/api/combo/accept', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rfq_id: q.rfq_id, quote_id: quoteId, side: 'yes' }) });
    const data = await resp.json();
    q.phase = resp.ok ? 'accepted' : 'error';
    q.error = resp.ok ? null : (data.error || 'accept failed');
    q.acceptMsg = resp.ok ? data.status : null;
  } catch (e) { q.phase = 'error'; q.error = String(e); }
  cs.armed = null;
  renderBook();
}

function handleComboClick(el, t) {
  const d = t.data, cs = comboState(t), act = el.dataset.combo, key = el.dataset.key;
  const i = cs.legs.findIndex(l => l.key === key);
  cs.flash = null;
  if (act === 'toggle') {
    if (i >= 0) cs.legs.splice(i, 1);
    else {
      const m = marketIdx(d)[el.dataset.ticker];
      if (!m) return;
      if (!comboEligible(d, m)) { cs.flash = `${statShort(m)} isn't offered in Kalshi combos.`; renderBook(); return; }
      cs.legs.push({ key, ticker: m.ticker, side: 'yes' });
    }
    comboChanged(t);
  } else if (act === 'side' && i >= 0) {
    cs.legs[i].side = el.dataset.side; comboChanged(t);
  } else if (act === 'step' && i >= 0) {
    const ladder = familyLadder(d, key);
    const j = ladder.findIndex(m => m.ticker === cs.legs[i].ticker) + Number(el.dataset.dir);
    if (j < 0 || j >= ladder.length) return;
    cs.legs[i].ticker = ladder[j].ticker; comboChanged(t);
  } else if (act === 'remove' && i >= 0) {
    cs.legs.splice(i, 1); comboChanged(t);
  } else if (act === 'clear') {
    cs.legs = []; comboChanged(t);
  } else if (act === 'quote') {
    requestComboQuote(t);
  } else if (act === 'cancel') {
    if (cs.quote) { stopQuotePolling(cs); if (cs.quote.rfq_id) cancelRfq(cs.quote.rfq_id); }
    cs.quote = null; cs.armed = null; renderBook();
  } else if (act === 'accept') {
    // Two-step in-page confirm (no browser dialogs): first click arms, second places.
    const qid = el.dataset.quote;
    if (cs.armed !== qid) {
      cs.armed = qid; renderBook();
      setTimeout(() => { if (cs.armed === qid) { cs.armed = null; if (activeTicket() === t) renderBook(); } }, 6000);
    } else acceptComboQuote(t, qid);
  }
}

function handleComboInput(el, t) {
  const cs = comboState(t);
  const v = Number(el.value);
  if (!(v > 0)) { renderBook(); return; }
  if (el.dataset.comboInput === 'unit') { cs.unit = v; saveUnitSize(v); }
  else cs.units = v;
  if (cs.quote && cs.quote.phase !== 'accepted') {
    // The RFQ was sized to the old stake; drop it rather than quote the wrong size.
    stopQuotePolling(cs); if (cs.quote.rfq_id) cancelRfq(cs.quote.rfq_id); cs.quote = null;
  }
  renderBook();
}

function renderCorrelation(body, d, t) {
  const cs = comboState(t);
  const g = comboGrid(d);
  if (!g.rows.length) { body.innerHTML = `<div class="empty">No priced props for this player.</div>`; return; }
  const idx = marketIdx(d);
  const sel = {};
  cs.legs.forEach(l => { sel[l.key] = l; });
  const shown = (key, rep) => (sel[key] && idx[sel[key].ticker]) || rep;
  const cols = `grid-template-columns:150px repeat(${g.cols.length},minmax(46px,1fr)) 22px`;
  const pname = d.player.name.split(' ').pop().toUpperCase();

  let html = `<div style="padding:6px 8px 8px;display:flex;flex-direction:column">
    <div class="combo-legend">
      <span><span class="swatch" style="background:var(--blue)"></span>QB ↔ PASS-CATCHER</span>
      <span><span class="swatch" style="background:var(--amber)"></span>TEAM TOTAL</span>
      <span style="color:var(--muted)">Click a row or column to add it to the combo</span>
    </div>
    <div class="mono combo-colhead" style="${cols}">
      <span style="letter-spacing:0.06em;align-self:end">${escapeHtml(pname)} ↓ / LEG →</span>
      ${g.cols.map(c => {
        const m = shown(c.key, c.rep), on = !!sel[c.key], elig = comboEligible(d, m);
        const side = on ? sel[c.key].side : 'yes';
        return `<button type="button" class="combo-col ${on ? 'on' : ''} ${elig ? '' : 'inelig'}" data-combo="toggle" data-key="${escapeHtml(c.key)}" data-ticker="${escapeHtml(m.ticker)}"
          title="${escapeHtml((m.title || '') + (elig ? '' : ' · not offered in Kalshi combos'))}">
          <span>${escapeHtml(whoLabel(m))} ${escapeHtml(sideLine(m, side))}</span><span>${escapeHtml(statShort(m))}</span><span class="px">${cents(sideProb(m, side))}</span>
        </button>`;
      }).join('')}
      <span class="right" style="align-self:end">Σ</span>
    </div>
    ${g.rows.map(r => {
      const m = shown(r.key, r.rep), on = !!sel[r.key], elig = comboEligible(d, m);
      const side = on ? sel[r.key].side : 'yes';
      const linked = g.links[r.key] || new Set();
      return `<div class="mono combo-row ${on ? 'on' : ''}" style="${cols}">
        <button type="button" class="combo-rowbtn ${elig ? '' : 'inelig'}" data-combo="toggle" data-key="${escapeHtml(r.key)}" data-ticker="${escapeHtml(m.ticker)}"
          title="${escapeHtml((m.title || '') + (elig ? '' : ' · not offered in Kalshi combos'))}">
          <span class="box">${on ? '✓' : ''}</span>
          <span class="nm">${escapeHtml(statShort(m))} ${escapeHtml(sideLine(m, side))}</span>
          <span class="px">${elig ? cents(sideProb(m, side)) : 'n/a'}</span>
        </button>
        ${g.cols.map(c => {
          const hit = linked.has(c.key), colOn = !!sel[c.key];
          const both = on && colOn, one = on || colOn;
          const bg = hit ? (c.reason === 'same-team total over' ? 'var(--amber)' : 'var(--blue)') : '#1A2027';
          const op = hit ? (both ? 1 : one ? 0.7 : 0.35) : 1;
          const mark = hit ? (both ? '●' : '+') : (both ? '·' : '');
          return `<span style="display:flex;justify-content:center"><span class="combo-cell ${both ? 'pair' : ''}" style="background:${bg};opacity:${op};color:${hit ? '#07090B' : 'var(--dim)'}">${mark}</span></span>`;
        }).join('')}
        <span class="right" style="color:var(--amber)">${linked.size || ''}</span>
      </div>`;
    }).join('')}
  </div>`;
  html += comboSlipHtml(d, cs);
  body.innerHTML = html;
}

function comboSlipHtml(d, cs) {
  const idx = marketIdx(d);
  const fresh = cs.check && cs.checkSig === legSig(cs.legs) ? cs.check : null;
  const price = comboPricing(d, cs);
  const fin = price.length ? price[price.length - 1] : null;
  const stake = cs.unit * cs.units;
  const slipCols = 'grid-template-columns:18px minmax(0,1fr) 72px 92px 40px 50px 58px 18px';

  let html = `<div class="combo-slip">
    <div class="combo-slip-head">
      <span class="panel-title" style="margin:0">COMBO SLIP</span>
      <span class="mono" style="font-size:10px;color:var(--dim)">${cs.legs.length} leg${cs.legs.length === 1 ? '' : 's'}${d.correlations.combo_collection ? ' · ' + escapeHtml(d.correlations.combo_collection) : ''}</span>
      <span style="flex-grow:1"></span>
      ${cs.checking ? `<span class="mono" style="font-size:10px;color:var(--dim)">checking…</span>` : ''}
      ${cs.legs.length ? `<button type="button" class="backlink" data-combo="clear">clear</button>` : ''}
    </div>`;
  if (cs.flash) html += `<div class="combo-msg err">${escapeHtml(cs.flash)}</div>`;
  if (!cs.legs.length) {
    return html + `<div class="empty" style="padding:12px">No legs yet. Rows are ${escapeHtml(d.player.name)}'s lines; columns are the teammate and team-total lines they move with. A filled ● cell means both sides of a correlated pair are in your combo.</div></div>`;
  }

  html += `<div class="mono combo-slip-grid" style="${slipCols};font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
    <span>#</span><span>LEG</span><span>SIDE</span><span>LINE</span><span class="right">PROB</span><span class="right">COMBO</span><span class="right">PAYS</span><span></span>
  </div>`;
  cs.legs.forEach((l, i) => {
    const m = idx[l.ticker] || { ticker: l.ticker, series: '', threshold: 0 };
    const chk = fresh && fresh.legs[i];
    const ladder = familyLadder(d, l.key);
    const at = ladder.findIndex(x => x.ticker === l.ticker);
    const p = price[i];
    const errs = chk ? chk.errors : [], warns = chk ? chk.warnings : [];
    html += `<div class="mono combo-slip-grid" style="${slipCols};font-size:11px;min-height:22px;${errs.length ? 'background:rgba(255,122,69,0.08)' : ''}">
      <span style="color:${errs.length ? 'var(--orange)' : chk ? 'var(--blue)' : 'var(--dim)'}" title="${escapeHtml([...errs, ...warns].join(' · ') || (chk ? 'valid combo leg' : 'checking'))}">${errs.length ? '✗' : chk ? '✓' : '·'}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--on)">${escapeHtml(whoLabel(m))} <span style="color:var(--muted)">${escapeHtml(statShort(m))}</span></span>
      <span class="seg"><button type="button" class="${l.side === 'yes' ? 'on' : ''}" data-combo="side" data-side="yes" data-key="${escapeHtml(l.key)}">YES</button><button type="button" class="${l.side === 'no' ? 'on' : ''}" data-combo="side" data-side="no" data-key="${escapeHtml(l.key)}">NO</button></span>
      <span class="stepper"><button type="button" data-combo="step" data-dir="-1" data-key="${escapeHtml(l.key)}" ${at <= 0 ? 'disabled' : ''}>◀</button><span>${escapeHtml(sideLine(m, l.side))}</span><button type="button" data-combo="step" data-dir="1" data-key="${escapeHtml(l.key)}" ${at < 0 || at >= ladder.length - 1 ? 'disabled' : ''}>▶</button></span>
      <span class="right">${cents(p.prob)}</span>
      <span class="right" style="color:var(--label)">${p.run === null ? '--' : (p.run * 100).toFixed(1) + '%'}</span>
      <span class="right" style="color:var(--amber)">${fmtUnits(p.units)}</span>
      <button type="button" class="combo-x" data-combo="remove" data-key="${escapeHtml(l.key)}" aria-label="Remove leg">×</button>
    </div>`;
    [...errs.map(x => ['err', x]), ...warns.map(x => ['warn', x])].forEach(([k, x]) => {
      html += `<div class="combo-msg ${k}" style="padding-left:22px">${escapeHtml(x)}</div>`;
    });
  });
  if (fresh) fresh.issues.forEach(x => { html += `<div class="combo-msg ${x.level === 'error' ? 'err' : 'warn'}">${escapeHtml(x.msg)}</div>`; });

  const toWinFair = fin && fin.units !== null ? stake * fin.units : null;
  html += `<div class="stat-tiles" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-top:8px">
    <div class="stat-tile"><span class="sl">INDEP. PROB</span><span class="sv mono">${fin && fin.run !== null ? (fin.run * 100).toFixed(1) + '%' : '--'}</span></div>
    <div class="stat-tile"><span class="sl">FAIR ODDS</span><span class="sv mono">${fmtAmerican(fin && fin.american)}</span></div>
    <div class="stat-tile"><span class="sl">PAYS / 1u</span><span class="sv mono" style="color:var(--amber)">${fmtUnits(fin && fin.units)}</span></div>
    <div class="stat-tile"><span class="sl">STAKE</span><span class="sv mono combo-stake">
      <input class="mono" type="number" min="0.5" step="0.5" value="${cs.units}" data-combo-input="units" aria-label="Units to stake">u ×
      $<input class="mono" type="number" min="1" step="1" value="${cs.unit}" data-combo-input="unit" aria-label="Dollars per unit"></span></div>
    <div class="stat-tile"><span class="sl">TO WIN (FAIR)</span><span class="sv mono" style="color:var(--blue)">${toWinFair === null ? '--' : money(toWinFair)}</span></div>
  </div>`;
  html += comboQuoteHtml(cs, fresh, fin, stake);
  return html + `</div>`;
}

function comboQuoteHtml(cs, fresh, fin, stake) {
  const q = cs.quote;
  const ready = fresh && fresh.ok && !cs.checking;
  let html = `<div class="combo-quote">`;
  if (!q) {
    const why = cs.checking ? 'checking legs…' : !fresh ? 'waiting for leg check' : !fresh.ok ? 'fix the ✗ legs above to request a quote' : '';
    html += `<button type="button" class="combo-btn" data-combo="quote" ${ready ? '' : 'disabled'}>GET KALSHI QUOTE · ${money(stake)}</button>
      <span class="combo-note">${escapeHtml(why || 'Creates the combo on Kalshi and asks market makers to price it (RFQ). Nothing is bought until you accept.')}</span>`;
    return html + `</div>`;
  }
  if (q.phase === 'requesting') return html + `<span class="combo-note">Creating combo market and sending RFQ…</span></div>`;
  if (q.phase === 'error') {
    return html + `<span class="combo-msg err" style="padding:0">${escapeHtml(q.error)}</span>
      <button type="button" class="backlink" data-combo="cancel">dismiss</button></div>`;
  }
  const secs = Math.round((Date.now() - q.started) / 1000);
  html += `<div style="display:flex;flex-direction:column;gap:4px;width:100%">
    <div class="mono" style="display:flex;gap:10px;align-items:center;font-size:10px;color:var(--dim)">
      <span title="${escapeHtml(q.title || '')}">COMBO ${escapeHtml(q.market_ticker || '')}</span>
      <span>RFQ ${escapeHtml((q.rfq_id || '').slice(0, 8))}</span>
      <span style="flex-grow:1"></span>
      ${q.phase === 'waiting' ? `<span>waiting for makers… ${secs}s</span>` : ''}
      ${q.phase !== 'accepted' ? `<button type="button" class="backlink" data-combo="cancel">cancel RFQ</button>` : ''}
    </div>`;
  if (q.pollError) html += `<div class="combo-msg warn" style="padding:0">${escapeHtml(q.pollError)}</div>`;
  if (q.phase === 'expired') html += `<div class="combo-msg warn" style="padding:0">No maker quoted this combo within ${COMBO_POLL_MAX_MS / 1000}s. Makers skip some leg mixes; try fewer or more mainstream legs, then request again.</div>`;
  if (q.phase === 'accepted') html += `<div class="combo-msg" style="padding:0;color:var(--blue)">Accepted: ${escapeHtml(q.acceptMsg || '')}. Check Kalshi fills to confirm execution.</div>`;
  const live = (q.quotes || []).filter(x => x.yes_cost).sort((a, b) => a.yes_cost - b.yes_cost);
  if (live.length) {
    const qc = 'grid-template-columns:70px 64px 64px 80px minmax(0,1fr) 150px';
    html += `<div class="mono combo-slip-grid" style="${qc};font-size:9.5px;letter-spacing:0.06em;color:var(--dim);border-bottom:1px solid var(--head-rule)">
      <span>YES COST</span><span>ODDS</span><span class="right">PAYS</span><span class="right">TO WIN</span><span class="right">vs INDEP.</span><span></span></div>`;
    live.forEach((x, i) => {
      const vs = fin && fin.run ? x.yes_cost / fin.run - 1 : null;
      const armed = cs.armed === x.id;
      const canAccept = fresh && fresh.accept_enabled && q.phase === 'quoted' && i === 0;
      html += `<div class="mono combo-slip-grid" style="${qc};font-size:11px;min-height:22px;${i === 0 ? 'background:var(--amber-soft)' : ''}">
        <span>${cents(x.yes_cost)}</span><span>${fmtAmerican(x.yes_american)}</span>
        <span class="right" style="color:var(--amber)">${fmtUnits(x.yes_units)}</span>
        <span class="right" style="color:var(--blue)">${x.yes_units ? money(q.stake * x.yes_units) : '--'}</span>
        <span class="right" style="color:${vs === null ? 'var(--dim)' : vs > 0 ? 'var(--ask)' : 'var(--blue)'}" title="Quote price vs. multiplying the legs' odds together. Above 0 = Kalshi prices the combo as likelier than independent (correlation) and/or maker margin.">${vs === null ? '--' : (vs > 0 ? '+' : '') + (vs * 100).toFixed(0) + '%'}</span>
        <span class="right">${canAccept ? `<button type="button" class="combo-btn ${armed ? 'armed' : ''}" data-combo="accept" data-quote="${escapeHtml(x.id)}">${armed ? `CONFIRM ${money(q.stake)} @ ${cents(x.yes_cost)}` : 'ACCEPT YES'}</button>` : ''}</span>
      </div>`;
    });
    if (fresh && !fresh.accept_enabled) html += `<div class="combo-note">Placing is off. Start the server with KALSHI_ENABLE_COMBO_ACCEPT=1 to enable ACCEPT, or place this combo in the Kalshi app.</div>`;
  }
  return html + `</div></div>`;
}

function renderExposure(body, held) {
  if (!held.length) { body.innerHTML = `<div class="empty">No open positions to size exposure against.</div>`; return; }
  const rows = held.map(m => {
    const pm = positionMath(m);
    return { label: `${m.stat} ${lineLabel(SERIES_META[m.series] || {}, m.threshold)} ${pm.side.toUpperCase()}`, riskC: pm.costC, winC: pm.winC };
  });
  const maxE = Math.max(...rows.map(r => Math.max(r.riskC, r.winC)), 1);
  body.innerHTML = `<div style="padding:8px;display:flex;flex-direction:column;gap:6px">
    <div class="mono" style="font-size:9.5px;letter-spacing:0.06em;color:var(--dim);display:grid;grid-template-columns:150px minmax(0,1fr) 70px 70px;gap:8px;border-bottom:1px solid var(--head-rule);padding-bottom:4px">
      <span>POSITION</span><span>AT RISK ◀ │ ▶ TO WIN</span><span class="right">RISK</span><span class="right">WIN</span>
    </div>
    ${rows.map(r => `<div class="mono" style="display:grid;grid-template-columns:150px minmax(0,1fr) 70px 70px;gap:8px;align-items:center;font-size:11px;height:22px">
      <span style="color:var(--on);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.label)}</span>
      <div style="display:flex;height:10px">
        <div style="flex-basis:50%;display:flex;justify-content:flex-end;border-right:1px solid var(--faint)"><div style="width:${Math.round(r.riskC/maxE*100)}%;background:var(--orange)"></div></div>
        <div style="flex-basis:50%;display:flex"><div style="width:${Math.round(r.winC/maxE*100)}%;background:var(--blue)"></div></div>

}

// ---------- render: matchup ----------
function rankRow(label, val, rankObj, dir) {
  if (!rankObj) return { label, val, rank: '—', w: 0, fill: C.neutral, rankFg: C.off };
  const rank = rankObj.rank, outOf = rankObj.out_of;
  const fill = favorColor(rank, outOf, dir);
  return { label, val, rank: '#' + rank, w: Math.round((outOf + 1 - rank) / outOf * 100), fill, rankFg: fill };
}

function renderMatchup() {
  const head = document.getElementById('matchTabs');
  const body = document.getElementById('matchBody');
  const t = activeTicket();
  if (!t || !t.data) { head.innerHTML = ''; body.innerHTML = ''; return; }
  const d = t.data;
  const oppKalshi = nflverseToKalshi(d.opponent);
  const ownKalshi = d.player.team_kalshi;
  const tabs = [{ id: 'def', label: `${oppKalshi} Def` }, { id: 'off', label: `${ownKalshi} Off` }, { id: 'env', label: 'Game' }];
  head.innerHTML = tabs.map(tb => `<button type="button" class="tab small ${t.ui.match === tb.id ? 'on' : ''}" data-match="${tb.id}">${tb.label}</button>`).join('');

  let rows = [], note = '';
  if (t.ui.match === 'def') {
    const o = d.opponent_defense;
    if (o) {
      rows = [
        rankRow('EPA / dropback allowed', fmt1(o.epa_per_dropback_allowed), o.epa_per_dropback_allowed_rank, 'opp'),
        rankRow('EPA / rush allowed', fmt1(o.epa_per_rush_allowed), o.epa_per_rush_allowed_rank, 'opp'),

      ];
      note = o.coverage_scheme_note + ' Bar length = rank (#1 longest).';
    }

    if (tc) {
      rows = [
        rankRow('O-line pressure allowed', fmtPctVal(tc.pressure_pct_allowed), tc.pressure_pct_allowed_rank, 'own'),
        rankRow('Sacks allowed', fmt1(tc.sacks_allowed), tc.sacks_allowed_rank, 'own'),
        rankRow('Plays / game (pace)', fmt1(tc.plays_per_game), null),

        rankRow('Rest days (opp)', `${env.rest_days} (${env.opponent_rest_days})`, null),
        rankRow('Roof / surface', `${env.roof || '--'} / ${env.surface || '--'}`, null),
